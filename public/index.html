            renderLibrary();
          });
        }

        // Progressive auto-collapse filter on scroll (Spotify-style)
        // Remove old listener if exists
        if (state.library.scrollListener) {
          const oldScroller = document.querySelector('#virtualWrap .relative.w-full.h-full.overflow-auto');
          if (oldScroller) {
            oldScroller.removeEventListener('scroll', state.library.scrollListener);
          }
          state.library.scrollListener = null;
        }
        
        let lastScrollY = 0;
        let isCollapsing = false;
        const SCROLL_THRESHOLD = 20; // Start collapsing after minimal scroll
        const COLLAPSE_DISTANCE = 80; // Distance to fully collapse
        
        const virtualWrap = document.querySelector('#virtualWrap');
        const mainHeader = document.getElementById('mainHeader');
        const headerSpacer = document.getElementById('headerSpacer');
        let headerHidden = false;
        
        // Wait for virtualizer to mount, then attach scroll listener
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const scroller = virtualWrap?.querySelector('.relative.w-full.h-full.overflow-auto');
            const filterContent = document.querySelector('#filterContent');
            const filterPanel = document.querySelector('#filterPanel');
            
            if (scroller && filterContent && filterPanel) {
              // Get initial full height
              let fullHeight = 0;
              if (!state.ui.filterCollapsed) {
                filterContent.style.maxHeight = 'none';
                filterContent.style.opacity = '1';
                fullHeight = filterContent.scrollHeight;
                filterContent.style.maxHeight = fullHeight + 'px';
              }
              
              const handleScroll = () => {
                const currentScrollY = scroller.scrollTop;
                const scrollDelta = currentScrollY - lastScrollY;
                
                // ===== HEADER AUTO-HIDE LOGIC =====
                const HEADER_HIDE_THRESHOLD = 100; // Hide header after scrolling down 100px
                
                // Get current header height (responsive)
                const getHeaderHeight = () => {
                  if (window.innerWidth <= 380) return 48; // Ultra-small phones
                  if (window.innerWidth <= 640) return 52; // Mobile
                  if (window.innerWidth <= 768) return 56; // Tablet
                  return 64; // Desktop
                };
                
                // Hide header when scrolling down
                if (scrollDelta > 5 && currentScrollY > HEADER_HIDE_THRESHOLD && !headerHidden && mainHeader) {
                  headerHidden = true;
                  mainHeader.classList.add('header-hidden');
                  // IMMEDIATELY collapse spacer to reclaim space
                  if (headerSpacer) {
                    headerSpacer.style.height = '0px';
                    headerSpacer.style.marginBottom = '0px';
                  }
                }
                // Show header when scrolling up or near top
                else if ((scrollDelta < -5 || currentScrollY < 50) && headerHidden && mainHeader) {
                  headerHidden = false;
                  mainHeader.classList.remove('header-hidden');
                  // IMMEDIATELY restore spacer with responsive height
                  if (headerSpacer) {
                    const headerHeight = getHeaderHeight();
                    headerSpacer.style.height = headerHeight + 'px';
                    headerSpacer.style.marginBottom = '';
                  }
                }
                
                // ===== FILTER COLLAPSE LOGIC (unchanged) =====
                // Scrolling down - progressively collapse
                if (scrollDelta > 0 && currentScrollY > SCROLL_THRESHOLD) {
                  if (!isCollapsing && !state.ui.filterCollapsed) {
                    isCollapsing = true;
                    // Ensure we have the full height
                    if (fullHeight === 0) {
                      filterContent.style.maxHeight = 'none';
                      fullHeight = filterContent.scrollHeight;
                    }
                  }
                  
                  if (isCollapsing && !state.ui.filterCollapsed) {
                    // Calculate collapse progress (0 to 1)
                    const scrollProgress = Math.min((currentScrollY - SCROLL_THRESHOLD) / COLLAPSE_DISTANCE, 1);
                    const currentHeight = fullHeight * (1 - scrollProgress);
                    const currentOpacity = 1 - (scrollProgress * 0.6); // Fade to 40% opacity
                    
                    // Apply smooth transform with NO transition (immediate response)
                    filterContent.style.transition = 'none';
                    filterContent.style.maxHeight = Math.max(0, currentHeight) + 'px';
                    filterContent.style.opacity = String(Math.max(0.4, currentOpacity));
                    filterContent.style.overflow = 'hidden';
                    filterContent.style.transform = `translateY(${-scrollProgress * 8}px)`; // Slide up slightly
                    
                    // Fully collapsed?
                    if (scrollProgress >= 1) {
                      state.ui.filterCollapsed = true;
                      localStorage.setItem('filterCollapsed', 'true');
                      filterContent.style.maxHeight = '0';
                      filterContent.style.opacity = '0';
                      
                      // Update toggle button icon
                      const toggleBtn = document.querySelector('#filterToggle');
                      if (toggleBtn) {
                        const iconContainer = toggleBtn.querySelector('div:last-child');
                        if (iconContainer) {
                          iconContainer.innerHTML = SVG_CHEVRON_DOWN;
                        }
                        toggleBtn.setAttribute('aria-expanded', 'false');
                        toggleBtn.title = 'Filter anzeigen';
                      }
                      isCollapsing = false;
                    }
                  }
                }
                // Scrolling up - expand if collapsed or near top
                else if (scrollDelta < 0 && currentScrollY < SCROLL_THRESHOLD * 2 && state.ui.filterCollapsed) {
                  state.ui.filterCollapsed = false;
                  localStorage.setItem('filterCollapsed', 'false');
                  isCollapsing = false;
                  
                  // Smooth expand animation
                  filterContent.style.transition = 'max-height 350ms cubic-bezier(0.4, 0.0, 0.2, 1), opacity 350ms cubic-bezier(0.4, 0.0, 0.2, 1), transform 350ms cubic-bezier(0.4, 0.0, 0.2, 1)';
                  filterContent.style.maxHeight = fullHeight + 'px';
                  filterContent.style.opacity = '1';
                  filterContent.style.transform = 'translateY(0)';
                  filterContent.style.overflow = 'visible';
                  
                  // Update toggle button icon
                  const toggleBtn = document.querySelector('#filterToggle');
                  if (toggleBtn) {
                    const iconContainer = toggleBtn.querySelector('div:last-child');
                    if (iconContainer) {
                      iconContainer.innerHTML = SVG_CHEVRON_UP;
                    }
                    toggleBtn.setAttribute('aria-expanded', 'true');
                    toggleBtn.title = 'Filter ausblenden';
                  }
                }
                
                lastScrollY = currentScrollY;
              };
              
              scroller.addEventListener('scroll', handleScroll, { passive: true });
              state.library.scrollListener = handleScroll;
            }
          });
        });

        if (prevPageBtn) {

      const playlistApi = {
        async request(path, { method = "GET", body, cache = "no-store" } = {}) {
          const opts = { method, headers: {}, cache };
          if (body !== undefined) {
            opts.body = JSON.stringify(body);
            opts.headers["Content-Type"] = "application/json";
          }
          const res = await fetch(path, opts);
          if (!res?.ok) {
            const status = res ? res.status : "network";
            let errorMessage = `Request failed (${status})`;
            
            // Try to get error message from response
            try {
              const errorData = await res.json();
              if (errorData?.error) {
                errorMessage = errorData.error;
              }
            } catch {
              // If JSON parsing fails, try to get text
              try {
                const errorText = await res.text();
                if (errorText) errorMessage = errorText;
              } catch {}
            }
            
            const error = new Error(errorMessage);
            error.status = status;
            throw error;
          }
          const text = await res.text();
          if (!text) return null;
          try { return JSON.parse(text); } catch { return null; }
        },
        fetchState() {
          return playlistApi.request("/api/playlists");
        },
        create(payload = {}) {
          return playlistApi.request("/api/playlists", { method: "POST", body: payload });
        },
        activate(id) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/activate`, { method: "POST" });
        },
        update(id, payload) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}`, { method: "PATCH", body: payload });
        },
        remove(id) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}`, { method: "DELETE" });
        },
        addItem(id, name) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/add`, { method: "POST", body: { name } });
        },
        removeItem(id, name) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/remove`, { method: "POST", body: { name } });
        },
        clear(id) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/clear`, { method: "POST" });
        },
        reorder(id, order) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/reorder`, { method: "POST", body: { order } });
        },
        setItems(id, items, currentIndex) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/set`, { method: "POST", body: { items, currentIndex } });
        },
        setCurrent(id, index) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/current`, { method: "POST", body: { index } });
        },
        assign(name, playlistIds) {
          console.log('playlistApi.assign called with:', { name, type: typeof name, playlistIds });
          console.log('Request body will be:', JSON.stringify({ name, playlists: playlistIds }, null, 2));
          return playlistApi.request(`/api/playlists/items/assign`, { method: "POST", body: { name, playlists: playlistIds } });
        }
      };

      async function fetchPlaylists() {
        try {
          const data = await playlistApi.fetchState();
          applyPlaylistState(data);
        } catch (err) {
          console.warn('fetchPlaylists failed', err);
        }
      }
      function connectPlaylistEvents() {
        try { playlist.es?.close?.(); } catch {}
        const es = new EventSource('/api/playlists/events');
        es.onmessage = (ev) => {
          try {
            const data = JSON.parse(ev.data);
            applyPlaylistState(data, { silent: true });
          } catch (err) {
            console.warn('Playlist SSE parse failed', err);
          }
        };
        es.onerror = () => {
          try { es.close(); } catch {}
          setTimeout(connectPlaylistEvents, 2500);
        };
        playlist.es = es;
      }
      function applyPlaylistState(data, { silent = false } = {}) {
        if (!data || typeof data !== 'object') return;
        const list = Array.isArray(data.playlists) ? data.playlists : [];
        playlist.list = list.map((entry) => ({
          id: entry.id,
          name: entry.name || null,
          icon: entry.icon || "🎵",
          accentColor: entry.accentColor || "#6366F1",
          items: Array.isArray(entry.items) ? entry.items.slice() : [],
          currentIndex: Number.isInteger(entry.currentIndex) ? entry.currentIndex : -1,
          createdAt: Number(entry.createdAt) || null,
          updatedAt: Number(entry.updatedAt) || Date.now(),
          itemCount: Number.isFinite(entry.itemCount) ? entry.itemCount : (Array.isArray(entry.items) ? entry.items.length : 0)
        }));
        playlist.byId = new Map(playlist.list.map((pl) => [pl.id, pl]));
        playlist.activeId = typeof data.activeId === 'string' && playlist.byId.has(data.activeId)
          ? data.activeId
          : (playlist.list[0]?.id || null);
        const active = playlist.activeId ? playlist.byId.get(playlist.activeId) : null;
        playlist.items = active?.items ? active.items.slice() : [];
        playlist.currentIndex = Number.isInteger(active?.currentIndex) ? active.currentIndex : -1;
        playlist.name = active?.name || null;
        playlist.icon = active?.icon || "🎵";
        playlist.accentColor = active?.accentColor || "#6366F1";
        playlist.itemCount = Number.isFinite(active?.itemCount) ? active.itemCount : playlist.items.length;
        playlist.updatedAt = Number(active?.updatedAt) || Number(data.updatedAt) || Date.now();
        playlist.ready = true;

        refreshAccentTheme();
        ensureModeSwitcher();
        ensurePlaylistBadge();
        updatePlaylistPanel();
        updateViewerPlaylistControls();
        updateLibraryPlaylistButtons();

        playlist.managerRender?.({});

        // WICHTIG: Wenn wir in der Detail-Ansicht einer Playlist sind, diese aktualisieren
        // statt zur Übersicht zurückzukehren
        if (!document.body.classList.contains('in-viewer') && playlist.mode) {
          if (playlist.currentDetailId) {
            // In Detail-Ansicht: nur diese Playlist aktualisieren
            renderPlaylistDetail(playlist.currentDetailId);
          } else {
            // In Übersicht: normale Library rendern
            renderPlaylistLibrary();
          }
        }
      }

      function refreshAccentTheme() {
        const inViewer = document.body.classList.contains('in-viewer');
        if (playlist.mode) {
          if (inViewer) {
            applyAccentTheme(null, { ignorePlaylistAccent: true });
          } else {
            applyAccentTheme(null, { ignorePlaylistAccent: true });
          }
        } else {
          applyAccentTheme(state.library?.categoryFilter || null);
        }
      }

      function getPlaylistEntry(id = playlist.activeId) {
        if (!id) return null;
        return playlist.byId.get(id) || null;
      }

      async function addToPlaylist(name, targetId = playlist.activeId) {
        if (!targetId || !name) return;
        const entry = getPlaylistEntry(targetId);
        if (entry && !entry.items.includes(name)) {
          entry.items = entry.items.slice();
          entry.items.push(name);
          entry.itemCount = entry.items.length;
          entry.updatedAt = Date.now();
          if (targetId === playlist.activeId) {
            playlist.items = entry.items.slice();
            playlist.itemCount = entry.itemCount;
            playlist.updatedAt = entry.updatedAt;
            updatePlaylistPanel();
            updateViewerPlaylistControls();
            updateLibraryPlaylistButtons();
            ensurePlaylistBadge();
            if (!document.body.classList.contains('in-viewer') && playlist.mode) {
              renderPlaylistLibrary();
            }
          }
        }
        try {
          await playlistApi.addItem(targetId, name);
        } catch (err) {
          console.warn('addToPlaylist failed', err);
          fetchPlaylists();
        }
      }
      async function removeFromPlaylist(name, targetId = playlist.activeId) {
        if (!targetId || !name) return;
        const entry = getPlaylistEntry(targetId);
        if (entry) {
          const idx = entry.items.indexOf(name);
          if (idx !== -1) {
            entry.items = entry.items.slice();
            entry.items.splice(idx, 1);
            entry.itemCount = entry.items.length;
            if (entry.currentIndex >= entry.items.length) {
              entry.currentIndex = entry.items.length ? entry.items.length - 1 : -1;
            }
            entry.updatedAt = Date.now();
          if (targetId === playlist.activeId) {
            playlist.items = entry.items.slice();
            playlist.itemCount = entry.itemCount;
            playlist.currentIndex = entry.currentIndex;
            playlist.updatedAt = entry.updatedAt;
            updatePlaylistPanel();
            updateViewerPlaylistControls();
            updateLibraryPlaylistButtons();
            ensurePlaylistBadge();
            if (!document.body.classList.contains('in-viewer') && playlist.mode) {
              renderPlaylistLibrary();
            }
          }
          }
        }
        try {
          await playlistApi.removeItem(targetId, name);
        } catch (err) {
          console.warn('removeFromPlaylist failed', err);
          fetchPlaylists();
        }
      }
      async function setPlaylistOrder(order, targetId = playlist.activeId) {
        if (!targetId || !Array.isArray(order)) return;
        const entry = getPlaylistEntry(targetId);
        if (entry) {
          entry.items = order.slice();
          if (!entry.items.length) entry.currentIndex = -1;
          else if (entry.currentIndex >= entry.items.length) entry.currentIndex = entry.items.length - 1;
          entry.itemCount = entry.items.length;
          entry.updatedAt = Date.now();
          if (targetId === playlist.activeId) {
            playlist.items = entry.items.slice();
            playlist.currentIndex = entry.currentIndex;
            playlist.itemCount = entry.itemCount;
            playlist.updatedAt = entry.updatedAt;
            updatePlaylistPanel();
            updateViewerPlaylistControls();
            if (!document.body.classList.contains('in-viewer') && playlist.mode) {
              renderPlaylistLibrary();
            }
          }
        }
        try {
          await playlistApi.reorder(targetId, order);
        } catch (err) {
          console.warn('setPlaylistOrder failed', err);
          fetchPlaylists();
        }
      }
      async function setPlaylistCurrentIndex(index, targetId = playlist.activeId) {
        if (!targetId || !Number.isInteger(index)) return;
        const entry = getPlaylistEntry(targetId);
        if (entry) {
          entry.currentIndex = Math.max(-1, Math.min(entry.items.length - 1, index));
          entry.updatedAt = Date.now();
          if (targetId === playlist.activeId) {
            playlist.currentIndex = entry.currentIndex;
            playlist.updatedAt = entry.updatedAt;
            updateViewerPlaylistControls();
            updatePlaylistPanel();
          }
        }
        try {
          await playlistApi.setCurrent(targetId, index);
        } catch (err) {
          console.warn('setPlaylistCurrentIndex failed', err);
          fetchPlaylists();
        }
      }
      async function clearPlaylist(targetId = playlist.activeId) {
        if (!targetId) return;
        const entry = getPlaylistEntry(targetId);
        if (entry) {
          entry.items = [];
          entry.itemCount = 0;
          entry.currentIndex = -1;
          entry.updatedAt = Date.now();
          if (targetId === playlist.activeId) {
            playlist.items = [];
            playlist.itemCount = 0;
            playlist.currentIndex = -1;
            playlist.updatedAt = entry.updatedAt;
            updatePlaylistPanel();
            updateViewerPlaylistControls();
            updateLibraryPlaylistButtons();
            ensurePlaylistBadge();
            if (playlist.mode && !document.body.classList.contains('in-viewer')) {
              renderPlaylistLibrary();
            }
          }
        }
        try {
          await playlistApi.clear(targetId);
        } catch (err) {
          console.warn('clearPlaylist failed', err);
          fetchPlaylists();
        }
      }

      async function activatePlaylistOnBackend(id) {
        if (!id || id === playlist.activeId) return;
        try {
          const res = await playlistApi.activate(id);
          if (res?.state) {
            applyPlaylistState(res.state);
          } else {
            await fetchPlaylists();
          }
        } catch (err) {
          console.warn('activatePlaylist failed', err);
          fetchPlaylists();
        }
      }

      async function createPlaylistOnBackend(meta = {}) {
        try {
          const payload = {};
          if (meta.name !== undefined) payload.name = meta.name;
          if (meta.icon !== undefined) payload.icon = meta.icon;
          if (meta.accentColor !== undefined) payload.accentColor = meta.accentColor;
          if (Array.isArray(meta.items)) payload.items = meta.items;
          const res = await playlistApi.create(payload);
          if (res?.state) {
            applyPlaylistState(res.state);
          } else {
            await fetchPlaylists();
          }
          return res?.playlist || null;
        } catch (err) {
          console.warn('createPlaylist failed', err);
          return null;
        }
      }

      async function updatePlaylistMetaOnBackend(id, meta = {}) {
        if (!id || !meta || typeof meta !== 'object') return null;
        try {
          const payload = {};
          if (meta.name !== undefined) payload.name = meta.name;
          if (meta.icon !== undefined) payload.icon = meta.icon;
          if (meta.accentColor !== undefined) payload.accentColor = meta.accentColor;
          if (meta.currentIndex !== undefined) payload.currentIndex = meta.currentIndex;
          const res = await playlistApi.update(id, payload);
          if (res?.playlist) {
            const entry = playlist.byId.get(id);
            if (entry) {
              if (payload.name !== undefined) entry.name = res.playlist.name;
              if (payload.icon !== undefined) entry.icon = res.playlist.icon;
              if (payload.accentColor !== undefined) entry.accentColor = res.playlist.accentColor;
              if (payload.currentIndex !== undefined && Number.isInteger(res.playlist.currentIndex)) {
                entry.currentIndex = res.playlist.currentIndex;
              }
              entry.updatedAt = res.playlist.updatedAt;
              const isActive = id === playlist.activeId;
              if (isActive) {
                playlist.name = entry.name;
                playlist.icon = entry.icon;
                playlist.accentColor = entry.accentColor;
                playlist.currentIndex = entry.currentIndex;
                playlist.updatedAt = entry.updatedAt;
                refreshAccentTheme();
                updateViewerPlaylistControls();
                updatePlaylistPanel();
              }
              if (playlist.mode && !document.body.classList.contains('in-viewer')) {
                renderPlaylistLibrary();
              } else if (isActive) {
                ensurePlaylistBadge();
              }
            }
            playlist.managerRender?.({ focusId: id });
          } else {
            await fetchPlaylists();
          }
          return res?.playlist || null;
        } catch (err) {
          console.warn('updatePlaylistMeta failed', err);
          fetchPlaylists();
          return null;
        }
      }

      async function deletePlaylistOnBackend(id) {
        if (!id) return false;
        try {
          const res = await playlistApi.remove(id);
          if (res?.state) {
            applyPlaylistState(res.state);
          } else {
            await fetchPlaylists();
          }
          return true;
        } catch (err) {
          console.warn('deletePlaylist failed', err);
          fetchPlaylists();
          return false;
        }
      }

      async function assignItemToPlaylists(name, playlistIds) {
        if (!name) {
          console.error('assignItemToPlaylists: name is empty');
          showToast('Fehler: Kein Dateiname angegeben', 3000);
          return false;
        }
        if (!Array.isArray(playlistIds) || playlistIds.length === 0) {
          console.error('assignItemToPlaylists: no playlists selected');
          showToast('Fehler: Keine Playlists ausgewählt', 3000);
          return false;
        }
        
        console.log('assignItemToPlaylists:', { name, playlistIds });
        
        try {
          const res = await playlistApi.assign(name, playlistIds);
          if (res?.state) {
            applyPlaylistState(res.state);
            showToast(`Zu ${playlistIds.length} Playlist${playlistIds.length > 1 ? 's' : ''} hinzugefügt`, 2500);
          } else {
            await fetchPlaylists();
          }
          return true;
        } catch (err) {
          console.error('assignItemToPlaylists failed:', err);
          const errorMsg = err?.message || 'Unbekannter Fehler';
          showToast(`Fehler beim Zuordnen: ${errorMsg}`, 3500);
          await fetchPlaylists();
          return false;
        }
      }

      function openPlaylistAssignmentDialog(itemName) {
        if (!itemName) return;
        if (!playlist.ready) {
          fetchPlaylists().then(() => openPlaylistAssignmentDialog(itemName));
          return;
        }
        const selected = new Set(
          playlist.list
            .filter((pl) => pl.items.includes(itemName))
            .map((pl) => pl.id)
        );

        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.dataset.modal = 'playlist-assign';

        const displayName = toDisplayName(itemName);

        backdrop.innerHTML = `
          <div class="glass-panel w-[480px] max-w-[92vw] p-6 text-sm text-neutral-200" role="dialog" aria-modal="true">
            <div class="flex items-start justify-between gap-3 mb-4">
              <div>
                <div class="text-[11px] uppercase tracking-[0.32em] text-neutral-500">Zu Playlists hinzufügen</div>
                <h2 class="text-lg font-semibold text-neutral-50 truncate max-w-[300px]">${escapeHtml(displayName)}</h2>
                <p class="text-xs text-neutral-400 mt-2">Wähle eine oder mehrere Playlists aus. Du kannst jederzeit neue Playlists erstellen.</p>
              </div>
              <button type="button" data-role="close" class="h-8 w-8 grid place-items-center rounded-full border border-neutral-700 text-neutral-400 hover:text-neutral-200 hover:bg-neutral-800/60 transition-colors focus:outline-none focus:ring-2 focus:ring-white/30">✕</button>
            </div>
            <div class="space-y-3">
              <div id="assignList" class="max-h-[280px] overflow-y-auto pr-1"></div>
              <button type="button" data-role="create" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg border border-dashed border-neutral-700/60 text-neutral-200 hover:border-white/40 hover:text-white transition-colors focus:outline-none focus:ring-2 focus:ring-white/30">
                <span class="text-base leading-none">＋</span>
                <span>Neue Playlist anlegen</span>
              </button>
            </div>
            <div class="flex items-center justify-end gap-3 mt-6">
              <button type="button" data-role="cancel" class="px-3.5 py-2 rounded-lg border border-neutral-700 text-neutral-300 hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-white/20">Abbrechen</button>
              <button type="button" data-role="save" class="px-3.5 py-2 rounded-lg bg-[--accent-color] text-neutral-900 font-semibold hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-[--accent-color]/40">Übernehmen</button>
            </div>
          </div>
        `;

        document.body.appendChild(backdrop);

        const closeDialog = () => {
          backdrop.remove();
        };

        backdrop.addEventListener('click', (ev) => {
          if (ev.target === backdrop) closeDialog();
        });
        backdrop.querySelector('[data-role="close"]')?.addEventListener('click', closeDialog);
        backdrop.querySelector('[data-role="cancel"]')?.addEventListener('click', closeDialog);

        const listEl = backdrop.querySelector('#assignList');
        const saveBtn = backdrop.querySelector('[data-role="save"]');
        const createBtn = backdrop.querySelector('[data-role="create"]');

        const renderList = () => {
          if (!playlist.list.length) {
            listEl.innerHTML = '<div class="rounded-xl border border-neutral-800/60 bg-neutral-900/70 p-4 text-neutral-400 text-sm">Noch keine Playlists vorhanden. Erstelle deine erste Playlist, um Titel hinzuzufügen.</div>';
            saveBtn.disabled = selected.size === 0;
            return;
          }
          const items = playlist.list.map((pl) => {
            const checked = selected.has(pl.id);
            const accent = pl.accentColor || '#6366F1';
            const icon = escapeHtml(pl.icon || '🎵');
            const count = pl.itemCount || 0;
            const label = escapeHtml(pl.name || 'Setlist');
            return `
              <label class="flex items-center justify-between gap-3 px-3 py-2 rounded-xl border ${checked ? 'border-white/50 bg-neutral-900/80' : 'border-neutral-800/60 bg-neutral-950/60 hover:border-neutral-700'} cursor-pointer transition-colors">
                <span class="flex items-center gap-3 min-w-0">
                  <span class="text-xl" style="text-shadow:0 2px 8px rgba(0,0,0,0.35)">${icon}</span>
                  <span class="flex flex-col min-w-0">
                    <span class="text-sm font-medium text-neutral-100 truncate">${label}</span>
                    <span class="text-xs text-neutral-400">${count} ${count === 1 ? 'Titel' : 'Titel'}</span>
                  </span>
                </span>
                <input type="checkbox" class="h-5 w-5 rounded border-neutral-600 text-[--accent-color]" data-id="${pl.id}" ${checked ? 'checked' : ''} style="accent-color:${accent}">
              </label>
            `;
          }).join('');
          listEl.innerHTML = items;
          listEl.querySelectorAll('input[type="checkbox"]').forEach((input) => {
            input.addEventListener('change', () => {
              const id = input.getAttribute('data-id');
              if (!id) return;
              if (input.checked) selected.add(id);
              else selected.delete(id);
              saveBtn.disabled = selected.size === 0;
            });
          });
          saveBtn.disabled = selected.size === 0;
        };

        renderList();

        createBtn?.addEventListener('click', async (ev) => {
          ev.preventDefault();
          const created = await createPlaylistOnBackend({});
          if (created) {
            selected.add(created.id);
            renderList();
          }
        });

        saveBtn?.addEventListener('click', async (ev) => {
          ev.preventDefault();
          if (!selected.size) return;
          saveBtn.disabled = true;
          saveBtn.textContent = 'Speichere…';
          const success = await assignItemToPlaylists(itemName, Array.from(selected));
          if (success) {
            closeDialog();
          } else {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Übernehmen';
          }
        });
      }

      function ensurePlaylistBadge() {
        // Playlist badge removed from top bar - user should use playlist page instead
        document.querySelector('#headerPlaylistBadge')?.remove();
      }

      function closePlaylistManager() {
        if (playlist.managerBackdropCleanup) {
          try { playlist.managerBackdropCleanup(); } catch {}
          playlist.managerBackdropCleanup = null;
        }
        if (playlist.managerBackdrop?.isConnected) {
          playlist.managerBackdrop.remove();
        }
        playlist.managerBackdrop = null;
        playlist.managerRender = null;
      }

          playlist.managerRender?.({ focusId });

                <div class="mt-4 flex flex-wrap items-center gap-4">

          listEl.innerHTML = markup;

          if (nextFocus) {
            const focusInput = listEl.querySelector(`section[data-id="${nextFocus}"] input[data-role="name"]`);
            if (focusInput) {
              setTimeout(() => focusInput.select(), 50);
            }
          }

          listEl.querySelectorAll('input[data-role="name"]').forEach((input) => {
            const id = input.closest('section')?.dataset.id;
            if (!id) return;
            const entry = playlist.byId.get(id);
            input.addEventListener('input', () => {
              input.value = input.value.slice(0, 80);
            });
            input.addEventListener('keydown', (ev) => {
              if (ev.key === 'Enter') {
                ev.preventDefault();
                input.blur();
              }
            });
            input.addEventListener('blur', async () => {
              const value = input.value.trim();
              if (entry && value && value !== entry.name) {
                const previous = entry.name;
                input.disabled = true;
                try {
                  const result = await updatePlaylistMetaOnBackend(id, { name: value });
                  if (result) {
                    showToast(`Playlist umbenannt: ${value}`, 2000);
                  } else {
                    throw new Error('Update failed');
                  }
                } catch (err) {
                  console.error('Failed to update playlist name:', err);
                  entry.name = previous;
                  if (entry.id === playlist.activeId) {
                    playlist.name = previous;
                    ensurePlaylistBadge();
                  }
                  input.value = previous;
                  showToast('Fehler beim Speichern des Namens', 2500);
                } finally {
                  input.disabled = false;
                }
              } else if (!value && entry) {
                input.value = entry.name || '';
              }
            });
          });

          listEl.querySelectorAll('input[data-role="icon"]').forEach((input) => {
            const id = input.closest('section')?.dataset.id;
            if (!id) return;
            const entry = playlist.byId.get(id);
            input.addEventListener('input', () => {
              const trimmed = input.value.trim();
              const limited = [...trimmed].slice(0, 2).join('');
              if (input.value !== limited) input.value = limited;
            });
            input.addEventListener('blur', async () => {
              const value = input.value.trim();
              if (entry && value && value !== entry.icon) {
                const previous = entry.icon;
                const normalized = [...value].slice(0, 2).join('') || '🎵';
                input.disabled = true;
                try {
                  const result = await updatePlaylistMetaOnBackend(id, { icon: normalized });
                  if (result) {
                    showToast(`Icon aktualisiert: ${normalized}`, 2000);
                  } else {
                    throw new Error('Update failed');
                  }
                } catch (err) {
                  console.error('Failed to update playlist icon:', err);
                  entry.icon = previous;
                  input.value = previous;
                  if (entry.id === playlist.activeId) {
                    playlist.icon = previous;
                    ensurePlaylistBadge();
                  }
                  showToast('Fehler beim Speichern des Icons', 2500);
                } finally {
                  input.disabled = false;
                }
              } else if (!value && entry?.icon) {
                input.value = entry.icon;

          listEl.querySelectorAll('button[data-role="color"]').forEach((button) => {
            button.addEventListener('click', async () => {
              const id = button.closest('section')?.dataset.id;
              const color = button.getAttribute('data-color');
              if (!id || !color) return;
              const entry = playlist.byId.get(id);
              if (entry && entry.accentColor === color) return;
              
              button.disabled = true;
              try {
                const result = await updatePlaylistMetaOnBackend(id, { accentColor: color });
                if (result) {
                  showToast('Farbe aktualisiert', 2000);

                  throw new Error('Update failed');

                console.error('Failed to update playlist color:', err);

      // ===== Virtualized Grid/List (simplified without canvas thumbnails) =====
      function mountVirtualizer(resetScroll = false) {
        const wrap = document.querySelector('#virtualWrap');
        wrap.innerHTML = "";

        const L = state.library;
        const offlineFilterActive = state.offline.supported && state.offline.filterOnly && state.offline.cached.size > 0;
        let items = offlineFilterActive ? buildOfflineLibraryItems() : L.items;

        const fuse = window.Fuse && L.q
          ? new Fuse(items, { keys: ["name", "displayName"], threshold: 0.3 })
          : null;
        if (fuse) items = fuse.search(L.q).map(r => r.item);

        const isGrid = L.view === "grid";
        const wrapW = wrap.clientWidth;
        const minCardW = 220;      // minimal card width
        const maxCardW = 320;      // cap card width for medium screens to avoid huge tiles
        const minGap = 16;         // minimal horizontal gap between cards
        let cols = isGrid ? Math.max(1, Math.floor((wrapW + minGap) / (minCardW + minGap))) : 1;
        const cardH = isGrid ? 360 : 88; // list rows a bit taller for nicer padding
        const listGap = 10;              // add vertical spacing between list items
        // Base computation with min width
        let gridCardW = isGrid ? Math.floor((wrapW - (cols - 1) * minGap) / cols) : wrapW;
        // If cards get too wide, increase columns to keep a modern responsive look
        if (isGrid && gridCardW > maxCardW) {
          cols = Math.max(1, Math.floor((wrapW + minGap) / (maxCardW + minGap)));
          gridCardW = Math.floor((wrapW - (cols - 1) * minGap) / cols);
        }
        const gap = isGrid ? minGap : listGap; // keep gap consistent; consume space by growing card width

        const total = items.length;
  const rows = Math.ceil(total / cols);
  const rowStride = cardH + gap;
  const totalHeight = rows * rowStride - gap; // avoid extra gap at end

        const scroller = document.createElement("div");
        scroller.className = "relative w-full h-full overflow-auto no-scrollbar";
        const spacer = document.createElement("div");
        spacer.style.height = `${totalHeight}px`;
        spacer.style.position = "relative";
        scroller.appendChild(spacer);
        wrap.appendChild(scroller);

        const pool = new Map();
        
        // For small datasets (≤100 items), render all items immediately without virtualization
        // This ensures favorites and filtered lists always show completely
        const useFullRender = total <= 100;

        function renderViewport() {
          const scrollTop = scroller.scrollTop;
          let viewH = scroller.clientHeight;
          
          // Safety: If viewport height is not yet calculated or too small, use a reasonable minimum
          // This ensures initial render shows enough items
          if (viewH < 300) viewH = Math.max(600, window.innerHeight - 200);
          
          const bufferRows = 3;

          let firstIndex, lastIndex;
          
          if (useFullRender) {
            // Render all items for small datasets
            firstIndex = 0;
            lastIndex = total - 1;
          } else {
            // Use virtualization for large datasets
            const firstRow = Math.max(0, Math.floor(scrollTop / rowStride) - bufferRows);
            const lastRow  = Math.min(rows - 1, Math.floor((scrollTop + viewH) / rowStride) + bufferRows);
            firstIndex = firstRow * cols;
            lastIndex  = Math.min(total - 1, (lastRow + 1) * cols - 1);
          }

          // Simple cleanup - remove out-of-view elements (only for virtualized mode)
          if (!useFullRender) {
            for (const [key, el] of pool) {
              const idx = Number(key);
              if (idx < firstIndex || idx > lastIndex) {
                el.remove();
                pool.delete(key);
              }
            }
          }

          for (let i = firstIndex; i <= lastIndex; i++) {
            if (i < 0 || i >= total) continue;
            const key = String(i);
            if (pool.has(key)) continue;

            const item = items[i];
            const col = i % cols;
            const row = Math.floor(i / cols);
            const startX = 0; // align with filters/categories grid (no centering)
            const x = isGrid ? startX + col * (gridCardW + gap) : startX;
            const y = row * rowStride;

            const el = isGrid ? renderCard(item) : renderRow(item);
            el.style.position = "absolute";
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.width = `${isGrid ? gridCardW : wrapW}px`;
            el.style.height = `${cardH}px`;

            spacer.appendChild(el);
            pool.set(key, el);
            // Keep playlist add-buttons in sync for newly mounted nodes
            updateLibraryPlaylistButtons();
          }
        }

        // Throttle renderViewport using requestAnimationFrame
        let renderTimer = null;
        function scheduleRenderViewport() {
          if (renderTimer) return;
          renderTimer = requestAnimationFrame(() => {
            renderViewport();
            renderTimer = null;
          });
        }
        
        // Only add scroll listener for large datasets that use virtualization
        if (!useFullRender) {
          scroller.addEventListener("scroll", scheduleRenderViewport, { passive: true });
        }
        window.addEventListener("resize", () => mountVirtualizer(false), { once: true });

        renderViewport();
        if (resetScroll) scroller.scrollTop = 0;
        
        // Check auth and show delete buttons for authorized users
        setTimeout(() => checkAuthAndShowActions(), 100);
      }

      function renderCategoryBadges(item) {
        const cats = Array.isArray(item.categories) ? item.categories : [];
        if (!cats.length) {
          return '<span class="category-chip border-dashed border-neutral-700/60 text-neutral-400 bg-neutral-800/30">Keine Kategorie</span>';
        }
        return cats.map(cat => {
          const color = cat.color || '#4A5568';
          const icon = cat.icon || '♪';
          return `<span class="category-chip" style="border-color:${color}44;background:${color}1a;color:${color};">${icon}<span>${cat.name}</span></span>`;
        }).join('');
      }

      function setFavVisual(btn, active) {
        if (!btn) return;
        btn.textContent = active ? "★" : "☆";

        btn.classList.toggle('text-neutral-300', !active);

      function renderCard(item) {
        const a = document.createElement("a");
        a.href = `/?file=${item.id}`;
        const displayName = item.displayName || item.name;
        const subtitle = item.folder ? item.folder : (Array.isArray(item.categories) && item.categories[0]?.name ? item.categories[0].name : new Date(item.mtime).toLocaleDateString());
        // Determine accent from first category color or global accent
        const accent = Array.isArray(item.categories) && item.categories[0]?.color ? item.categories[0].color : null;
        a.className = "music-card block will-change-transform";
        if (accent) a.style.setProperty('--card-accent', accent);
        a.dataset.itemName = item.name;

        // Build inner
        const bg = document.createElement('img');
        bg.src = item.thumbnail;
        bg.alt = item.name;
        bg.loading = 'lazy';
        bg.className = 'card-bg';
        bg.setAttribute('onerror', "this.style.display='none'; this.nextElementSibling.style.display='grid'");
        a.appendChild(bg);

        const fallback = document.createElement('div');
        fallback.style.display = 'none';
        fallback.className = 'w-full h-[220px] sm:h-[240px] grid place-items-center text-neutral-200 bg-neutral-900/60';
        fallback.textContent = 'PDF';
        a.appendChild(fallback);

        const overlay = document.createElement('div');
        overlay.className = 'card-overlay';

            <button type="button" aria-label="Kategorien" title="Kategorien" class="assign-cat icon-btn">${SVG_CATEGORY_ADD}</button>
            <button type="button" aria-label="PDF löschen" title="PDF löschen" class="delete-pdf icon-btn text-red-400 hover:text-red-300" style="display:none;" data-name="${item.name}">${SVG_TRASH_MINI}</button>
          </div>
        `;
        a.appendChild(overlay);

        // Wire interactions
        const favBtn = overlay.querySelector('.fav');
        const favActive = state.library.favorites.has(item.name);
        console.log('[DEBUG] renderCard - item.name:', item.name, 'favActive:', favActive, 'favorites:', Array.from(state.library.favorites));
        if (favBtn) {
          favBtn.setAttribute('aria-pressed', String(favActive));
          setFavVisual(favBtn, favActive);
          favBtn.addEventListener('click', async (ev) => {
            ev.preventDefault(); ev.stopPropagation();

            // Touch-friendly drag & drop with precise drop targets
            (function setupPlaylistDnd() {
              const container = listEl;
              if (!container) return;

              let drag = null;
              const interactiveSelector = 'button, a, input, textarea, select, [role="button"]';

              const getScrollContainer = (el) => {
                let p = el && el.parentElement;
                while (p) {
                  const cs = getComputedStyle(p);
                  if (/auto|scroll/.test(cs.overflowY)) return p;
                  p = p.parentElement;
                }
                return document.scrollingElement || document.body;
              };
              const scrollEl = getScrollContainer(container);

              const computeOrder = () => Array.from(container.querySelectorAll('[data-item-name]')).map((el) => el.getAttribute('data-item-name'));

              const updateDomIndices = () => {
                const rows = Array.from(container.querySelectorAll('[data-item-name]'));
                rows.forEach((rowEl, index) => {
                  rowEl.setAttribute('data-item-index', String(index));
                  rowEl.querySelectorAll('[data-item-index]').forEach((btn) => {
                    btn.setAttribute('data-item-index', String(index));
                  });
                });
                return rows;
              };

              const refreshActiveStates = () => {
                const currentPlaylist = playlist.byId.get(playlistId);
                const activeIndex = isActive && currentPlaylist ? currentPlaylist.currentIndex : -1;
                container.querySelectorAll('[data-item-name]').forEach((rowEl, idx) => {
                  const isRowActive = isActive && idx === activeIndex;
                  const badge = rowEl.querySelector('[data-active-badge]');
                  if (badge) badge.classList.toggle('hidden', !isRowActive);
                });
              };

              const placeholderIndex = () => {
                if (!drag?.placeholder) return -1;
                return Array.from(container.children).indexOf(drag.placeholder);
              };

              const positionGhost = (clientX, clientY) => {
                if (!drag) return;
                const x = clientX - drag.offsetX;
                const y = clientY - drag.offsetY;
                drag.pending = { x, y };
                if (drag.frame) return;
                drag.frame = requestAnimationFrame(() => {
                  drag.frame = null;
                  if (!drag?.ghost || !drag.pending) return;
                  drag.ghost.style.transform = `translate3d(${drag.pending.x}px, ${drag.pending.y}px, 0)`;
                });
              };

              const autoscrollIfNeeded = (clientY) => {
                const scroller = scrollEl || container;
                const rect = scroller.getBoundingClientRect();
                const threshold = 72;
                let delta = 0;
                if (clientY < rect.top + threshold) {
                  const dist = Math.max(0, threshold - (clientY - rect.top));
                  delta = -Math.min(40, Math.max(8, dist * 0.55));
                } else if (clientY > rect.bottom - threshold) {
                  const dist = Math.max(0, threshold - (rect.bottom - clientY));
                  delta = Math.min(40, Math.max(8, dist * 0.55));
                }
                if (delta !== 0) scroller.scrollTop += delta;
              };

              const updatePlaceholder = (clientY) => {
                if (!drag) return;
                const siblings = Array.from(container.querySelectorAll('[data-item-name]'));
                let inserted = false;
                for (const sibling of siblings) {
                  const rect = sibling.getBoundingClientRect();
                  if (clientY < rect.top + rect.height / 2) {
                    if (drag.placeholder !== sibling) {
                      container.insertBefore(drag.placeholder, sibling);
                    }
                    inserted = true;
                    break;
                  }
                }
                if (!inserted) container.appendChild(drag.placeholder);
                drag.targetIndex = placeholderIndex();
              };

              const beginDrag = (ev, row) => {
                const rect = row.getBoundingClientRect();
                const initialOrder = computeOrder();
                const placeholder = document.createElement('div');
                placeholder.className = 'playlist-placeholder';
                placeholder.style.setProperty('--placeholder-height', `${rect.height}px`);
                const style = window.getComputedStyle(row);
                placeholder.style.marginTop = style.marginTop;
                placeholder.style.marginBottom = style.marginBottom;

                const ghost = row.cloneNode(true);
                ghost.classList.add('playlist-ghost');
                ghost.style.position = 'fixed';
                ghost.style.left = '0px';
                ghost.style.top = '0px';
                ghost.style.width = `${rect.width}px`;
                ghost.style.height = `${rect.height}px`;
                ghost.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0)`;
                ghost.style.pointerEvents = 'none';
                document.body.appendChild(ghost);

                const itemName = row.getAttribute('data-item-name') || '';

                container.insertBefore(placeholder, row.nextElementSibling);
                row.classList.add('is-dragging-source');
                row.remove();

                drag = {
                  pointerId: ev.pointerId,
                  row,
                  ghost,
                  placeholder,
                  offsetX: ev.clientX - rect.left,
                  offsetY: ev.clientY - rect.top,
                  frame: null,
                  pending: null,
                  originalIndex: Number(row.getAttribute('data-item-index') ?? '0'),
                  initialOrder,
                  itemName,
                  targetIndex: placeholderIndex()
                };

                container.classList.add('is-dragging');
                positionGhost(ev.clientX, ev.clientY);
                try { if (navigator.vibrate) navigator.vibrate(10); } catch {}
              };

              const finishDrag = (ev, cancelled = false) => {
                if (!drag) return;
                const { row, ghost, placeholder } = drag;

                if (drag.frame) {
                  cancelAnimationFrame(drag.frame);
                  drag.frame = null;
                }

                if (ghost?.isConnected) ghost.remove();

                if (cancelled) {
                  placeholder.remove();
                  const order = drag.initialOrder;
                  const nodes = new Map();
                  container.querySelectorAll('[data-item-name]').forEach((node) => {
                    nodes.set(node.getAttribute('data-item-name'), node);
                  });
                  nodes.set(drag.itemName, row);
                  row.classList.remove('is-dragging-source');
                  order.forEach((name) => {
                    const node = nodes.get(name);
                    if (node) container.appendChild(node);
                  });
                  updateDomIndices();
                  refreshActiveStates();
                  container.classList.remove('is-dragging');
                  drag = null;
                  return;
                }

                if (!placeholder.isConnected) container.appendChild(placeholder);
                container.insertBefore(row, placeholder);
                placeholder.remove();
                row.classList.remove('is-dragging-source');

                updateDomIndices();
                const newOrder = computeOrder();

                const prev = drag.initialOrder;
                let orderChanged = newOrder.length !== prev.length;
                if (!orderChanged) {
                  for (let i = 0; i < newOrder.length; i++) {
                    if (newOrder[i] !== prev[i]) {
                      orderChanged = true;
                      break;
                    }
                  }
                }

                if (orderChanged) {
                  const currentPlaylist = playlist.byId.get(playlistId);
                  const itemName = drag.itemName;
                  const originalIndex = drag.originalIndex;
                  const newIndex = newOrder.indexOf(itemName);

                  if (currentPlaylist) {
                    currentPlaylist.items = newOrder.slice();
                    if (playlistId === playlist.activeId) {
                      playlist.items = newOrder.slice();
                    }
                    if (isActive && Number.isInteger(currentPlaylist.currentIndex)) {
                      if (currentPlaylist.currentIndex === originalIndex) {
                        currentPlaylist.currentIndex = newIndex;
                      } else if (currentPlaylist.currentIndex > originalIndex && currentPlaylist.currentIndex <= newIndex) {
                        currentPlaylist.currentIndex -= 1;
                      } else if (currentPlaylist.currentIndex < originalIndex && currentPlaylist.currentIndex >= newIndex) {
                        currentPlaylist.currentIndex += 1;
                      }
                    }
                  }

                  items.splice(0, items.length, ...newOrder);
                  playlistData.items = newOrder.slice();
                  refreshActiveStates();

                  playlistApi.reorder(playlistId, newOrder).catch((err) => {
                    console.error('❌ Reorder failed:', err);
                    fetchPlaylists();
                  });
                } else {
                  refreshActiveStates();
                }

                container.classList.remove('is-dragging');
                drag = null;
              };

              const onPointerDown = (ev) => {
                if (drag) return;
                const row = ev.target.closest && ev.target.closest('[data-item-name]');
                if (!row) return;
                if (ev.button !== 0 && ev.pointerType === 'mouse') return;
                if (ev.target.closest(interactiveSelector)) return;
                if (ev.pointerType === 'touch' || ev.pointerType === 'pen') {
                  const handle = ev.target.closest && ev.target.closest('[data-drag-handle]');
                  if (!handle) return;
                }
                ev.preventDefault();
                container.setPointerCapture?.(ev.pointerId);
                beginDrag(ev, row);
              };

              const onPointerMove = (ev) => {
                if (!drag || ev.pointerId !== drag.pointerId) return;
                ev.preventDefault();
                positionGhost(ev.clientX, ev.clientY);
                autoscrollIfNeeded(ev.clientY);
                updatePlaceholder(ev.clientY);
              };

              const onPointerUp = (ev) => {
                if (!drag || ev.pointerId !== drag.pointerId) return;
                ev.preventDefault();
                container.releasePointerCapture?.(ev.pointerId);
                finishDrag(ev, false);
              };

              const onPointerCancel = (ev) => {
                if (!drag || ev.pointerId !== drag.pointerId) return;
                container.releasePointerCapture?.(ev.pointerId);
                finishDrag(ev, true);
              };

              container.addEventListener('pointerdown', onPointerDown, { passive: false });
              container.addEventListener('pointermove', onPointerMove, { passive: false });
              container.addEventListener('pointerup', onPointerUp);
              container.addEventListener('pointercancel', onPointerCancel);
            })();
            // Helper function to re-attach event listeners after re-render
            function attachItemEventListeners() {
              listEl.querySelectorAll('.detail-item-play').forEach(btn => {
                btn.addEventListener('click', async () => {
                  const index = parseInt(btn.getAttribute('data-item-index'), 10);
                  
                  if (playlistId !== playlist.activeId) {
                    await activatePlaylistOnBackend(playlistId);
                    await new Promise(resolve => setTimeout(resolve, 150));
                  }
                  
                  try {
                    await setPlaylistCurrentIndex(index);
                  } catch (err) {
                    console.error('Failed to set current index:', err);
                  }
                  
                  const item = items[index];
                  if (item) {
                    acquireWakeLockSync();
                    history.replaceState(null, '', '/');
                    renderViewer(item);
                  }
                });
              });

              listEl.querySelectorAll('.detail-item-remove').forEach(btn => {
                btn.addEventListener('click', async () => {
                  const index = parseInt(btn.getAttribute('data-item-index'), 10);
                  const item = items[index];
                  
                  try {
                    await playlistApi.removeItem(playlistId, item);
                    await fetchPlaylists();
                    renderPlaylistDetail(playlistId);
                    showToast('Titel entfernt', 2000);
                  } catch (err) {
                    console.error('Failed to remove item:', err);
                    showToast('Fehler beim Entfernen', 2500);
                  }
                });
              });
            }
          }
        }
      }

        // Remove oldest entries (LRU-style cleanup)
        const entries = Array.from(state.thumbs.cache.entries());
        const excess = entries.length - state.thumbs.maxCacheSize;
        const toDelete = entries.slice(0, excess);
        
        toDelete.forEach(([key, canvas]) => {
          if (canvas) {
            const ctx = canvas.getContext('2d');
            if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = canvas.height = 0;

          state.thumbs.cache.delete(key);

        // Pinch-to-Zoom Gesten-Steuerung für Tablets - flüssige Vorschau + Fokus-Erhalt
        (function setupPinchZoom() {
          let pinchState = {

            initialZoom: 1,

            const centerX = (touches[0].clientX + touches[1].clientX) / 2;
            const centerY = (touches[0].clientY + touches[1].clientY) / 2;
            const offsetYRaw = centerY - viewerRect.top;
            const offsetXRaw = centerX - viewerRect.left;
            const offsetY = Math.max(0, Math.min(viewerRect.height, offsetYRaw));
            const offsetX = Math.max(0, Math.min(viewerRect.width, offsetXRaw));
            return {
              contentY: scrollTop + offsetY,
              viewportOffsetY: offsetY,
              contentX: scrollLeft + offsetX,
              viewportOffsetX: offsetX
            };
          };

              e.stopPropagation();

              pinchState.active = true;
              pinchState.initialDistance = getDistance(e.touches[0], e.touches[1]);
              pinchState.initialZoom = state.viewer.zoomPreview ?? state.viewer.zoom;
              pinchState.lastScale = 1;
              pinchState.lastZoom = pinchState.initialZoom;
              pinchState.focal = computeFocal(e.touches);

            if (!pinchState.active) return;
            if (e.touches.length !== 2) {

            }

            e.preventDefault();
            e.stopPropagation();

            pinchState.focal = computeFocal(e.touches);
            const currentDistance = getDistance(e.touches[0], e.touches[1]);
            const rawScale = currentDistance / pinchState.initialDistance;

            const smoothedScale = pinchState.lastScale * 0.3 + rawScale * 0.7;
            pinchState.lastScale = smoothedScale;

            const newZoom = clampZoom(pinchState.initialZoom * smoothedScale);
            pinchState.lastZoom = newZoom;

            pinchState.lastScale = 1;
            pinchState.lastZoom = null;
            pinchState.focal = null;
            state.viewer.autoScroll.userAdjusting = false;
          };

            if (!pinchState.active) return;
            if (e.touches.length < 2) {

            }
          };

          const handleTouchCancel = () => {
            if (!pinchState.active) return;
            state.viewer.zoomPreview = null;
            applyZoomPreviewLayout(state.viewer.zoom);
            updateZoomUI();
            pinchState.active = false;
            pinchState.lastScale = 1;
            pinchState.lastZoom = null;
            pinchState.focal = null;
            state.viewer.autoScroll.userAdjusting = false;
          };

        S.running = false;
        S.pending = false;
        S.needsRecalc = false;
        S.speedPxPerSec = 0;
        S.token = null;
        S.userAdjusting = false;
        S.userActiveUntil = 0;
        S.ignoreScrollUntil = 0;
        if (S.rafId !== null) {
          cancelAnimationFrame(S.rafId);
          S.rafId = null;
        }
        const viewerEl = document.querySelector('#viewer');
        if (viewerEl) {
          S.pos = viewerEl.scrollTop || 0;
          S.lastTs = performance.now();
        }
        if (wasRunning) {
          updateStatus("Auto-Scroll: pausiert");
        }
      }
      function tickAutoScroll(ts) {
        const S = state.viewer.autoScroll;
        if (!S.running) {
          S.rafId = null;
          return;
        }
        const el = document.querySelector('#viewer');
        if (!el) {
          stopAutoScroll();
          refreshPlayPauseUI();
          return;
        }
        // If the user is actively adjusting (dragging) or momentum/settling is ongoing,
        // don't override their position; just keep the loop alive and sync base.
        if (S.userAdjusting || (S.userActiveUntil && ts < S.userActiveUntil)) {
          S.pos = el.scrollTop || 0;
          S.lastTs = ts;
          S.rafId = requestAnimationFrame(tickAutoScroll);
          return;
        }
        
        // Geschwindigkeit neu berechnen wenn nötig (z.B. wenn Seiten nachladen)
        if (S.needsRecalc || S.speedPxPerSec <= 0.01) {
          computeSpeed();
          S.needsRecalc = false;
        }
        if (!S.running) {
          S.rafId = null;
          return;
        }
        
        const dt = Math.max(0, (ts - S.lastTs) / 1000);
        S.lastTs = ts;
        if (!S.running) {
          S.rafId = null;
          return;
        }

        const delta = S.speedPxPerSec * dt;
        // Falls noch nicht scrollbar, NICHT stoppen – warten bis Content kommt
        const maxScrollTop = Math.max(0, el.scrollHeight - el.clientHeight);
        if (maxScrollTop <= 1) {
          // Kick: kleiner Scrollstoß hält die Schleife „aktiv“
          if (el.scrollTop < 1) {
            try { S.ignoreScrollUntil = performance.now() + 50; el.scrollTop = 1; } catch {}
          }
          // Nächster Frame: erneut versuchen
          S.needsRecalc = true;
          S.rafId = requestAnimationFrame(tickAutoScroll);
          return;
        }

        // Float-Akkumulator verwenden, um Subpixel-Bewegung nicht zu verlieren
        S.pos = Math.min((S.pos || el.scrollTop || 0) + delta, maxScrollTop);
        S.ignoreScrollUntil = performance.now() + 50; // ignore immediate scroll event from programmatic set
        el.scrollTop = S.pos;
        if (!S.running) {
          S.rafId = null;
          return;
        }

        // Am Ende angekommen?
        if (el.scrollTop >= maxScrollTop - 1) {
          stopAutoScroll();
          refreshPlayPauseUI();
          updateStatus("Ende erreicht");
          return;
        }
        
        S.rafId = requestAnimationFrame(tickAutoScroll);
      }
      function refreshPlayPauseUI() {
        const btn = document.querySelector('#btnPlayPause');
        if (!btn) return;
        
        const isRunning = state.viewer.autoScroll.running;
        const isPending = state.viewer.autoScroll.pending;
        
        if (isPending) {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" class="animate-spin">
              <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
            </svg>
            <span>Warte…</span>
          `;
          btn.disabled = true;
        } else if (isRunning) {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
              <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
            </svg>
            <span>Pause</span>
          `;
          btn.disabled = false;
          btn.setAttribute('aria-label', 'Auto-Scroll pausieren');
        } else {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span>Start</span>
          `;
          btn.disabled = false;
          btn.setAttribute('aria-label', 'Auto-Scroll starten');
        }
      }
      
      // ===== Toast Notification System =====
      function showToast(message, duration = 2000) {
        if (!message) return;
        
        const container = document.getElementById('toastContainer');
        if (!container) return;
        
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        container.appendChild(toast);
        
        // Auto-remove after duration
        setTimeout(() => {
          toast.classList.add('toast-out');
          setTimeout(() => {
            if (toast.parentElement) {
              toast.remove();
            }
          }, 250);
        }, duration);
      }
      
      function updateStatus(extra) {
        // Status updates now use toasts instead of static display
        if (extra) {
          showToast(extra, 1800);
        }
      }
      
      // ===== PDF Delete Functionality =====
      async function confirmAndDeletePdf(item) {
        // Create confirmation modal
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML = `
          <div class="glass-panel p-6 max-w-md w-full animate-fade-in" style="animation: slideUp 0.3s ease-out;">
            <h3 class="text-xl font-bold mb-4 text-red-400">PDF löschen?</h3>
            <p class="text-neutral-300 mb-4">
              Möchten Sie "<strong>${item.displayName || item.name}</strong>" wirklich löschen?
            </p>
            <p class="text-sm text-red-300 mb-6">
              ⚠️ Diese Aktion kann nicht rückgängig gemacht werden. Das PDF wird unwiderruflich gelöscht, 
              inklusive aller Annotationen, Favoriten-Markierungen und Playlist-Zuordnungen.
            </p>
            <div class="flex gap-3 justify-end">
              <button id="cancelDelete" class="btn btn-secondary">
                Abbrechen
              </button>
              <button id="confirmDelete" class="btn" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); border-color: #ef4444; color: white;">
                Endgültig löschen
              </button>
            </div>
          </div>
        `;
        
        document.body.appendChild(backdrop);
        
        // Handle cancel
        const cancelBtn = backdrop.querySelector('#cancelDelete');
        const confirmBtn = backdrop.querySelector('#confirmDelete');
        
        cancelBtn.addEventListener('click', () => {
          backdrop.remove();
        });
        
        // Handle backdrop click to close
        backdrop.addEventListener('click', (e) => {
          if (e.target === backdrop) {
            backdrop.remove();
          }
        });
        
        // Handle confirm
        confirmBtn.addEventListener('click', async () => {
          confirmBtn.disabled = true;
          confirmBtn.textContent = 'Lösche...';
          
          try {
            const response = await fetch(`/api/sheets/${encodeURIComponent(item.name)}`, {
              method: 'DELETE',
              credentials: 'include',
              headers: {
                'Content-Type': 'application/json'
              }
            });
            
            if (!response.ok) {
              const errorData = await response.json().catch(() => ({}));
              throw new Error(errorData.error || errorData.details || 'Löschen fehlgeschlagen');
            }
            
            backdrop.remove();
            showToast('PDF erfolgreich gelöscht', 3000);
            
            // Remove from local state
            state.library.favorites.delete(item.name);
            state.library.items = state.library.items.filter(i => i.name !== item.name);
            
            // Refresh library view - trigger a complete reload
            renderLibrary();
            
          } catch (error) {
            console.error('Delete failed:', error);
            backdrop.remove();
            showToast(error.message || 'Fehler beim Löschen', 4000);
          }
        });
      }
      
      // Check authentication and show delete buttons for authorized users
      async function checkAuthAndShowActions() {
        try {
          const response = await fetch('/api/auth/session', {
            credentials: 'include',
            cache: 'no-store'
          });
          
          if (!response.ok) return;
          
          const data = await response.json();
          if (!data || !data.ok || !data.user) return;
          
          const isAdmin = data.user.role === 'admin';
          
          // Show delete buttons for admin users
          if (isAdmin) {
            document.querySelectorAll('.delete-pdf').forEach(btn => {
              btn.style.display = 'inline-flex';
            });
          }
          
        } catch (error) {
          console.error('Auth check failed:', error);
        }
      }
      
      // Call auth check after library is loaded
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(checkAuthAndShowActions, 500);
      });
      
      // ===== Fullscreen & Wake Lock =====
      async function toggleFullscreen() {
        const el = document.fullscreenElement;
        if (el) { await document.exitFullscreen(); return; }
        try { await document.documentElement.requestFullscreen(); } catch {}
      }
      async function toggleWakeLock() {
        const btn = document.querySelector('#btnWakeLock');
        try {
          if ("wakeLock" in navigator) {
            if (!state.viewer.wakeLock) {
              state.viewer.wakeLock = await navigator.wakeLock.request("screen");
              state.viewer.wakeLock.addEventListener("release", () => {
                state.viewer.wakeLock = null;
                btn.textContent = "☀︎ Screen On";
              });
              btn.textContent = "☀︎ Screen On ✓";
            } else {
              await state.viewer.wakeLock.release();
              state.viewer.wakeLock = null;
              btn.textContent = "☀︎ Screen On";
            }
            return;
          }
          // Fallback: NoSleep.js
          if (!state.viewer.noSleep) {
            await new Promise((resolve, reject) => {
              const s = document.createElement('script');
              s.src = '/vendor/nosleep.min.js';
              s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
            });
            state.viewer.noSleep = new window.NoSleep();
          }
          if (state.viewer.noSleepEnabled) {
            state.viewer.noSleep.disable();
            state.viewer.noSleepEnabled = false;
            btn.textContent = "☀︎ Screen On";
          } else {
            state.viewer.noSleep.enable(); // user gesture: this click
            state.viewer.noSleepEnabled = true;
            btn.textContent = "☀︎ Screen On ✓";
          }
        } catch (e) {
          console.warn('Wake lock failed or blocked', e);
          btn.textContent = "☀︎ Nicht unterstützt";
        }
      }
    </script>
  </body>
