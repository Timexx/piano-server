<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Piano Sheets</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PDF.js & Fuse.js (local, served by server.js) -->
    <script src="/vendor/pdfjs/pdf.min.js" defer></script>
    <script src="/vendor/fuse.min.js" defer></script>
  <script src="/vendor/nosleep.min.js" defer></script>
  <script src="/jump-markers.js" defer></script>

    <style>
      :root {
        color-scheme: light dark;
        --surface-0: #050506;
        --surface-1: #0b0b0c;
        --surface-2: #111114;
        --accent-color: #6366F1;
        --accent-soft: rgba(99, 102, 241, 0.16);
        --accent-muted: rgba(99, 102, 241, 0.35);
        --accent-contrast: #F9FAFB;
      }
      html, body { height: 100%; }
      body {
        background: linear-gradient(145deg, color-mix(in srgb, var(--accent-color) 8%, var(--surface-0)) 0%, var(--surface-0) 55%, var(--surface-1) 100%);
        transition: background 0.4s ease;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      main#app {
        flex: 1 1 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .vh { height: 100vh; height: 100dvh; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  /* iOS smoother programmatic scrolling */
  #viewer { -webkit-overflow-scrolling: touch; }
      .card:hover { transform: translateY(-2px); }
      .tap-highlight-none { -webkit-tap-highlight-color: rgba(0,0,0,0); }
      /* iOS/iPad safe-area handling + fullscreen fixes */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      /* Controls bar: keep clear of Home indicator */
      #controls { padding-bottom: var(--sab); }
      /* In fullscreen hide header and add top/bottom safe padding to viewer */
      html.is-fs header { 
        display: none !important; 
      }
      
      html.is-fs #viewerContent {
        padding: var(--sat) 0 calc(var(--sab) + 80px) 0;
      }
      
      html.is-fs #viewerPdfContainer {
        border-radius: 0;
        border: none;
      }
      
      html.is-fs #controls {
        background: transparent;
      }
      
      html.is-fs .control-panel {
        background: linear-gradient(135deg, 
          color-mix(in srgb, var(--accent-color) 10%, rgba(12, 12, 18, 0.98)) 0%, 
          color-mix(in srgb, var(--accent-color) 5%, rgba(8, 8, 12, 0.98)) 100%);
        border: 1px solid color-mix(in srgb, var(--accent-color) 30%, rgba(255, 255, 255, 0.12));
        box-shadow: 
          0 24px 48px -12px rgba(0, 0, 0, 0.7),
          0 0 32px -8px color-mix(in srgb, var(--accent-color) 25%, transparent);
      }
      
      body[data-accent-active="true"] header {
        border-color: var(--accent-muted) !important;
        background: color-mix(in srgb, var(--accent-color) 10%, rgba(12,12,15,0.85));
      }
      .category-pill {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .category-pill:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 32px -28px rgba(0, 0, 0, 0.6);
      }
      .category-pill.is-selected {
        outline: 2px solid rgba(250, 250, 255, 0.5);
        outline-offset: 2px;
      }
      .category-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.75rem;
        padding: 0.15rem 0.55rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        text-shadow: 0 1px 1px rgba(0,0,0,0.25);
      }
      .badge-stack {
        max-height: 4.5rem;
        overflow: hidden;
        position: relative;
        padding-bottom: 0.35rem;
      }
      .badge-stack::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 28px;
        background: linear-gradient(to bottom, rgba(9,9,12,0) 0%, rgba(9,9,12,0.9) 100%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .badge-stack.is-overflowing::after {
        opacity: 1;
      }
      .glass-panel {
        backdrop-filter: blur(28px);
        background: rgba(15, 15, 21, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        box-shadow: 0 24px 48px -32px rgba(0, 0, 0, 0.65);
      }
      /* Music Card Collection */
      .music-card {
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        background: linear-gradient(160deg, var(--card-accent, var(--accent-color)) 0%, color-mix(in srgb, var(--card-accent, var(--accent-color)) 20%, #000) 100%);
        box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.6);
        transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
        cursor: pointer;
      }
      .music-card:hover { transform: translateY(-4px); box-shadow: 0 18px 36px -12px rgba(0, 0, 0, 0.7); }
      .music-card .card-bg {
        width: 100%;
        height: 220px;
        object-fit: cover;
        filter: brightness(0.9);
        display: block;
      }
      @media (min-width: 640px) { .music-card .card-bg { height: 240px; } }
      .music-card:hover .card-bg { filter: brightness(1.03); }
      .music-card .card-overlay {
        position: absolute; inset: auto 0 0 0;
        padding: 1rem;
        background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%);
        text-align: center;
      }
      .music-card .card-title { font-weight: 600; font-size: 1rem; color: #fff; }
      .music-card .card-subtitle { font-size: 0.875rem; color: rgba(255,255,255,0.82); }
      .music-card .icon-btn {
        height: 36px; width: 36px;
        display: grid; place-items: center;
        border-radius: 9999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.14);
        color: #e5e7eb;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
      }
      .music-card .icon-btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.26); }
      .music-card .icon-btn:active { transform: translateY(1px); }
      .music-card .card-actions { margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
  /* Ensure favorite star on cards turns yellow when active */
  .music-card .icon-btn.fav.text-yellow-400 { color: #facc15; }
  .music-card .icon-btn.fav.text-neutral-300 { color: #d1d5db; }
      #libraryPager {
        background: linear-gradient(180deg, rgba(9,9,12,0.85) 0%, rgba(9,9,12,0.93) 100%);
        border-top: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 -12px 30px -16px rgba(0,0,0,0.7);
        padding: 1.5rem 0;
        min-height: 80px; /* Ensure minimum touchable height on iPad */
        padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px)); /* Account for iOS safe area */
      }
      @media (max-width: 540px) {
        #libraryPager { 
          padding: 1.25rem 0;
          padding-bottom: calc(1.75rem + env(safe-area-inset-bottom, 0px));
        }
        .filter-toggle {
          display: inline-flex;
        }
      }
      .filter-toggle {
        display: none;
        align-items: center;
        gap: 0.35rem;
        padding: 0.45rem 0.75rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(17,17,23,0.6);
        color: #e5e7eb;
        font-size: 0.85rem;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .filter-toggle:hover {
        background: rgba(24,24,32,0.75);
        border-color: rgba(255,255,255,0.2);
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(6, 6, 9, 0.68);
        backdrop-filter: blur(18px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 80;
        padding: 1.25rem;
      }
      #headerUploadBtn {
        display: inline-flex !important;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #e5e7eb;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }
      #headerUploadBtn:hover {
        color: #ffffff;
        background: rgba(99, 102, 241, 0.25);
        border-color: rgba(99, 102, 241, 0.5);
        transform: translateY(-1px);
      }
      #headerUploadBtn svg {
        width: 16px;
        height: 16px;
        opacity: 0.85;
        flex-shrink: 0;
      }
      #headerUploadBtn:hover svg {
        opacity: 1;
      }
      @media (max-width: 768px) {
        .glass-panel { width: 92vw; }
      }

      /* ===== VIEWER MODE STYLES ===== */
      body.in-viewer {
        background: linear-gradient(145deg, #050506 0%, #0a0a0b 100%);
      }
      
      body.in-viewer header {
        background: rgba(12, 12, 15, 0.75);
        backdrop-filter: blur(24px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      
      #viewerShell {
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 0;
      }
      
      #viewerContent {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 0;
        padding-bottom: 0;
      }
      
      #viewerPdfContainer {
        flex: 1;
        min-height: 0;
        position: relative;
        border-radius: 0;
        overflow: hidden;
        background: transparent;
        backdrop-filter: none;
        border: none;
        box-shadow: none;
      }
      
      #viewer {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }
      
      /* PDF Page Styling */
      #viewer canvas {
        border-radius: 16px;
        box-shadow: 
          0 20px 40px -12px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.05);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      
      #viewer canvas:hover {
        transform: translateY(-2px);
        box-shadow: 
          0 24px 48px -12px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      
      [data-role="page-label"] {
        font-size: 0.75rem;
        color: #6b7280;
        margin-bottom: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.025em;
      }
      
      [data-role="skeleton"] {
        border-radius: 16px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.02) 0%,
          rgba(255, 255, 255, 0.05) 50%,
          rgba(255, 255, 255, 0.02) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 2s ease-in-out infinite;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      /* Loading State */
      .viewer-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 400px;
        gap: 1.5rem;
        padding: 3rem;
      }
      
      .viewer-loading-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: var(--accent-color);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .viewer-loading-text {
        font-size: 0.875rem;
        color: #9ca3af;
        font-weight: 500;
      }
      
      /* Smooth transitions */
      #viewerPdfContainer,
      .control-panel,
      .btn {
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      /* Focus states for accessibility */
      .btn:focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
      }
      
      .input-group input:focus {
        outline: none;
      }
      
      /* Viewer Controls - Glassmorphism Style */
      #controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 50;
        padding: 0;
        background: transparent;
        border: none;
      }
      
      #controlsInner {
        margin: 0 auto;
        max-width: 1400px;
        padding: 1rem 1rem calc(1rem + var(--sab));
      }
      
      .control-panel {
        backdrop-filter: blur(32px);
        background: linear-gradient(135deg, 
          color-mix(in srgb, var(--accent-color) 8%, rgba(17, 17, 24, 0.92)) 0%, 
          color-mix(in srgb, var(--accent-color) 4%, rgba(12, 12, 18, 0.95)) 100%);
        border: 1px solid color-mix(in srgb, var(--accent-color) 25%, rgba(255, 255, 255, 0.1));
        border-radius: 24px;
        padding: 1rem 1.5rem;
        box-shadow: 
          0 24px 48px -12px rgba(0, 0, 0, 0.6),
          0 0 0 1px color-mix(in srgb, var(--accent-color) 15%, rgba(255, 255, 255, 0.03)) inset,
          0 0 24px -8px color-mix(in srgb, var(--accent-color) 20%, transparent);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }
      
      .control-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      
      .control-divider {
        width: 1px;
        height: 28px;
        background: linear-gradient(to bottom, 
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.1) 50%,
          rgba(255, 255, 255, 0) 100%);
      }
      
      /* Button Styles - Consistent Design */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.625rem 1.25rem;
        border-radius: 12px;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border: none;
        outline: none;
        white-space: nowrap;
        position: relative;
        overflow: hidden;
      }
      
      .btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
        opacity: 0;
        transition: opacity 0.2s;
      }
      
      .btn:hover::before {
        opacity: 1;
      }
      
      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #e5e7eb;
      }
      
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-1px);
        box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.3);
      }
      
      .btn-secondary:active {
        transform: translateY(0);
      }
      
      .btn-primary {
        background: linear-gradient(135deg, 
          var(--accent-color) 0%, 
          color-mix(in srgb, var(--accent-color) 80%, #000) 100%);
        border: 1px solid color-mix(in srgb, var(--accent-color) 100%, rgba(255, 255, 255, 0.3));
        color: white;
        box-shadow: 0 4px 12px -2px color-mix(in srgb, var(--accent-color) 50%, transparent);
        opacity: 0;
        transition: opacity 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
      }
      
      .btn-primary.is-ready {
        opacity: 1;
      }
      
      .btn-primary:hover {
        background: linear-gradient(135deg, 
          color-mix(in srgb, var(--accent-color) 90%, #fff) 0%, 
          var(--accent-color) 100%);
        transform: translateY(-1px);
        box-shadow: 0 8px 20px -4px color-mix(in srgb, var(--accent-color) 60%, transparent);
      }
      
      .btn-primary:active {
        transform: translateY(0);
      }
      
      .btn-icon {
        padding: 0.625rem;
        min-width: 2.5rem;
      }
      
      .btn-icon svg {
        width: 1.25rem;
        height: 1.25rem;
      }

      #btnEditMarkers svg {
        width: 1.35rem;
        height: 1.35rem;
      }

      /* Input Styles */
      .input-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        transition: all 0.2s;
      }
      
      .input-group:focus-within {
        background: rgba(255, 255, 255, 0.06);
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 15%, transparent);
      }
      
      .input-group label {
        font-size: 0.75rem;
        color: #9ca3af;
        white-space: nowrap;
        user-select: none;
      }
      
      .input-group input {
        background: transparent;
        border: none;
        color: #e5e7eb;
        font-size: 0.875rem;
        font-weight: 500;
        outline: none;
        width: 3.5rem;
        text-align: center;
      }
      
      .input-group input::-webkit-inner-spin-button,
      .input-group input::-webkit-outer-spin-button {
        opacity: 0.5;
      }
      
      /* Status Display */
      .status-display {
        margin-left: auto;
        font-size: 0.8rem;
        color: #9ca3af;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
      }
      
      .status-display::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      /* Mobile tweaks */
      @media (max-width: 640px) {
        #viewerContent {
          padding: 0;
        }
        
        #viewerPdfContainer {
          border-radius: 0;
        }
        
        #controlsInner {
          padding: 0.75rem 0.75rem calc(0.75rem + var(--sab));
        }
        
        .control-panel {
          padding: 0.875rem 1rem;
          border-radius: 20px;
        }
        
        .btn {
          padding: 0.5rem 1rem;
          font-size: 0.8125rem;
        }
        
        .btn-icon {
          padding: 0.5rem;
          min-width: 2.25rem;
        }
        
        .status-display {
          flex-basis: 100%;
          justify-content: center;
          margin-left: 0;
          margin-top: 0.5rem;
        }
        
        .control-divider {
          display: none;
        }
      }

      /* Ultra-small phones (e.g., 320–380px) */
      @media (max-width: 380px) {
        .site-title-text { display: none; }
        #header-actions { gap: 0.25rem; }
        #headerModeSwitch button { padding: 0.25rem 0.5rem; font-size: 0.85rem; }
        #headerUploadBtn { padding: 0.4rem; }
        #headerUploadBtn span { display: none; }
        #headerUploadBtn svg { width: 18px; height: 18px; }
        
        .btn span:not(.sr-only) {
          display: none;
        }
        
        .btn-icon span {
          display: none;
        }
        
        .input-group label {
          font-size: 0.7rem;
        }
      }

      /* Sort dropdown: ensure it fits on narrow screens */
      @media (max-width: 480px) {
        #sortMenu { max-width: 92vw; }
      }

      /* Ensure dropdown is above all other elements */
      #sortMenu {
        z-index: 9999 !important; /* Above everything except modals */
        position: absolute !important;
        background: #101320;
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 22px 45px rgba(4, 6, 12, 0.55);
      }
      #sortMenu button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        background: transparent;
        color: #e5e7eb;
        font-size: 0.875rem;
        padding: 0.65rem 1rem;
        transition: background 0.18s ease, color 0.18s ease;
      }
      #sortMenu button:hover,
      #sortMenu button:focus-visible {
        background: #1b2333;
        color: #f8fafc;
        outline: none;
      }
      #sortMenu button.is-active {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.18) 0%, rgba(30, 34, 48, 0.9) 100%);
        color: #f9fafb;
      }
      #sortMenu button .sortMenuCheck {
        opacity: 0;
        font-size: 0.9rem;
        color: #c7d2fe;
        transition: opacity 0.18s ease;
      }
      #sortMenu button.is-active .sortMenuCheck {
        opacity: 1;
      }
    </style>
  </head>
  <body class="min-h-screen bg-neutral-950 text-neutral-100 antialiased tap-highlight-none">
    <!-- Header -->
    <header class="sticky top-0 z-30 bg-neutral-950/80 backdrop-blur border-b border-neutral-800">
      <div class="mx-auto max-w-7xl px-4 min-h-14 h-auto py-2 flex flex-wrap items-center justify-between gap-2 sm:gap-3">
        <a href="/" aria-label="Piano Sheets" class="text-base sm:text-lg font-semibold tracking-tight truncate max-w-[58vw] shrink-0 flex items-center gap-2">
          <span class="text-lg">🎼</span>
          <span class="site-title-text">Piano Sheets</span>
        </a>
        <div id="header-actions" class="flex flex-wrap items-center justify-end gap-2 shrink-0"></div>
      </div>
    </header>

    <!-- Main app mount point -->
    <main id="app" class="mx-auto max-w-7xl px-4 py-6"></main>

    <!-- Viewer Controls - Modern Glassmorphism Design -->
    <div id="controls" class="hidden">
      <div id="controlsInner">
        <div class="control-panel">

        if (window.visualViewport) window.visualViewport.addEventListener('resize', updateHeight);
        // Delay initial measurement to ensure layout is settled
        requestAnimationFrame(() => requestAnimationFrame(updateHeight));
        cleanupLibraryViewportSizing = () => {
          resizeEvents.forEach(evt => window.removeEventListener(evt, updateHeight));
          if (window.visualViewport) window.visualViewport.removeEventListener('resize', updateHeight);
          if (wrap.isConnected) wrap.style.height = '';
        };
      }

      // ===== Router =====
      (async function init() {
        // Initialize playlist sync early for UI affordances
        try { await fetchPlaylist(); } catch {}
        connectPlaylistEvents();
        if (currentFile) {
          await hydrateCategories();
          await renderViewer(decodeURIComponent(currentFile));
        } else {
          await loadPrefsFromBackend();
          await hydrateCategories();
          await loadPage();
          renderLibrary();
        }
      })();

      // ===== Backend Prefs =====
      async function loadPrefsFromBackend() {
        try {
          const res = await fetch("/api/prefs", { cache: "no-store" });
          if (!res.ok) return;
          const prefs = await res.json();
          if (Array.isArray(prefs.favorites)) {
            state.library.favorites = new Set(prefs.favorites);
          }
        } catch {}
      }
      async function setFavoriteOnBackend(name, favorite) {
        try {
          const res = await fetch("/api/prefs/favorites", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, favorite })
          });
          if (res.ok) {
            const j = await res.json();
            if (Array.isArray(j.favorites)) {
              state.library.favorites = new Set(j.favorites);
            }
          }
        } catch {}
      }
      async function getFilePrefsFromBackend(name) {
        try {
          const res = await fetch(`/api/prefs/file?name=${encodeURIComponent(name)}`, { cache: "no-store" });
          if (!res.ok) return null;
          const j = await res.json();
          return {
            secsPerPage: Number(j.secsPerPage) || null,
            categories: Array.isArray(j.categories) ? j.categories : [],
            categoryIds: Array.isArray(j.categoryIds) ? j.categoryIds : [],
            jumpMarkers: Array.isArray(j.jumpMarkers) ? j.jumpMarkers : []
          };
        } catch { return null; }
      }
      async function setFileSecsOnBackend(name, secs) {
        try {
          await fetch("/api/prefs/file", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, secsPerPage: secs })
          });
        } catch {}
      }

      async function setFileCategoriesOnBackend(name, categories) {
        try {
          const res = await fetch("/api/prefs/file", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, categories })
          });
          if (res?.ok) {
            const payload = await res.json();
            return payload;
          }
        } catch {}
        return null;
      }

      async function hydrateCategories() {
        try {
          const res = await fetch("/api/categories", { cache: "no-store" });
          if (!res.ok) return;
          const data = await res.json();
          if (Array.isArray(data.categories)) {
            state.categories = data.categories;
            // Preserve special filter 'none' (uncategorized)
            if (state.library.categoryFilter && state.library.categoryFilter !== 'none' && !state.categories.some(cat => cat.id === state.library.categoryFilter)) {
              state.library.categoryFilter = null;
              localStorage.removeItem("libCategory");
            }
          }
        } catch {}
      }

      async function createCategoryOnBackend(payload) {
        try {
          const res = await fetch("/api/categories", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (res?.ok) {
            const data = await res.json();
            if (Array.isArray(data.categories)) {
              state.categories = data.categories;
            }
            return data.category || null;
          }
        } catch {}
        return null;
      }

      async function updateCategoryOnBackend(id, payload) {
        try {
          const res = await fetch(`/api/categories/${encodeURIComponent(id)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (res?.ok) {
            const data = await res.json();
            if (Array.isArray(data.categories)) {
              state.categories = data.categories;
            }
            return data.category || null;
          }
        } catch {}
        return null;
      }

      async function deleteCategoryOnBackend(id) {
        try {
          const res = await fetch(`/api/categories/${encodeURIComponent(id)}`, {
            method: "DELETE"
          });
          if (res?.ok) {
            const data = await res.json();
            if (Array.isArray(data.categories)) {
              state.categories = data.categories;
            }
            return true;
          }
        } catch {}
        return false;
      }

      const categoryHelpers = {
        byId(id) {
          return state.categories.find((cat) => cat.id === id) || null;
        },
        toChip(cat, size = "sm") {
          if (!cat) return "";
          const px = size === "lg" ? "0.35rem 0.75rem" : "0.2rem 0.55rem";
          const font = size === "lg" ? "0.8rem" : "0.72rem";
          return `<span class="category-chip" style="background:${cat.color}1a;border-color:${cat.color}44;color:${cat.color};padding:${px};font-size:${font};">${cat.icon || "♪"}<span class="truncate max-w-[8rem] inline-block align-middle">${cat.name}</span></span>`;
        }
      };

      function applyAccentTheme(catId) {
        const targetCat = catId ? categoryHelpers.byId(catId) : null;
        const accent = targetCat?.color || null;
        const icon = targetCat?.icon || null;
        state.ui.accentColor = accent;
        state.ui.accentSource = targetCat ? { id: targetCat.id, icon } : null;

        const root = document.documentElement;
        if (accent) {
          root.style.setProperty("--accent-color", accent);
          root.style.setProperty("--accent-soft", `${accent}26`);
          root.style.setProperty("--accent-muted", `${accent}4d`);
          document.body.setAttribute("data-accent-active", "true");
        } else {
          root.style.setProperty("--accent-color", "#6366F1");
          root.style.setProperty("--accent-soft", "rgba(99, 102, 241, 0.16)");
          root.style.setProperty("--accent-muted", "rgba(99, 102, 241, 0.35)");
          document.body.removeAttribute("data-accent-active");
        }
      }
      
      function applyPlayButtonColor() {
        const playBtn = document.querySelector('#btnPlayPause');
        if (!playBtn) return;
        
        // Erst Farbe setzen, dann sichtbar machen
        requestAnimationFrame(() => {
          playBtn.classList.add('is-ready');
        });
      }

      const DEFAULT_UPLOAD_LIMIT_MB = 200;

      function ensureUploadButton() {
        // Check if button exists AND is still in the DOM
        if (uploadBtn && uploadBtn.isConnected) return;
        
        uploadBtn = document.createElement('button');
        uploadBtn.id = 'headerUploadBtn';
        uploadBtn.type = 'button';
        uploadBtn.className = 'inline-flex items-center gap-2 px-3.5 py-2 rounded-lg border border-neutral-800/60 bg-gradient-to-br from-neutral-900/90 to-neutral-900/70 hover:from-neutral-800/90 hover:to-neutral-800/70 text-neutral-200 hover:text-white transition-all shadow-sm hover:shadow-md font-medium text-sm';
        uploadBtn.setAttribute('aria-label', 'Neues PDF hochladen');
        uploadBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Upload</span>
        `;
        uploadBtn.addEventListener('click', () => {
          openUploadDialog();
        });
        headerActionsEl.appendChild(uploadBtn);
      }

      function setUploadButtonVisible(visible) {
        if (!uploadBtn || !uploadBtn.isConnected) return;
        const shouldShow = Boolean(visible && !state.ui.uploadOpen && state.ui.uploadSupported);
        uploadBtn.hidden = !shouldShow;
      }

      async function openUploadDialog() {
        if (state.ui.uploadOpen) return;
        state.ui.uploadOpen = true;
        let backdrop = null;
        try {
          try { await hydrateCategories(); } catch (err) { console.warn('Kategorien konnten nicht aktualisiert werden:', err); }

          ensureUploadButton();
          setUploadButtonVisible(false);

          const categories = Array.isArray(state.categories) ? state.categories : [];
          const selected = new Set();
          const limitMb = state.ui.uploadLimitMb || DEFAULT_UPLOAD_LIMIT_MB;

          const categoriesMarkup = categories.length
            ? categories.map((cat) => {
              const color = cat.color || '#6366F1';
              return `<button type="button" class="category-pill px-3 py-1.5 rounded-full border border-neutral-700/70 text-sm text-neutral-200 hover:bg-neutral-800 flex items-center gap-2" data-cat="${cat.id}">
                  <span class="text-lg">${cat.icon || '♪'}</span>
                  <span>${cat.name}</span>
                  <span data-role="indicator" class="hidden text-xs text-emerald-300">✓</span>
                </button>`;
            }).join('')
            : '<div class="rounded-xl border border-dashed border-neutral-700 p-4 text-neutral-400 text-sm">Keine Kategorien vorhanden.</div>';

          backdrop = document.createElement('div');
          backdrop.className = 'modal-backdrop';
          backdrop.dataset.modal = 'upload';
          backdrop.innerHTML = `
            <div class="glass-panel w-[560px] max-w-full p-6 text-sm text-neutral-200" role="dialog" aria-modal="true">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <div class="text-xs uppercase tracking-wide text-neutral-500">Bibliothek</div>
                  <h2 class="text-lg font-semibold text-neutral-100">Neues PDF hinzufügen</h2>
                </div>
                <button type="button" class="px-2 py-1 rounded-full border border-neutral-700 text-neutral-400 hover:text-neutral-200" data-role="close">✕</button>
              </div>
              <form id="uploadForm" class="mt-5 space-y-4" enctype="multipart/form-data">
                <label class="flex flex-col gap-2 text-sm text-neutral-300">
                  <span class="text-xs uppercase tracking-wide text-neutral-400">PDF Datei</span>
                  <input type="file" name="file" accept="application/pdf" required class="px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-700 text-sm" />
                  <span data-role="fileLabel" class="text-xs text-neutral-500">${limitMb} MB max • Nur PDF</span>
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <label class="text-xs uppercase tracking-wide text-neutral-400">Scrollzeit pro Seite
                    <input type="number" name="secsPerPage" min="5" max="600" class="mt-1 w-full px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-700" placeholder="z.B. 45" />
                  </label>
                  <label class="flex items-center gap-2 text-sm text-neutral-300 sm:mt-6">
                    <input type="checkbox" name="favorite" class="h-4 w-4 rounded border-neutral-600 bg-neutral-900" />
                    <span>Als Favorit markieren</span>
                  </label>
                </div>
                <div>
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xs uppercase tracking-wide text-neutral-400">Kategorien (optional)</span>
                    <button type="button" data-role="manage" class="text-xs text-emerald-400 hover:text-emerald-200">Neue Kategorie</button>
                  </div>
                  <div id="uploadCategoryList" class="mt-3 flex flex-wrap gap-2">${categoriesMarkup}</div>
                </div>
                <p data-role="status" class="text-xs text-amber-400 min-h-[1.25rem]"></p>
                <div class="flex justify-end gap-2">
                  <button type="button" data-role="cancel" class="px-3 py-2 rounded-lg border border-neutral-700 text-neutral-200 hover:bg-neutral-800">Abbrechen</button>
                  <button type="submit" class="px-3 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-500">Hochladen</button>
                </div>
              </form>
            </div>`;

          document.body.appendChild(backdrop);

          const form = backdrop.querySelector('#uploadForm');
          const statusEl = form.querySelector('[data-role="status"]');
          const fileInput = form.querySelector('input[name="file"]');
          const fileLabel = form.querySelector('[data-role="fileLabel"]');
          const favoriteInput = form.querySelector('input[name="favorite"]');
          const secsInput = form.querySelector('input[name="secsPerPage"]');
          const submitBtn = form.querySelector('button[type="submit"]');
          const cancelBtn = form.querySelector('[data-role="cancel"]');
          const manageBtn = form.querySelector('[data-role="manage"]');

          let modalClosed = false;
          const handleKeyDown = (ev) => {
            if (ev.key === 'Escape') {
              ev.preventDefault();
              closeModal();
            }
          };

          function closeModal() {
            if (modalClosed) return;
            modalClosed = true;
            document.removeEventListener('keydown', handleKeyDown);
            backdrop.remove();
            state.ui.uploadOpen = false;
            setUploadButtonVisible(true);
            uploadBtn?.focus();
          }

          document.addEventListener('keydown', handleKeyDown);

          backdrop.addEventListener('click', (ev) => {
            if (ev.target === backdrop) closeModal();
          });

          backdrop.querySelectorAll('[data-role="close"]').forEach((btn) => btn.addEventListener('click', closeModal));
          cancelBtn?.addEventListener('click', closeModal);

          if (manageBtn) {
            manageBtn.addEventListener('click', () => {
              closeModal();
              openCategoryManager({ focusMode: 'create' });
            });
          }

          backdrop.querySelectorAll('[data-cat]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-cat');
              if (!id) return;
              if (selected.has(id)) {
                selected.delete(id);
                btn.classList.remove('is-selected');
                btn.querySelector('[data-role="indicator"]')?.classList.add('hidden');
              } else {
                selected.add(id);
                btn.classList.add('is-selected');
                btn.querySelector('[data-role="indicator"]')?.classList.remove('hidden');
              }
            });
          });

          fileInput.addEventListener('change', () => {
            const name = fileInput.files?.[0]?.name;
            fileLabel.textContent = name ? `Ausgewählt: ${name}` : `${limitMb} MB max • Nur PDF`;
            statusEl.textContent = '';
          });

          form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            statusEl.textContent = '';
            const file = fileInput.files?.[0];
            if (!file) {
              statusEl.textContent = 'Bitte wähle eine PDF-Datei aus.';
              return;
            }
            const lowerName = (file.name || '').toLowerCase();
            const declaredType = (file.type || '').toLowerCase();
            if (!declaredType.includes('pdf') && !lowerName.endsWith('.pdf')) {
              statusEl.textContent = 'Nur PDF-Dateien können hochgeladen werden.';
              return;
            }
            const secsRaw = (secsInput.value || '').trim();
            let secsValue = null;
            if (secsRaw) {
              const parsed = Number(secsRaw);
              if (!Number.isFinite(parsed) || parsed < 5 || parsed > 600) {
                statusEl.textContent = 'Sekunden pro Seite müssen zwischen 5 und 600 liegen.';
                return;
              }
              secsValue = Math.round(parsed);
            }
            const metaPayload = {
              originalName: file.name || 'upload.pdf',
              categories: Array.from(selected),
              favorite: favoriteInput.checked
            };
            if (secsValue !== null) metaPayload.secsPerPage = secsValue;

            submitBtn.disabled = true;
            cancelBtn.disabled = true;
            submitBtn.textContent = 'Lade hoch…';

            try {
              // Avoid setting Content-Type explicitly to let the browser choose;
              // some iOS browsers throw TypeError on manual Content-Type with Blob bodies.
              const headers = new Headers({
                'X-Upload-Name': (file.name && file.name.toLowerCase().endsWith('.pdf')) ? file.name : (file.name || 'upload.pdf'),
                'X-Upload-Meta': JSON.stringify(metaPayload),
                'Accept': 'application/json'
              });

              const res = await fetch('/api/upload', { method: 'POST', headers, body: file });
              let payload;
              try {
                payload = await res.json();
              } catch {
                payload = {};
              }
              if (!res.ok || !payload.ok) {
                const err = new Error(payload.error || 'Upload fehlgeschlagen.');
                err.status = res.status;
                throw err;
              }
              state.ui.uploadSupported = true;
              if (Array.isArray(payload.favorites)) {
                state.library.favorites = new Set(payload.favorites);
              }
              if (payload.maxUploadBytes) {
                const mb = Math.round(Number(payload.maxUploadBytes) / 1024 / 1024);
                if (Number.isFinite(mb) && mb > 0) {
                  state.ui.uploadLimitMb = mb;
                }
              }
              closeModal();
              await loadPage();
              renderLibrary();
            } catch (error) {
              // Normalize Safari/iOS TypeError messages
              if (error?.name === 'TypeError' && !error.status) {
                error.message = 'Netzwerkfehler beim Upload (TypeError). Bitte erneut versuchen.';
              }
              if (error.status === 503) {
                state.ui.uploadSupported = false;
                statusEl.textContent = error.message || 'Uploads sind aktuell nicht verfügbar.';
                setTimeout(() => {
                  closeModal();
                  setUploadButtonVisible(false);
                }, 1000);
                return;
              }
              if (error.status === 413) {
                statusEl.textContent = `Datei ist zu groß (max. ${limitMb} MB).`;
              } else if (error.status === 415) {
                statusEl.textContent = 'Nur PDF-Dateien erlaubt.';
              } else {
                statusEl.textContent = error.message || 'Upload fehlgeschlagen.';
              }
              submitBtn.disabled = false;
              cancelBtn.disabled = false;
              submitBtn.textContent = 'Hochladen';
            }
          });

          requestAnimationFrame(() => fileInput.focus());
        } catch (err) {
          console.error('Upload-Dialog konnte nicht geöffnet werden:', err);
          if (backdrop?.isConnected) backdrop.remove();
          state.ui.uploadOpen = false;
          setUploadButtonVisible(true);
        }
      }

      // ===== API (Library) =====
      async function fetchPage({ q = "", sort, order, page, pageSize, fav = false, category = null }) {
        const qs = new URLSearchParams({ q, sort, order, page: String(page), pageSize: String(pageSize) });
        if (fav) qs.set("fav", "1");
        if (category) qs.set("category", category);
        const res = await fetch(`/api/sheets?${qs.toString()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("API error");
        return res.json();
      }
      async function loadPage() {
        const L = state.library;
        // Keep page fixed when paginating; don't reset page here.
        const data = await fetchPage({ q: L.q, sort: L.sort, order: L.order, page: L.page, pageSize: L.pageSize, fav: L.onlyFavorites, category: L.categoryFilter });
        L.items = data.items || [];
        L.total = data.total || 0;
        if (Array.isArray(data.categories)) {
          state.categories = data.categories;
          // Preserve special filter 'none' (uncategorized)
          if (L.categoryFilter && L.categoryFilter !== 'none' && !state.categories.some(cat => cat.id === L.categoryFilter)) {
            L.categoryFilter = null;
            localStorage.removeItem("libCategory");
          }
        }
      }

      async function applyCategoryFilter(catId) {
        state.library.categoryFilter = catId || null;
        // Do not accent the synthetic 'none' filter
        applyAccentTheme(state.library.categoryFilter === 'none' ? null : state.library.categoryFilter);
        if (state.library.categoryFilter) localStorage.setItem("libCategory", state.library.categoryFilter);
        else localStorage.removeItem("libCategory");
        state.library.page = 1;
        appEl.innerHTML = '<div class="flex items-center justify-center h-[60vh] text-neutral-400">Lade…</div>';
        await loadPage();
        renderLibrary();
      }

      async function fetchPlaylist() {
        try {
          const res = await fetch('/api/playlist', { cache: 'no-store' });
          if (!res.ok) return;
          const data = await res.json();
          applyPlaylistSnapshot(data);
        } catch {}
      }
      function connectPlaylistEvents() {
        try { playlist.es?.close?.(); } catch {}
        const es = new EventSource('/api/playlist/events');
        es.onmessage = (ev) => {
          try { const data = JSON.parse(ev.data); applyPlaylistSnapshot(data); } catch {}
        };
        es.onerror = () => { try { es.close(); } catch {}; setTimeout(connectPlaylistEvents, 2000); };
        playlist.es = es;
      }
      function applyPlaylistSnapshot(data) {
        if (!data || typeof data !== 'object') return;
        playlist.items = Array.isArray(data.items) ? data.items : [];
        playlist.currentIndex = Number.isInteger(data.currentIndex) ? data.currentIndex : -1;
        playlist.name = data.name || null;
        playlist.updatedAt = Number(data.updatedAt) || Date.now();
        // Update any open panels or controls
        updatePlaylistPanel();
        updateViewerPlaylistControls();
        updateLibraryPlaylistButtons();
        if (!document.body.classList.contains('in-viewer') && playlist.mode) {
          // If we're in library and playlist is visible, refresh the grid
          renderPlaylistLibrary();
        }
      }

              const order = [...playlist.items];

      // ===== Virtualized Grid/List (simplified without canvas thumbnails) =====
      function mountVirtualizer(resetScroll = false) {
        const wrap = document.querySelector('#virtualWrap');
        wrap.innerHTML = "";

        const L = state.library;
        let items = L.items;

        const fuse = window.Fuse && L.q
          ? new Fuse(items, { keys: ["name"], threshold: 0.3 })
          : null;
        if (fuse) items = fuse.search(L.q).map(r => r.item);

        const isGrid = L.view === "grid";
        const wrapW = wrap.clientWidth;
        const minCardW = 220;      // minimal card width
        const maxCardW = 320;      // cap card width for medium screens to avoid huge tiles
        const minGap = 16;         // minimal horizontal gap between cards
        let cols = isGrid ? Math.max(1, Math.floor((wrapW + minGap) / (minCardW + minGap))) : 1;
        const cardH = isGrid ? 360 : 88; // list rows a bit taller for nicer padding
        const listGap = 10;              // add vertical spacing between list items
        // Base computation with min width
        let gridCardW = isGrid ? Math.floor((wrapW - (cols - 1) * minGap) / cols) : wrapW;
        // If cards get too wide, increase columns to keep a modern responsive look
        if (isGrid && gridCardW > maxCardW) {
          cols = Math.max(1, Math.floor((wrapW + minGap) / (maxCardW + minGap)));
          gridCardW = Math.floor((wrapW - (cols - 1) * minGap) / cols);
        }
        const gap = isGrid ? minGap : listGap; // keep gap consistent; consume space by growing card width

        const total = items.length;
  const rows = Math.ceil(total / cols);
  const rowStride = cardH + gap;
  const totalHeight = rows * rowStride - gap; // avoid extra gap at end

        const scroller = document.createElement("div");
        scroller.className = "relative w-full h-full overflow-auto no-scrollbar";
        const spacer = document.createElement("div");
        spacer.style.height = `${totalHeight}px`;
        spacer.style.position = "relative";
        scroller.appendChild(spacer);
        wrap.appendChild(scroller);

        const pool = new Map();

        function renderViewport() {
          const scrollTop = scroller.scrollTop;
          const viewH = scroller.clientHeight;
          const bufferRows = 3;

          const firstRow = Math.max(0, Math.floor(scrollTop / rowStride) - bufferRows);
          const lastRow  = Math.min(rows - 1, Math.floor((scrollTop + viewH) / rowStride) + bufferRows);

          const firstIndex = firstRow * cols;
          const lastIndex  = Math.min(total - 1, (lastRow + 1) * cols - 1);

          // Simple cleanup - remove out-of-view elements
          for (const [key, el] of pool) {
            const idx = Number(key);
            if (idx < firstIndex || idx > lastIndex) {
              el.remove();
              pool.delete(key);
            }
          }

          for (let i = firstIndex; i <= lastIndex; i++) {
            if (i < 0 || i >= total) continue;
            const key = String(i);
            if (pool.has(key)) continue;

            const item = items[i];
            const col = i % cols;
            const row = Math.floor(i / cols);
            const startX = 0; // align with filters/categories grid (no centering)
            const x = isGrid ? startX + col * (gridCardW + gap) : startX;
            const y = row * rowStride;

            const el = isGrid ? renderCard(item) : renderRow(item);
            el.style.position = "absolute";
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.width = `${isGrid ? gridCardW : wrapW}px`;
            el.style.height = `${cardH}px`;

            spacer.appendChild(el);
            pool.set(key, el);
            // Keep playlist add-buttons in sync for newly mounted nodes
            updateLibraryPlaylistButtons();
          }
        }

        // Throttle renderViewport using requestAnimationFrame
        let renderTimer = null;
        function scheduleRenderViewport() {
          if (renderTimer) return;
          renderTimer = requestAnimationFrame(() => {
            renderViewport();
            renderTimer = null;
          });
        }
        scroller.addEventListener("scroll", scheduleRenderViewport, { passive: true });
        window.addEventListener("resize", () => mountVirtualizer(false), { once: true });

        renderViewport();
        if (resetScroll) scroller.scrollTop = 0;
      }

          if (!Number.isInteger(current) || current < 0) return;
          if (current === from) {
            playlist.currentIndex = to;
            return;
          }
          if (from < to) {
            if (current > from && current <= to) playlist.currentIndex = current - 1;
          } else if (from > to) {
            if (current < from && current >= to) playlist.currentIndex = current + 1;
          }
        };

        const moveRow = (from, to, { animate = true, notifyServer = true } = {}) => {
          if (from === to) return;
          const rows = Array.from(listEl.querySelectorAll('[data-row]'));
          const moving = rows[from];
          if (!moving) return;
          const target = rows[to];
          if (to > from) {
            const anchor = target ? target.nextElementSibling : null;
            listEl.insertBefore(moving, anchor);
          } else {
            listEl.insertBefore(moving, target || null);
          }
          const order = [...playlist.items];
          const [movedItem] = order.splice(from, 1);
          order.splice(to, 0, movedItem);
          adjustCurrentIndex(from, to);
          playlist.items = order;
          refreshRowMetadata();
          if (animate) {
            moving.animate(
              [
                { transform: 'scale(0.97)', boxShadow: '0 0 0 rgba(0,0,0,0)' },
                { transform: 'scale(1.02)', boxShadow: '0 18px 32px rgba(0,0,0,0.32)' },

        listEl.querySelectorAll('[data-row]').forEach((row) => {

        // Drag & Drop (mouse + touch via Pointer Events)
        (function setupPlaylistDnd() {
          const container = listEl;
          let drag = null;

          const scheduleGhostTransform = (x, y) => {
            if (!drag) return;
            drag.pending = { x, y };
            if (drag.frame) return;
            drag.frame = requestAnimationFrame(() => {
              if (!drag || !drag.pending) return;
              drag.ghost.style.transform = `translate3d(${drag.pending.x}px, ${drag.pending.y}px, 0) scale(1.02)`;
              drag.frame = null;
            });
          };

          const cleanupListeners = () => {
            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);
            document.removeEventListener('pointercancel', onPointerUp);
          };

          const autoscrollIfNeeded = (clientY) => {
            const rect = container.getBoundingClientRect();
            const threshold = 56;
            if (clientY < rect.top + threshold) {
              container.scrollTop -= 14;
            } else if (clientY > rect.bottom - threshold) {
              container.scrollTop += 14;
            }
          };

          const currentTargetIndex = (clientY) => {
            const rows = Array.from(container.querySelectorAll('[data-row]')).filter((el) => el.style.display !== 'none');
            for (let i = 0; i < rows.length; i++) {
              const r = rows[i].getBoundingClientRect();
              if (clientY < r.top + r.height / 2) return i;
            }
            return rows.length;
          };

          function onPointerDown(ev) {
            const handle = ev.target.closest && ev.target.closest('[data-drag-handle]');
            if (!handle) return;
            if (ev.button !== 0 && ev.pointerType === 'mouse') return;
            const row = handle.closest('[data-row]');
            if (!row) return;
            const idx = Number(row.getAttribute('data-row'));
            if (!Number.isFinite(idx)) return;
            ev.preventDefault();
            handle.setPointerCapture?.(ev.pointerId);

            const rect = row.getBoundingClientRect();
            const ghost = row.cloneNode(true);
            ghost.classList.add('playlist-ghost');
            ghost.style.position = 'fixed';
            ghost.style.left = '0px';
            ghost.style.top = '0px';
            ghost.style.width = rect.width + 'px';
            ghost.style.height = rect.height + 'px';
            ghost.style.zIndex = '1000';
            ghost.style.pointerEvents = 'none';
            ghost.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0)`;
            ghost.style.transition = 'transform 0.08s ease-out';

            const placeholder = document.createElement('div');
            placeholder.className = 'playlist-placeholder';
            placeholder.style.setProperty('--placeholder-height', `${rect.height}px`);

            row.classList.add('is-dragging-source');
            row.style.display = 'none';
            row.parentElement.insertBefore(placeholder, row.nextSibling);
            document.body.appendChild(ghost);

            drag = {
              pointerId: ev.pointerId,
              row,
              idx,
              ghost,
              placeholder,
              offsetX: ev.clientX - rect.left,
              offsetY: ev.clientY - rect.top,
              list: container,
              frame: null,
              pending: null
            };

            scheduleGhostTransform(rect.left, rect.top);

            document.addEventListener('pointermove', onPointerMove, { passive: false });
            document.addEventListener('pointerup', onPointerUp, { passive: true });
            document.addEventListener('pointercancel', onPointerUp, { passive: true });
          }

          function onPointerMove(ev) {
            if (!drag) return;
            ev.preventDefault();
            const x = ev.clientX - drag.offsetX;
            const y = ev.clientY - drag.offsetY;
            scheduleGhostTransform(x, y);
            autoscrollIfNeeded(ev.clientY);

            const targetIndex = currentTargetIndex(ev.clientY);
            const visibleRows = Array.from(container.querySelectorAll('[data-row]')).filter((el) => el.style.display !== 'none');
            const anchor = visibleRows[targetIndex] || null;
            if (anchor) {
              if (drag.placeholder.nextElementSibling !== anchor) {
                container.insertBefore(drag.placeholder, anchor);
              }
            } else if (container.lastElementChild !== drag.placeholder) {
              container.appendChild(drag.placeholder);
            }
          }

          function onPointerUp(ev) {
            if (!drag) return;
            cleanupListeners();
            if (drag.frame) {
              cancelAnimationFrame(drag.frame);
              drag.frame = null;
            }

            const { row, ghost, placeholder, idx } = drag;
            const children = Array.from(container.children);
            const placeholderIndex = children.indexOf(placeholder);
            placeholder.remove();
            row.style.display = '';
            row.classList.remove('is-dragging-source');
            ghost.remove();

            const maxIndex = Math.max(0, container.querySelectorAll('[data-row]').length - 1);
            let targetIndex = placeholderIndex;
            if (targetIndex < 0) targetIndex = idx;
            targetIndex = Math.max(0, Math.min(maxIndex, targetIndex));

            moveRow(idx, targetIndex, { animate: true, notifyServer: true });

            drag = null;
          }

          listEl.addEventListener('pointerdown', onPointerDown);
        })();

        // Top buttons
        const playBtn = document.querySelector('#btnPlPlay');
        const playBtnSm = document.querySelector('#btnPlPlaySm');
        const doPlayFromStart = async () => {
          if (!playlist.items.length) return;

      async function navigatePlaylist(delta) {

      // Allow manual scroll override while auto-scroll is running
      function registerUserScrollControls(container) {
        const el = container;
        if (!el) return;
        const S = state.viewer.autoScroll;
        S.userAdjusting = false;
        S.userActiveUntil = 0; // timestamp until which we honor user momentum/settling
        S.ignoreScrollUntil = 0; // timestamp to ignore programmatic scroll events
        S._lastScrollTop = el.scrollTop || 0;
        S._lastScrollTs = performance.now();

        const now = () => performance.now();

        const onPointerDown = () => {
          if (!S.running) return;
          S.userAdjusting = true;
          // While dragging, treat as user-controlled
          S.userActiveUntil = now() + 2000; // generous window updated on events
        };
        const onPointerUp = () => {
          if (!S.running) { S.userAdjusting = false; return; }
          // Lock new base position from where to continue
          S.pos = el.scrollTop || 0;
          S.lastTs = now();
          S.userAdjusting = false;
          // Allow momentum/settling just after release
          S.userActiveUntil = now() + 600;
        };
        const onWheel = () => {
          if (!S.running) return;
          // Treat wheel as user adjustment for a short grace period
          S.userActiveUntil = now() + 1200; // allow stronger inertia
        };
        const onScroll = () => {
          if (!S.running) return;
          const t = performance.now();
          if (t < (S.ignoreScrollUntil || 0)) return;
          // Compute instantaneous velocity to scale grace window
          const top = el.scrollTop || 0;
          const dtMs = Math.max(1, t - (S._lastScrollTs || t));
          const dy = top - (S._lastScrollTop || top);
          const v = Math.abs(dy) / (dtMs / 1000); // px/sec
          let grace;
          if (v > 2500) grace = 2000;
          else if (v > 1500) grace = 1400;
          else if (v > 800) grace = 1000;
          else grace = 600;
          S.userActiveUntil = t + grace;
          // Track live user position so we resume from here
          S.pos = top;
          S.lastTs = t;
          S._lastScrollTop = top;
          S._lastScrollTs = t;
          // Speed may need recalculation if layout changed
          S.needsRecalc = true;
        };
        const onTouchMove = () => {
          if (!S.running) return;
          // Continuous user control
          S.userActiveUntil = now() + 500;
        };

        el.addEventListener('pointerdown', onPointerDown, { passive: true });
        el.addEventListener('pointerup', onPointerUp, { passive: true });
        el.addEventListener('pointercancel', onPointerUp, { passive: true });

        el.addEventListener('touchstart', onPointerDown, { passive: true });
        el.addEventListener('touchend', onPointerUp, { passive: true });
        el.addEventListener('touchcancel', onPointerUp, { passive: true });
        el.addEventListener('touchmove', onTouchMove, { passive: true });
        // Wheel/momentum
        el.addEventListener('wheel', onWheel, { passive: true });
        el.addEventListener('scroll', onScroll, { passive: true });
      }

      async function mountPdfVirtual(container, url) {

            <div class="p-4 text-sm text-amber-400">Hinweis: PDF konnte nicht geparst werden – Fallback-Viewer aktiv.</div>`;

          ph.style.minHeight = `${pageH}px`;

          ph.innerHTML = `<div class="text-xs text-neutral-400 mb-0.5" data-role="page-label">Seite ${i} / ${pdf.numPages}</div>
                          <div data-role="skeleton" class="w-[95%] max-w-[1400px] bg-black/60 rounded animate-pulse" style="height:${skeletonHeight}px"></div>`;
          wrap.appendChild(ph); placeholders.push(ph);

        endSpacer.style.height = `${Math.round(pageH * 0.1)}px`;

        const io = new IntersectionObserver(async (entries) => {
          for (const en of entries) {
            if (!en.isIntersecting) continue;
            const ph = en.target; io.unobserve(ph);
            const pageIndex = Number(ph.dataset.page);

            if (pageIndex === 1) {

        }, { root: container, rootMargin: "800px 0px" });

  const cleanupIO = new IntersectionObserver((entries) => {
          for (const en of entries) {

  async function renderOnePageInto(ph, pdf, i) {

          const cssHeight = Math.round(viewport.height);
          const label = ph.querySelector('[data-role="page-label"]');

          const blockHeight = cssHeight + labelAllowance;

          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.floor(cssWidth * outputScale));
          canvas.height = Math.max(1, Math.floor(cssHeight * outputScale));
          canvas.style.width = `${cssWidth}px`;
          canvas.style.height = `${cssHeight}px`;

          };

          if (typeof page.cleanup === "function") page.cleanup();

          canvas.dataset.cssHeight = String(cssHeight);
          ph.dataset.rendered = "1";
          ph.dataset.renderedHeight = String(cssHeight);
          ph.dataset.blockHeight = String(blockHeight);
          ph.style.height = "auto";
          ph.style.minHeight = `${blockHeight}px`;

          errorBox.textContent = `Fehler beim Laden von Seite ${i}`;

          if (state.viewer.autoScroll.running) {

            state.viewer.autoScroll.needsRecalc = state.viewer.autoScroll.speedPxPerSec <= 0.01;
          }
        }
      }
      async function computeFitWidthScale(page, container) {
        const unscaled = page.getViewport({ scale: 1 });
        const pad = 24;
        const containerWidth = container.clientWidth - pad;
        const maxWidth = Math.min(1400, containerWidth * 0.95);
        const scale = maxWidth / unscaled.width;
        return Math.max(0.6, Math.min(scale, 3.0));
      }

      // Eager-Render für iOS: rendere Seite 1 (und optional 2) sofort, falls noch nichts sichtbar ist

          if (!wrap) return;
          // Wenn bereits ein Canvas vorhanden ist, nichts tun
          if (wrap.querySelector('canvas')) return;

          const ph1 = wrap.querySelector('[data-page="1"]');
          if (ph1 && !ph1.dataset.rendered) {
            await renderOnePageInto(ph1, state.viewer._pdf, 1);
          }
          const ph2 = wrap.querySelector('[data-page="2"]');
          if (ph2 && !ph2.dataset.rendered) {
            // zweite Seite nur anstoßen, nicht blockieren
            renderOnePageInto(ph2, state.viewer._pdf, 2).catch(() => {});
          }
        } catch {}
      }

      // ===== Auto Scroll + UI Toggle =====
      function hasScrollableContent(el) {
        if (!el) return false;
        return (el.scrollHeight - el.clientHeight) > 12;
      }

      async function waitForScrollableContent(el, timeoutMs = 8000) {
        if (!el) return false;
        if (hasScrollableContent(el)) return true;

        const deadline = performance.now() + Math.max(500, timeoutMs);
        let rafId = null;
        let observer = null;

        return new Promise((resolve) => {
          let finished = false;
          const done = (status) => {
            if (finished) return;
            finished = true;
            if (rafId !== null) cancelAnimationFrame(rafId);
            observer?.disconnect?.();
            resolve(status);
          };

          const check = () => {
            if (!state.viewer.autoScroll.pending && !state.viewer.autoScroll.running) {
              done(false);
              return;
            }
            if (hasScrollableContent(el)) {
              done(true);
              return;
            }
            if (performance.now() >= deadline) {
              done(hasScrollableContent(el));
              return;
            }
            rafId = requestAnimationFrame(check);
          };

          if (typeof ResizeObserver === "function") {
            observer = new ResizeObserver(() => {
              if (!state.viewer.autoScroll.pending && !state.viewer.autoScroll.running) {
                done(false);
                return;
              }
              if (hasScrollableContent(el)) done(true);
            });
            observer.observe(el);
            const inner = el.firstElementChild;
            if (inner && inner instanceof HTMLElement) observer.observe(inner);
          }

          rafId = requestAnimationFrame(check);
        });
      }

      function computeSpeed() {
        const el = document.querySelector('#viewer');
        if (!el) {
          state.viewer.autoScroll.speedPxPerSec = 0;
          return;
        }
        const totalScrollable = Math.max(0, el.scrollHeight - el.clientHeight);
        const pages = Math.max(1, state.viewer.numPages || 0);
        const totalSecs = state.viewer.secsPerPage * pages;
        state.viewer.autoScroll.speedPxPerSec = totalSecs > 0 ? totalScrollable / totalSecs : 0;
      }
      async function startAutoScroll() {
        // Fallback: Standard-Scroll ohne Markierungen
        const viewerEl = document.querySelector('#viewer');
        if (!viewerEl) return;
        if (state.viewer.autoScroll.running || state.viewer.autoScroll.pending) return;

        // Scrolling SOFORT starten, ohne auf Content zu warten
        state.viewer.autoScroll.running = true;
        state.viewer.autoScroll.lastTs = performance.now();
        state.viewer.autoScroll.needsRecalc = true;
        // Akkumulator initialisieren, um Subpixel-Verluste zu vermeiden (iOS)
        state.viewer.autoScroll.pos = viewerEl.scrollTop || 0;

        // iOS Kick: minimal scrollen, damit IO-Callbacks sicher feuern
        try { viewerEl.scrollTop = Math.min(1, viewerEl.scrollHeight - viewerEl.clientHeight); } catch {}

        // Falls noch nichts gerendert ist: erste Seiten sofort rendern
        await ensureFirstPagesRendered();

        computeSpeed();
        updateStatus("Auto-Scroll: läuft");
        refreshPlayPauseUI();
        requestAnimationFrame(tickAutoScroll);
      }

      // Unified handler: activates screen-on and toggles play/pause in one action
      function togglePlayAndWake() {
        const btn = document.querySelector('#btnPlayPause');
        if (!btn || btn.disabled) return;
        btn.disabled = true;

        if (state.viewer.autoScroll.running || state.viewer.autoScroll.pending) {
          // Pause
          stopAutoScroll();
          btn.disabled = false;
          refreshPlayPauseUI();
        } else {
          // Start: ensure screen stays on (synchronously for iOS), then start scrolling
          state.viewer.wakeDesired = true;
          // Re-arm gesture listeners just in case this is the first interaction
          armWakeLockFromGestures(document);
          try { acquireWakeLockSync(); } catch {}
          startAutoScroll()
            .finally(() => {
              btn.disabled = false;
              refreshPlayPauseUI();
            });
          // Extra safety: try async acquisition shortly after to catch API availability
          setTimeout(() => { acquireWakeLockAuto(); }, 300);
          startWakeWatch();
        }
      }
      function stopAutoScroll() {
        state.viewer.autoScroll.running = false;
        state.viewer.autoScroll.pending = false;
        state.viewer.autoScroll.needsRecalc = false;
        state.viewer.autoScroll.token = null;
        updateStatus("Auto-Scroll: pausiert");
      }
      function tickAutoScroll(ts) {
        if (!state.viewer.autoScroll.running) return;
        const el = document.querySelector('#viewer');
        if (!el) { 
          stopAutoScroll(); 
          refreshPlayPauseUI(); 
          return; 
        }
        const S = state.viewer.autoScroll;
        // If the user is actively adjusting (dragging) or momentum/settling is ongoing,
        // don't override their position; just keep the loop alive and sync base.
        if (S.userAdjusting || (S.userActiveUntil && ts < S.userActiveUntil)) {
          S.pos = el.scrollTop || 0;
          S.lastTs = ts;
          requestAnimationFrame(tickAutoScroll);
          return;
        }
        
        // Geschwindigkeit neu berechnen wenn nötig (z.B. wenn Seiten nachladen)
        if (state.viewer.autoScroll.needsRecalc || state.viewer.autoScroll.speedPxPerSec <= 0.01) {
          computeSpeed();
          state.viewer.autoScroll.needsRecalc = false;
        }
        
  const dt = (ts - S.lastTs) / 1000;
  S.lastTs = ts;

  const delta = state.viewer.autoScroll.speedPxPerSec * dt;
        // Falls noch nicht scrollbar, NICHT stoppen – warten bis Content kommt
        const maxScrollTop = Math.max(0, el.scrollHeight - el.clientHeight);
        if (maxScrollTop <= 1) {
          // Kick: kleiner Scrollstoß hält die Schleife „aktiv“
          if (el.scrollTop < 1) {
            try { S.ignoreScrollUntil = performance.now() + 50; el.scrollTop = 1; } catch {}
          }
          // Nächster Frame: erneut versuchen
          state.viewer.autoScroll.needsRecalc = true;
          requestAnimationFrame(tickAutoScroll);
          return;
        }

        // Float-Akkumulator verwenden, um Subpixel-Bewegung nicht zu verlieren
  S.pos = Math.min((S.pos || el.scrollTop || 0) + delta, maxScrollTop);
  S.ignoreScrollUntil = performance.now() + 50; // ignore immediate scroll event from programmatic set
  el.scrollTop = S.pos;

        // Am Ende angekommen?
        if (el.scrollTop >= maxScrollTop - 1) {
          stopAutoScroll();
          refreshPlayPauseUI();
          updateStatus("Ende erreicht");
          return;
        }
        
        requestAnimationFrame(tickAutoScroll);
      }
      function refreshPlayPauseUI() {
        const btn = document.querySelector('#btnPlayPause');
        if (!btn) return;
        
        const isRunning = state.viewer.autoScroll.running;
        const isPending = state.viewer.autoScroll.pending;
        
        if (isPending) {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" class="animate-spin">
              <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
            </svg>
            <span>Warte…</span>
          `;
          btn.disabled = true;
        } else if (isRunning) {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
              <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
            </svg>
            <span>Pause</span>
          `;
          btn.disabled = false;
          btn.setAttribute('aria-label', 'Auto-Scroll pausieren');
        } else {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span>Start</span>
          `;
          btn.disabled = false;
          btn.setAttribute('aria-label', 'Auto-Scroll starten');
        }
      }
      
      function updateStatus(extra) {
        const s = document.querySelector('#status span');
        const p = state.viewer;
        if (!s) return;
        
        if (extra) {
          s.textContent = extra;
        } else if (p.numPages > 0) {
          s.textContent = `${p.numPages} ${p.numPages === 1 ? 'Seite' : 'Seiten'} • ${p.secsPerPage}s/Seite`;
        } else {
          s.textContent = 'Bereit';
        }
      }
      
      // ===== Fullscreen & Wake Lock =====
      async function toggleFullscreen() {
        const el = document.fullscreenElement;
        if (el) { await document.exitFullscreen(); return; }
        try { await document.documentElement.requestFullscreen(); } catch {}
      }
      async function toggleWakeLock() {
        const btn = document.querySelector('#btnWakeLock');
        try {
          if ("wakeLock" in navigator) {
            if (!state.viewer.wakeLock) {
              state.viewer.wakeLock = await navigator.wakeLock.request("screen");
              state.viewer.wakeLock.addEventListener("release", () => {
                state.viewer.wakeLock = null;
                btn.textContent = "☀︎ Screen On";
              });
              btn.textContent = "☀︎ Screen On ✓";
            } else {
              await state.viewer.wakeLock.release();
              state.viewer.wakeLock = null;
              btn.textContent = "☀︎ Screen On";
            }
            return;
          }
          // Fallback: NoSleep.js
          if (!state.viewer.noSleep) {
            await new Promise((resolve, reject) => {
              const s = document.createElement('script');
              s.src = '/vendor/nosleep.min.js';
              s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
            });
            state.viewer.noSleep = new window.NoSleep();
          }
          if (state.viewer.noSleepEnabled) {
            state.viewer.noSleep.disable();
            state.viewer.noSleepEnabled = false;
            btn.textContent = "☀︎ Screen On";
          } else {
            state.viewer.noSleep.enable(); // user gesture: this click
            state.viewer.noSleepEnabled = true;
            btn.textContent = "☀︎ Screen On ✓";
          }
        } catch (e) {
          console.warn('Wake lock failed or blocked', e);
          btn.textContent = "☀︎ Nicht unterstützt";
        }
      }
    </script>
  </body>
</html>
