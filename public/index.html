	      function computeTapZoneLayout() {
	        const pdfContainer = document.querySelector('#viewerPdfContainer');
	        const viewer = document.querySelector('#viewer');
	        if (!pdfContainer || !viewer) return { width: 0, enabled: false, bounds: null };
	        const bounds = pdfContainer.getBoundingClientRect();
	        const containerWidth = pdfContainer.clientWidth || bounds.width || 0;
	        let stageWidth = Number(state.viewer.pageStageWidth) || 0;
	        if (!stageWidth) {
	          const stage = viewer.querySelector('.viewer-page-stage');
	          if (stage instanceof HTMLElement) {
	            stageWidth = stage.getBoundingClientRect().width;
	          }
	        }
	        if (!stageWidth && containerWidth > 0) {
	          stageWidth = containerWidth * 0.78;
	        }
	        const whitespace = Math.max(0, containerWidth - stageWidth);
	        const whitespaceWidth = Math.max(0, whitespace / 2 - 12);

	        // UX: Even when zoomed (stage fills the container, whitespace ~0),
	        // keep a reliable edge zone so page turning remains fast.
	        const MIN_EDGE_PX = 96;
	        const MAX_EDGE_PX = 240;
	        const percentWidth = Math.round(containerWidth * 0.15);
	        const desired = Math.max(whitespaceWidth, percentWidth);
	        const hardMax = Math.max(0, Math.min(MAX_EDGE_PX, Math.floor(containerWidth / 2 - 16)));
	        const hardMin = Math.min(MIN_EDGE_PX, hardMax);
	        const width = hardMax > 0 ? Math.max(hardMin, Math.min(desired, hardMax)) : 0;
	        const enabled = width >= 56 && bounds.height > 0;
	        return { width, enabled, bounds };
	      }

      function hideTapZoneHints() {
        const tz = state.viewer.tapZones;
        if (tz?.hintTimer) { clearTimeout(tz.hintTimer); tz.hintTimer = null; }
        tz?.left?.classList.remove('is-visible');
        tz?.right?.classList.remove('is-visible');
      }

      function showTapZoneHints(duration = 5000) {
        const tz = state.viewer.tapZones;
        if (!tz?.enabled) return;
        if (!tz.left || !tz.right) return;
        tz.left.classList.add('is-visible');
        tz.right.classList.add('is-visible');
        if (tz.hintTimer) { clearTimeout(tz.hintTimer); }
        tz.hintTimer = window.setTimeout(() => hideTapZoneHints(), duration);
      }

      function flashTapZone(direction) {
        const tz = state.viewer.tapZones;
        if (!tz) return;
        const zone = direction === 'next' ? tz.right : tz.left;
        if (!zone) return;
        zone.classList.add('is-visible');
        zone.classList.add('is-active');
        const key = direction === 'next' ? 'right' : 'left';
        if (tz.flashTimers?.[key]) {
          clearTimeout(tz.flashTimers[key]);
        }
        tz.flashTimers[key] = window.setTimeout(() => {
          zone.classList.remove('is-active');
          if (!tz.hintTimer) {
            zone.classList.remove('is-visible');
          }
          tz.flashTimers[key] = null;
        }, 420);
      }

      function refreshTapZones() {
        const nodes = ensureTapZoneOverlay();
        if (!nodes) return;
        const layout = computeTapZoneLayout();
        const tz = state.viewer.tapZones;
        tz.width = layout.width;
        tz.enabled = layout.enabled;
        tz.bounds = layout.bounds;
        if (!nodes.left || !nodes.right) return;
        if (!layout.enabled) {
          nodes.left.style.display = 'none';
          nodes.right.style.display = 'none';
          hideTapZoneHints();
          return;
        }
        nodes.left.style.display = '';
        nodes.right.style.display = '';
        const widthPx = `${Math.round(layout.width)}px`;
        nodes.left.style.width = widthPx;
        nodes.right.style.width = widthPx;
        if (!tz.introShown) {
          showTapZoneHints();
          tz.introShown = true;
        }
      }

      function getNeighborPageTarget(delta = 1) {
        const viewer = document.querySelector('#viewer');
        if (!viewer) return null;
        
        // Einfache Logik: Scrolle um die sichtbare Höhe des Viewers
        const viewportHeight = viewer.clientHeight;
        const scrollTop = viewer.scrollTop || 0;
        const maxScroll = Math.max(0, viewer.scrollHeight - viewportHeight);
        
        // Scrolle um 75% der Viewport-Höhe (etwas Überlappung für Orientierung)
        const scrollAmount = viewportHeight * 0.75;
        
        let targetScrollTop;
        if (delta > 0) {
          // Nach unten/rechts scrollen
          targetScrollTop = scrollTop + scrollAmount;
        } else {
          // Nach oben/links scrollen
          targetScrollTop = scrollTop - scrollAmount;
        }
        
        return Math.max(0, Math.min(maxScroll, targetScrollTop));
      }

      function setupTapZones() {
        const pdfContainer = document.querySelector('#viewerPdfContainer');
        const viewer = document.querySelector('#viewer');
        if (!pdfContainer || !viewer) return;
        teardownTapZones();
        ensureTapZoneOverlay();

        const onPointerUp = (event) => {
          if (event.pointerType === 'mouse' && event.button !== 0) return;
          refreshTapZones();
          const { enabled, bounds, width } = state.viewer.tapZones;
          if (!enabled || !bounds || !width) return;
          const x = event.clientX;
          const y = event.clientY;
          if (y < bounds.top || y > bounds.bottom) return;
          let direction = null;
          if (x < bounds.left + width) direction = 'prev';
          else if (x > bounds.right - width) direction = 'next';
          if (!direction) return;
          event.preventDefault();
          hideTapZoneHints();
          flashTapZone(direction);
          if (state.viewer.autoScroll.running || state.viewer.autoScroll.pending) {
            stopAutoScroll();
            refreshPlayPauseUI();
          }
          const targetTop = getNeighborPageTarget(direction === 'next' ? 1 : -1);
          if (targetTop === null || targetTop === undefined) return;
          viewer.scrollTo({ top: targetTop, behavior: 'smooth' });
        };

        pdfContainer.addEventListener('pointerup', onPointerUp);
        state.viewer.tapZones.handlerTarget = pdfContainer;
        state.viewer.tapZones.pointerHandler = onPointerUp;

        if (typeof ResizeObserver === "function") {
          const ro = new ResizeObserver(() => refreshTapZones());
          ro.observe(pdfContainer);
          const wrap = viewer.firstElementChild;
          if (wrap) ro.observe(wrap);
          state.viewer.tapZones.resizeObserver = ro;
        }

        refreshTapZones();
        
        // Zeige Intro-Animation beim ersten Öffnen
        showTapZoneIntro();
      }
      
      function showTapZoneIntro() {
        const tz = state.viewer.tapZones;
        if (!tz?.enabled) return;
        if (!tz.left || !tz.right) return;
        
        // Füge Intro-Klasse für Animation hinzu
        tz.left.classList.add('is-intro');
        tz.right.classList.add('is-intro');
        
        // Nach Animation entfernen
        window.setTimeout(() => {
          if (tz.left) tz.left.classList.remove('is-intro');
          if (tz.right) tz.right.classList.remove('is-intro');
        }, 2500);
      }

      function isLandscapeMode() {
        if (window.matchMedia) {
          const mq = window.matchMedia('(orientation: landscape)');
          if (mq.matches) return true;
        }
        return (window.innerWidth || 0) >= (window.innerHeight || 0);
      }

      function updateDualModeAvailability() {
        const btn = document.querySelector('#btnDualPage');
        const pdfReady = Boolean(state.viewer?._pdf);
        const hasPages = (state.viewer?.numPages || state.viewer?._pdf?.numPages || 0) > 1;
        const allowed = isLandscapeMode() && hasPages;
        const enabled = pdfReady && allowed;
        if (btn) {
          btn.classList.toggle('hidden', !allowed);
          btn.disabled = !enabled;
          btn.setAttribute('aria-disabled', enabled ? 'false' : 'true');
          const label = btn.querySelector('span');
          const active = state.viewer.dualMode;
          if (label) label.textContent = active ? 'Single Page' : 'Dual Page';
          btn.title = allowed ? (active ? 'Single Page Mode' : 'Dual Page Mode') : 'Nur im Querformat verfügbar';
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        }
        if (!enabled && state.viewer.dualMode) {
          toggleDualMode(false).catch(() => {});
        }
        if (enabled && state.viewer.dualMode) {
          renderDualSpread(state.viewer.currentPage).catch(() => {});
        }
      }
      window.addEventListener('resize', () => updateDualModeAvailability(), { passive: true });
      window.addEventListener('orientationchange', () => setTimeout(updateDualModeAvailability, 120), { passive: true });

      function getCurrentPageFromScroll() {
        const viewer = document.querySelector('#viewer');
        if (!viewer) return 1;
        const nodes = Array.from(viewer.querySelectorAll('[data-page]'));
        if (!nodes.length) return 1;
        const containerTop = viewer.getBoundingClientRect().top;
        let closest = { page: 1, distance: Number.POSITIVE_INFINITY };
        for (const node of nodes) {
          const pageNum = Number(node.dataset.page);
          if (!Number.isFinite(pageNum)) continue;
          const rect = node.getBoundingClientRect();
          const distance = Math.abs(rect.top - containerTop);
          if (distance < closest.distance) {
            closest = { page: pageNum, distance };
          }
        }
        const maxPage = state.viewer.numPages || nodes.length || 1;
        const page = Math.min(Math.max(1, closest.page || 1), maxPage);
        return page % 1 === 0 ? page : Math.round(page);
      }

      function scrollToPage(pageNum, behavior = 'smooth') {
        const viewer = document.querySelector('#viewer');
        if (!viewer) return;
        const target = viewer.querySelector(`[data-page="${pageNum}"]`);
        if (!target) return;
        const top = target.offsetTop || 0;
        viewer.scrollTo({ top: Math.max(0, top - 4), behavior });
      }

      function ensureDualLayout() {
        const dual = document.querySelector('#dualViewer');
        if (!dual) return null;
        dual.classList.add('dual-viewer-ready');
        let inner = dual.querySelector('.dual-viewer-inner');
        if (!inner) {
          inner = document.createElement('div');
          inner.className = 'dual-viewer-inner';
          // Volle Höhe, zentriert, ohne Lücke
          inner.style.cssText = 'display: flex; flex-direction: row; width: 100%; height: 100%; gap: 0; padding: 0; align-items: center; justify-content: center; overflow: hidden;';
          inner.innerHTML = `
            <div class="dual-page" data-side="left" style="flex: 0 1 auto; height: 100%; display: flex; align-items: center; justify-content: flex-end; padding: 0; margin: 0; overflow: visible;">
              <div class="dual-page-stage" style="height: 100%; display: flex; justify-content: center; align-items: center; overflow: visible; margin: 0;"></div>
            </div>
            <div class="dual-page" data-side="right" style="flex: 0 1 auto; height: 100%; display: flex; align-items: center; justify-content: flex-start; padding: 0; margin: 0; overflow: visible;">
              <div class="dual-page-stage" style="height: 100%; display: flex; justify-content: center; align-items: center; overflow: visible; margin: 0;"></div>
            </div>
          `;
          dual.appendChild(inner);
        }
        // Tap flash overlays
        let flash = dual.querySelector('.dual-tap-overlay');
        if (!flash) {
          flash = document.createElement('div');
          flash.className = 'dual-tap-overlay';
          flash.innerHTML = `
            <div class="dual-tap-hint dual-tap-hint--left">
              <div class="dual-tap-button">‹</div>
            </div>
            <div class="dual-tap-hint dual-tap-hint--right">
              <div class="dual-tap-button">›</div>
            </div>
          `;
          dual.appendChild(flash);
        }
        const left = inner.querySelector('[data-side="left"]');
        const right = inner.querySelector('[data-side="right"]');
        const flashLeft = flash.querySelector('.dual-tap-hint--left');
        const flashRight = flash.querySelector('.dual-tap-hint--right');
        return { dual, inner, left, right, flashLeft, flashRight };
      }

      function clearAnnotationLayers(container) {
        if (!container) return;
        const pages = container.querySelectorAll('[data-page]');
        pages.forEach((node) => {
          const pageNum = Number(node.dataset.page);
          node.querySelectorAll('.annotation-layer, .annotation-committed').forEach((el) => el.remove());
          if (Number.isInteger(pageNum) && annotations?.onPageLayerRemoved) {
            annotations.onPageLayerRemoved(pageNum);
          }
        });
      }

      function getDualTargetSize() {
        const availableHeight = window.innerHeight;
        const gutter = 36;
        const availableWidth = Math.max(200, (window.innerWidth - gutter) / 2);
        return { 
          width: Math.max(100, availableWidth), 
          height: Math.max(100, availableHeight) 
        };
      }

      async function renderDualSlot(slot, pageNumber, pdf) {
        if (!slot) return;
        const prevPage = Number(slot.dataset.renderedPage);
        const stage = slot.querySelector('.dual-page-stage');
        if (Number.isInteger(prevPage)) {
          annotations.onPageLayerRemoved(prevPage);
        }
        if (Number.isInteger(prevPage) && prevPage !== pageNumber) {
          annotations.onPageLayerRemoved(prevPage);
        }

        if (!pageNumber || pageNumber > pdf.numPages) {
          if (stage) {
            stage.innerHTML = '<div class="dual-viewer-empty">Keine weitere Seite</div>';
          }
          if (Number.isInteger(prevPage)) {
            annotations.onPageLayerRemoved(prevPage);
          }
          slot.dataset.renderedPage = '';
          return;
        }

        if (!stage) return;
        
        const page = await pdf.getPage(pageNumber);
        const unscaled = page.getViewport({ scale: 1 });
        const { width: targetWidth, height: targetHeight } = getDualTargetSize();
        
        // Skaliere basierend auf der Höhe (volle Höhe nutzen)
        const scaleByHeight = targetHeight / unscaled.height;
        const scaleByWidth = targetWidth / unscaled.width;
        // Wähle den kleineren Scale damit die Seite in beide Dimensionen passt
        const baseScale = Math.min(scaleByHeight, scaleByWidth);
        
        const zoom = state.viewer.zoom || 1;
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);
        const renderViewport = page.getViewport({ scale: baseScale * zoom });
        
        const finalDisplayWidth = Math.round(renderViewport.width);
        const finalDisplayHeight = Math.round(renderViewport.height);

        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.floor(renderViewport.width * outputScale));
        canvas.height = Math.max(1, Math.floor(renderViewport.height * outputScale));
        canvas.style.width = `${finalDisplayWidth}px`;
        canvas.style.height = `${finalDisplayHeight}px`;
        canvas.className = 'dual-page-canvas';
        canvas.dataset.role = 'pdf-canvas';
        canvas.dataset.baseWidth = String(unscaled.width * baseScale);
        canvas.dataset.baseHeight = String(unscaled.height * baseScale);

        const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
        await page.render({
          canvasContext: ctx,
          viewport: renderViewport,
          transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null
        }).promise;

        stage.innerHTML = '';
        stage.style.display = 'flex';
        stage.style.justifyContent = 'center';
        stage.style.alignItems = 'center';
        stage.style.overflow = 'visible'; // Allow jump markers to overflow
        // Don't set minWidth/minHeight - let the stage be a flexible container
        // that centers the canvas. This prevents asymmetric shifts during zoom.
        stage.dataset.role = 'page-stage';
        
        // Create a wrapper for canvas + markers to keep markers positioned relative to canvas
        const canvasWrapper = document.createElement('div');
        canvasWrapper.className = 'dual-canvas-wrapper';
        canvasWrapper.style.position = 'relative';
        canvasWrapper.style.width = `${finalDisplayWidth}px`;
        canvasWrapper.style.height = `${finalDisplayHeight}px`;
        canvasWrapper.style.overflow = 'visible'; // Allow jump markers to overflow
        canvasWrapper.appendChild(canvas);
        stage.appendChild(canvasWrapper);

        // Remove any residual annotation layers before reattaching to avoid duplicates
        stage.querySelectorAll('.annotation-layer, .annotation-committed').forEach((el) => el.remove());

        annotations.onPageLayerRemoved(pageNumber);
        annotations.attachPageLayer({
          pageNumber,
          frame: stage,
          canvas,
          pageWidth: unscaled.width,
          pageHeight: unscaled.height,
          renderWidth: canvas.width,
          renderHeight: canvas.height,
          displayWidth: finalDisplayWidth,
          displayHeight: finalDisplayHeight
        });

        slot.dataset.renderedPage = String(pageNumber);
      }

      async function renderDualSpread(startPage) {
        const pdf = state.viewer?._pdf;
        if (!pdf || !state.viewer.dualMode) return;
        const slots = ensureDualLayout();
        if (!slots) return;

        const total = pdf.numPages || state.viewer.numPages || 1;
        const leftPage = Math.max(1, Math.min(startPage || 1, total));
        const rightPage = leftPage + 1 <= total ? leftPage + 1 : null;
        state.viewer.currentPage = leftPage;

        await Promise.all([
          renderDualSlot(slots.left, leftPage, pdf),
          renderDualSlot(slots.right, rightPage, pdf)
        ]);

        if (window.JumpMarkers?.renderAllMarkers) {
          window.JumpMarkers.renderAllMarkers();
        }
      }
      
      // Expose renderDualSpread globally for JumpMarkers integration
      window.renderDualSpread = renderDualSpread;
      
      // Listen for jump marker navigation events
      window.addEventListener('jumpmarker-navigate', async (event) => {
        const pageNumber = event.detail?.pageNumber;
        if (state.viewer.dualMode && pageNumber) {
          await renderDualSpread(pageNumber);
        }
      });

	      function teardownDualTapZones() {
	        const dual = document.querySelector('#dualViewer');
	        if (!dual || !dual.dataset.tapHandlerAttached) return;
	        if (dual._tapHandler && typeof dual._tapHandler === 'object') {
	          if (dual._tapHandler.onPointerUp) dual.removeEventListener('pointerup', dual._tapHandler.onPointerUp);
	          if (dual._tapHandler.onClick) dual.removeEventListener('click', dual._tapHandler.onClick);
	          if (dual._tapHandler.onResize) {
	            window.removeEventListener('resize', dual._tapHandler.onResize);
	            window.removeEventListener('orientationchange', dual._tapHandler.onResize);
	          }
	        } else if (typeof dual._tapHandler === 'function') {
	          dual.removeEventListener('click', dual._tapHandler);
	        }
	        delete dual._tapHandler;
	        delete dual.dataset.tapHandlerAttached;
	      }

	      function setupDualTapZones() {
	        const dual = document.querySelector('#dualViewer');
	        if (!dual || dual.dataset.tapHandlerAttached) return;
	        const computeEdgeWidth = (containerWidth) => {
	          const w = Number(containerWidth) || 0;
	          const MIN_EDGE_PX = 96;
	          const MAX_EDGE_PX = 240;
	          const percentWidth = Math.round(w * 0.15);
	          const hardMax = Math.max(0, Math.min(MAX_EDGE_PX, Math.floor(w / 2 - 16)));
	          const hardMin = Math.min(MIN_EDGE_PX, hardMax);
	          const desired = Math.max(percentWidth, hardMin);
	          return hardMax > 0 ? Math.max(hardMin, Math.min(desired, hardMax)) : 0;
	        };
	        const applyHintWidth = (edgeWidth) => {
	          const leftHint = dual.querySelector('.dual-tap-hint--left');
	          const rightHint = dual.querySelector('.dual-tap-hint--right');
	          if (!leftHint || !rightHint) return;
	          const px = `${Math.round(edgeWidth)}px`;
	          leftHint.style.flex = `0 0 ${px}`;
	          rightHint.style.flex = `0 0 ${px}`;
	          leftHint.style.maxWidth = px;
	          rightHint.style.maxWidth = px;
	          leftHint.style.minWidth = px;
	          rightHint.style.minWidth = px;
	        };

	        let edgeWidth = computeEdgeWidth(dual.clientWidth || dual.getBoundingClientRect().width);
	        applyHintWidth(edgeWidth);

	        const handleTap = (event) => {
	          if (!state.viewer.dualMode) return;
	          if (event.defaultPrevented) return;
	          // Ignore taps during/after pinch-zoom to prevent accidental page turns
	          if (state.viewer.pinchCooldownUntil && Date.now() < state.viewer.pinchCooldownUntil) return;
	          if (!edgeWidth) return;
	          const rect = dual.getBoundingClientRect();
	          const x = event.clientX;
	          const isLeftEdge = x < rect.left + edgeWidth;
	          const isRightEdge = x > rect.right - edgeWidth;
	          if (!isLeftEdge && !isRightEdge) return;
	          const isRight = isRightEdge;
	          const totalPages = state.viewer.numPages || state.viewer._pdf?.numPages || 1;
	          const currentLeft = state.viewer.currentPage;
	          
	          // Im Dual Mode: +1/-1 Seite pro Blättern (wie echtes Notenheft)
          // Rechts: Rechte Seite wird links, neue Seite rechts
          // Links: Linke Seite wird rechts, neue Seite links
          let nextPage;
          if (isRight) {
            // Nächste Seite - aber nur wenn rechte Seite nicht schon die letzte ist
            if (currentLeft + 1 >= totalPages) {
              return; // Rechte Seite ist bereits die letzte
            }
            nextPage = currentLeft + 1;
          } else {
            // Vorherige Seite - aber nur wenn wir nicht schon bei Seite 1 sind
            if (currentLeft <= 1) {
              return; // Bereits auf der ersten Seite
            }
            nextPage = currentLeft - 1;
          }
          
          if (nextPage === state.viewer.currentPage) return;
          // Visual feedback - same style as single page mode
          const flash = dual.querySelector(isRight ? '.dual-tap-hint--right' : '.dual-tap-hint--left');
          if (flash) {
            flash.classList.remove('is-active');
            flash.classList.add('is-visible');
            void flash.offsetWidth;
            flash.classList.add('is-active');
            setTimeout(() => {
              flash.classList.remove('is-active');
              flash.classList.remove('is-visible');
            }, 420);
          }
          renderDualSpread(nextPage).catch(() => {});
        };

        // Touch on iPad does not reliably generate click events inside the viewer.
        // Use pointerup for touch/pen and click fallback for mouse, with ghost-click suppression.
        let recentTouchUntil = 0;
        const onPointerUp = (event) => {
          if (!state.viewer.dualMode) return;
          if (event.pointerType === 'mouse') return;
          recentTouchUntil = Date.now() + 700;
          handleTap(event);
        };
	        const onClick = (event) => {
	          if (recentTouchUntil && Date.now() < recentTouchUntil) {
	            event.preventDefault();
	            event.stopPropagation();
	            return;
	          }
	          handleTap(event);
	        };

	        const onResize = () => {
	          if (!state.viewer.dualMode) return;
	          edgeWidth = computeEdgeWidth(dual.clientWidth || dual.getBoundingClientRect().width);
	          applyHintWidth(edgeWidth);
	        };

	        window.addEventListener('resize', onResize, { passive: true });
	        window.addEventListener('orientationchange', onResize, { passive: true });

	        dual._tapHandler = { onPointerUp, onClick, onResize };
	        dual.addEventListener('pointerup', onPointerUp);
	        dual.addEventListener('click', onClick);
	        dual.dataset.tapHandlerAttached = '1';
	        
	        // Show intro animation like single page mode
        showDualTapZoneIntro(dual);
      }
      
      function showDualTapZoneIntro(dual) {
        if (!dual) return;
        const left = dual.querySelector('.dual-tap-hint--left');
        const right = dual.querySelector('.dual-tap-hint--right');
        if (!left || !right) return;
        
        // Show hints briefly on entry
        left.classList.add('is-visible');
        right.classList.add('is-visible');
        
        setTimeout(() => {
          left.classList.remove('is-visible');
          right.classList.remove('is-visible');
        }, 2500);
      }

      async function toggleDualMode(forceEnable = null) {
        const desired = forceEnable === null ? !state.viewer.dualMode : Boolean(forceEnable);
        const viewer = document.querySelector('#viewer');
        const dual = document.querySelector('#dualViewer');
        const btn = document.querySelector('#btnDualPage');
        if (!viewer || !dual || !state.viewer._pdf) return;
        if (desired && !isLandscapeMode()) {
          updateDualModeAvailability();
          return;
        }

        if (desired) {
          stopAutoScroll();
          teardownTapZones();
          clearAnnotationLayers(viewer);
          state.viewer.currentPage = getCurrentPageFromScroll();
          state.viewer.dualMode = true;
          
          // Lade Dual Mode Zoom
          const dualZoom = loadStoredZoom(true);
          state.viewer.zoom = dualZoom;
          updateZoomUI();
          
          viewer.classList.add('hidden');
          viewer.setAttribute('aria-hidden', 'true');
          viewer.style.display = 'none';
          dual.classList.remove('hidden');
          dual.style.display = 'flex';
          dual.setAttribute('aria-hidden', 'false');
          // Verhindere Scrolling im Dual-Mode
          document.body.style.overflow = 'hidden';
          document.documentElement.style.overflow = 'hidden';
          // Header verstecken für volle Höhe (Controls bleiben für Interaktion)
          const header = document.querySelector('#mainHeader');
          const spacer = document.querySelector('#headerSpacer');
          if (header) header.style.display = 'none';
          if (spacer) spacer.style.display = 'none';
          // Play-Button im Dual-Mode verstecken
          controlsEl.classList.add('dual-mode-active');
          await renderDualSpread(state.viewer.currentPage);
          setupDualTapZones();
        } else {
          clearAnnotationLayers(dual);
          state.viewer.dualMode = false;
          
          // Lade Single Mode Zoom
          const singleZoom = loadStoredZoom(false);
          state.viewer.zoom = singleZoom;
          updateZoomUI();
          
          dual.classList.add('hidden');
          dual.style.display = 'none';
          dual.setAttribute('aria-hidden', 'true');
          viewer.classList.remove('hidden');
          viewer.style.display = '';
          viewer.setAttribute('aria-hidden', 'false');
          // Scrolling wieder erlauben
          document.body.style.overflow = '';
          document.documentElement.style.overflow = '';
          // Header wieder anzeigen
          const header = document.querySelector('#mainHeader');
          const spacer = document.querySelector('#headerSpacer');
          if (header) header.style.display = '';
          if (spacer) spacer.style.display = '';
          // Play-Button wieder anzeigen
          controlsEl.classList.remove('dual-mode-active');
          teardownDualTapZones();
          
          // WICHTIG: Komplettes Re-Rendering für saubere Darstellung
          // Reset alle Seiten-Rendering State und lade PDF neu
          if (state.viewer.url) {
            await mountPdfVirtual(viewer, state.viewer.url);
            if (state.viewer.abortRender) {
              state.viewer.abortRender = false;
              return;
            }
            // Nach dem Re-Mount zur aktuellen Seite scrollen
            setTimeout(() => {
              scrollToPage(state.viewer.currentPage, 'auto');
              setupTapZones();
              // Sprungmarken nach Seitenwechsel rendern
              if (window.JumpMarkers?.renderAllMarkers) {
                window.JumpMarkers.renderAllMarkers();
              }
            }, 100);
          } else {
            scrollToPage(state.viewer.currentPage, 'auto');
            setupTapZones();

      async function renderOnePageInto(ph, pdf, i) {

          stage.style.width = `${scaledWidth}px`;
          stage.style.minWidth = `${scaledWidth}px`;
          stage.style.maxWidth = 'none';
          stage.style.height = `${scaledHeight}px`;
          stage.style.margin = '0 auto';
          stage.dataset.baseWidth = String(baseWidth);
          stage.dataset.baseHeight = String(baseHeight);
          stage.dataset.scaledWidth = String(scaledWidth);
          stage.dataset.scaledHeight = String(scaledHeight);

            stage.style.minWidth = '';
            stage.style.maxWidth = '1400px';
          }
          stage.style.height = '320px';
          stage.style.transform = 'none';
          stage.style.transformOrigin = 'top center';
          stage.style.margin = '0 auto';
          stage.dataset.scaledWidth = stageWidth > 0 ? String(stageWidth) : stage.dataset.scaledWidth || '';

        let rafId = null;
        let observer = null;

        return new Promise((resolve) => {
          let finished = false;
          const done = (status) => {
            if (finished) return;
            finished = true;
            if (rafId !== null) cancelAnimationFrame(rafId);
            observer?.disconnect?.();
            resolve(status);
          };

          const check = () => {
            if (!state.viewer.autoScroll.pending && !state.viewer.autoScroll.running) {
              done(false);
              return;
            }
            if (hasScrollableContent(el)) {
              done(true);
              return;
            }
            if (performance.now() >= deadline) {
              done(hasScrollableContent(el));
              return;

            rafId = requestAnimationFrame(check);

            observer = new ResizeObserver(() => {
              if (!state.viewer.autoScroll.pending && !state.viewer.autoScroll.running) {
                done(false);
                return;
              }

        const delta = S.speedPxPerSec * dt;
        // Falls noch nicht scrollbar, NICHT stoppen – warten bis Content kommt
        const maxScrollTop = Math.max(0, el.scrollHeight - el.clientHeight);
        if (maxScrollTop <= 1) {
          // Kick: kleiner Scrollstoß hält die Schleife „aktiv“
          if (el.scrollTop < 1) {
            try { S.ignoreScrollUntil = performance.now() + 50; el.scrollTop = 1; } catch {}
          }
          // Nächster Frame: erneut versuchen
          S.needsRecalc = true;
          S.rafId = requestAnimationFrame(tickAutoScroll);
          return;
        }

        // Float-Akkumulator verwenden, um Subpixel-Bewegung nicht zu verlieren
        S.pos = Math.min((S.pos || el.scrollTop || 0) + delta, maxScrollTop);
        S.ignoreScrollUntil = performance.now() + 50; // ignore immediate scroll event from programmatic set
        el.scrollTop = S.pos;
        if (!S.running) {
          S.rafId = null;
          return;
        }

        // Am Ende angekommen?
        if (el.scrollTop >= maxScrollTop - 1) {
          stopAutoScroll();
          refreshPlayPauseUI();
          updateStatus("Ende erreicht");
          return;
        }
        
        S.rafId = requestAnimationFrame(tickAutoScroll);
      }
      function refreshPlayPauseUI() {
        const btn = document.querySelector('#btnPlayPause');
        if (!btn) return;
        if (state.viewer.dualMode) {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span>Dual Mode</span>
          `;
          btn.disabled = true;
          btn.setAttribute('aria-label', 'Im Dual-Page-Modus deaktiviert');
          return;
        }
        
        const isRunning = state.viewer.autoScroll.running;
        const isPending = state.viewer.autoScroll.pending;
        
        if (isPending) {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" class="animate-spin">
              <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
            </svg>
            <span>Warte…</span>
          `;
          btn.disabled = true;
        } else if (isRunning) {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
              <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
            </svg>
            <span>Pause</span>
          `;
          btn.disabled = false;
          btn.setAttribute('aria-label', 'Auto-Scroll pausieren');
        } else {
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span>Start</span>
          `;
          btn.disabled = false;
          btn.setAttribute('aria-label', 'Auto-Scroll starten');
        }
      }
      
      // ===== Toast Notification System =====
      function showToast(message, duration = 2000) {
        if (!message) return;
        
        const container = document.getElementById('toastContainer');
        if (!container) return;
        
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        container.appendChild(toast);
        
        // Auto-remove after duration
        setTimeout(() => {
          toast.classList.add('toast-out');
          setTimeout(() => {
            if (toast.parentElement) {
              toast.remove();
            }
          }, 250);
        }, duration);
      }
      
      function updateStatus(extra) {
        // Status updates now use toasts instead of static display
        if (extra) {
          showToast(extra, 1800);
        }
      }
      
      // ===== Document Sharing Functionality =====
      async function openShareDialog(item) {
        try {
          // Get current share info
          const response = await fetch(`/api/share/info?name=${encodeURIComponent(item.name)}`, {
            credentials: 'include'
          });
          
          if (!response.ok) {
            showToast('Fehler beim Laden der Freigabe-Informationen', 3000);
            return;
          }
          
          const shareInfo = await response.json();
          
          // Get list of all users
          const usersResp = await fetch('/api/users/list', {
            credentials: 'include'
          });
          
          const usersData = await usersResp.json();
          const allUsers = usersData.users || [];
          
          // Build user list with checkboxes
          const sharedWithIds = new Set(shareInfo.sharedWith.map(u => u.userId));
          const userCheckboxes = allUsers.map(user => {
            const checked = sharedWithIds.has(user.id);
            const checkId = `share-user-${user.id}`;
            const statusBadge = checked 
              ? '<span class="share-status-badge">Aktuell geteilt</span>' 
              : '';
            return `
              <div class="share-user-item ${checked ? 'is-shared' : ''}">
                <input type="checkbox" 
                       id="${checkId}"
                       class="share-user-checkbox" 
                       data-user-id="${user.id}" 
                       ${checked ? 'checked' : ''}>
                <label for="${checkId}" class="share-user-label">
                  <div class="share-user-info">
                    <div class="share-user-email">${escapeHtml(user.email)}</div>
                    <div class="share-user-id">ID: ${user.id.slice(0, 8)}...</div>
                  </div>
                  ${statusBadge}
                </label>
              </div>
            `;
          }).join('');
          
          // Create share modal
          const backdrop = document.createElement('div');
          backdrop.className = 'modal-backdrop';
          backdrop.innerHTML = `
            <div class="share-dialog-container">
              <button class="share-dialog-close" aria-label="Schließen" title="Schließen (ESC)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
              <div class="share-dialog-header">
                <div class="share-dialog-title">
                  ${SVG_SHARE}
                  <span>Dokument teilen</span>
                </div>
                <div class="share-dialog-subtitle">
                  ${escapeHtml(item.displayName || item.name)}
                </div>
              </div>
              
              <div class="share-dialog-body">
                ${userCheckboxes.length > 0 ? userCheckboxes : `
                  <div class="share-no-users">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 0 auto 16px; opacity: 0.3;">
                      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                      <circle cx="9" cy="7" r="4"></circle>
                      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <div style="font-size: 15px; font-weight: 600; color: #d1d5db; margin-bottom: 6px;">Keine Benutzer vorhanden</div>
                    <div style="font-size: 13px; color: #9ca3af;">Es gibt aktuell keine anderen Benutzer zum Teilen</div>
                  </div>
                `}
              </div>
              
              <div class="share-dialog-footer">
                <button id="cancelShare" class="btn btn-secondary">
                  Abbrechen
                </button>
                <button id="confirmShare" class="btn btn-primary is-ready" ${userCheckboxes.length === 0 ? 'disabled' : ''}>
                  Freigeben
                </button>
              </div>
            </div>
          `;
          
          document.body.appendChild(backdrop);
          
          // Handle cancel and close
          const closeBtn = backdrop.querySelector('.share-dialog-close');
          const cancelBtn = backdrop.querySelector('#cancelShare');
          const confirmBtn = backdrop.querySelector('#confirmShare');
          
          const closeDialog = () => {
            backdrop.classList.add('fade-out');
            setTimeout(() => backdrop.remove(), 200);
          };
          
          closeBtn.addEventListener('click', closeDialog);
          cancelBtn.addEventListener('click', closeDialog);
          
          // Handle backdrop click to close
          backdrop.addEventListener('click', (e) => {
            if (e.target === backdrop) {
              closeDialog();
            }
          });
          
          // Handle ESC key
          const handleEscape = (e) => {
            if (e.key === 'Escape') {
              closeDialog();
              document.removeEventListener('keydown', handleEscape);
            }
          };
          document.addEventListener('keydown', handleEscape);
          
          // Handle confirm
          confirmBtn.addEventListener('click', async () => {
            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Teile...';
            
            try {
              // Get all checked user IDs
              const checkedBoxes = backdrop.querySelectorAll('.share-user-checkbox:checked');
              const selectedUserIds = Array.from(checkedBoxes).map(cb => cb.dataset.userId);
              
              // Get previously shared user IDs
              const previouslySharedIds = Array.from(sharedWithIds);
              
              // Determine users to share with (newly selected)
              const toShare = selectedUserIds.filter(id => !sharedWithIds.has(id));
              
              // Determine users to unshare (previously shared but now unchecked)
              const toUnshare = previouslySharedIds.filter(id => !selectedUserIds.includes(id));
              
              // Share with new users
              if (toShare.length > 0) {
                const headers = { 'Content-Type': 'application/json' };
                const csrfToken = sessionStorage.getItem('csrfToken');
                if (csrfToken) {
                  headers["X-CSRF-Token"] = csrfToken;
                }
                const shareResp = await fetch('/api/share', {
                  method: 'POST',
                  credentials: 'include',
                  headers,
                  body: JSON.stringify({
                    fileName: item.name,
                    userIds: toShare
                  })
                });
                
                if (!shareResp.ok) {
                  const errorData = await shareResp.json().catch(() => ({}));
                  throw new Error(errorData.error || 'Fehler beim Teilen');
                }
              }
              
              // Unshare from users
              if (toUnshare.length > 0) {
                const headers = { 'Content-Type': 'application/json' };
                const csrfToken = sessionStorage.getItem('csrfToken');
                if (csrfToken) {
                  headers["X-CSRF-Token"] = csrfToken;
                }
                const unshareResp = await fetch('/api/share', {
                  method: 'DELETE',
                  credentials: 'include',
                  headers,
                  body: JSON.stringify({
                    fileName: item.name,
                    userIds: toUnshare
                  })
                });
                
                if (!unshareResp.ok) {
                  const errorData = await unshareResp.json().catch(() => ({}));
                  throw new Error(errorData.error || 'Fehler beim Aufheben der Freigabe');
                }
              }
              
              closeDialog();
              document.removeEventListener('keydown', handleEscape);
              showToast(`Freigabe aktualisiert: ${selectedUserIds.length} Benutzer`, 3000);
              
              // Refresh library to show updated share status
              setTimeout(() => renderLibrary(), 300);
              
            } catch (error) {
              console.error('Share failed:', error);
              closeDialog();
              document.removeEventListener('keydown', handleEscape);
              showToast(error.message || 'Fehler beim Teilen', 4000);
            }
          });
          
        } catch (error) {
          console.error('Open share dialog failed:', error);
          showToast('Fehler beim Öffnen des Dialogs', 3000);
        }
      }

      // ===== PDF Delete Functionality =====

          <div class="glass-panel p-6 max-w-md w-full animate-fade-in" style="animation: slideUp 0.3s ease-out;">

      // Check authentication and show action buttons based on access rights
      async function checkAuthAndShowActions() {
        try {
          const response = await fetch('/api/auth/session', {
            credentials: 'include',
            cache: 'no-store'
          });
          
          if (!response.ok) return;
          
          const data = await response.json();
          if (!data || !data.ok || !data.user) return;
          
          const isAdmin = data.user.role === 'admin';
          
          // Collect all document names for batch request (OPTIMIZED: single API call instead of N)
          const items = state.library.items;
          if (items.length === 0) return;
          
          const fileNames = items.map(item => item.name);
          
          // Fetch share info for all documents in one batch request
          let shareInfoMap = {};
          try {
            const batchResp = await fetch('/api/share/info/batch', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ fileNames })
            });
            
            if (!batchResp.ok) {
              console.error('Batch share info request failed:', batchResp.status);
              return;
            }
            
            const batchData = await batchResp.json();
            shareInfoMap = batchData.results || {};
          } catch (err) {
            console.error('Failed to fetch batch share info:', err);
            return;
          }
          
          // Apply share info to UI elements
          for (const item of items) {
            try {
              const shareInfo = shareInfoMap[item.name];
              if (!shareInfo || shareInfo.error) continue;
              
              const accessRole = shareInfo.accessRole;
              
              // Find buttons for this item
              const itemEl = document.querySelector(`[data-item-name="${cssEscape(item.name)}"]`);
              if (!itemEl) continue;
              itemEl.dataset.accessRole = accessRole || '';
              itemEl.dataset.canShare = 'false';
              itemEl.dataset.canDelete = 'false';
              itemEl.dataset.canRemoveShared = 'false';
              itemEl.dataset.ownerEmail = '';
              
              const shareBtn = itemEl.querySelector('.share-pdf');
              const removeBtn = itemEl.querySelector('.remove-shared');
              const deleteBtn = itemEl.querySelector('.delete-pdf');
              const sharedBadge = itemEl.querySelector('.badge-shared');
              const sharedBadgeRow = itemEl.querySelector('.badge-shared-row');
              
              // Show appropriate buttons based on access role
              if (accessRole === 'owner') {
                // Owner can share and delete (if admin)
                if (shareBtn) shareBtn.style.display = 'inline-flex';
                if (deleteBtn && isAdmin) deleteBtn.style.display = 'inline-flex';
                if (removeBtn) removeBtn.style.display = 'none';
                if (sharedBadge) sharedBadge.style.display = 'none';
                if (sharedBadgeRow) sharedBadgeRow.style.display = 'none';
                itemEl.dataset.canShare = 'true';
                itemEl.dataset.canDelete = isAdmin ? 'true' : 'false';
              } else if (accessRole === 'shared') {
                // Shared users can only remove from themselves
                if (removeBtn) removeBtn.style.display = 'inline-flex';
                if (shareBtn) shareBtn.style.display = 'none';
                if (deleteBtn) deleteBtn.style.display = 'none';
                
                // Show shared badge (both grid and list view) and store owner email
                if (shareInfo.sharedBy) {
                  const ownerEmail = shareInfo.sharedBy.email;
                  if (sharedBadge) {
                    sharedBadge.style.display = 'flex';
                    sharedBadge.dataset.ownerEmail = ownerEmail;
                  }
                  if (sharedBadgeRow) {
                    sharedBadgeRow.style.display = 'flex';
                    sharedBadgeRow.dataset.ownerEmail = ownerEmail;
                  }
                  itemEl.dataset.ownerEmail = ownerEmail || '';
                }
                itemEl.dataset.canRemoveShared = 'true';
              }
              
            } catch (err) {
              console.error('Failed to apply share info for', item.name, err);
            }
          }
          
        } catch (error) {
          console.error('Auth check failed:', error);
        }
      }
      
      // Call auth check after library is loaded
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(checkAuthAndShowActions, 500);
      });
      
      // ===== Fullscreen & Wake Lock =====
      async function toggleFullscreen() {
        const el = document.fullscreenElement;
        if (el) { await document.exitFullscreen(); return; }
        try { await document.documentElement.requestFullscreen(); } catch {}
      }
      async function toggleWakeLock() {
        const btn = document.querySelector('#btnWakeLock');
        try {
          if ("wakeLock" in navigator) {
            if (!state.viewer.wakeLock) {
              state.viewer.wakeLock = await navigator.wakeLock.request("screen");
              state.viewer.wakeLock.addEventListener("release", () => {
                state.viewer.wakeLock = null;
                btn.textContent = "☀︎ Screen On";
              });
              btn.textContent = "☀︎ Screen On ✓";
            } else {
              await state.viewer.wakeLock.release();
              state.viewer.wakeLock = null;
              btn.textContent = "☀︎ Screen On";
            }
            return;
          }
          // Fallback: NoSleep.js
          if (!state.viewer.noSleep) {
            await new Promise((resolve, reject) => {
              const s = document.createElement('script');
              s.src = '/vendor/nosleep.min.js';
              s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
            });
            state.viewer.noSleep = new window.NoSleep();
          }
          if (state.viewer.noSleepEnabled) {
            state.viewer.noSleep.disable();
            state.viewer.noSleepEnabled = false;
            btn.textContent = "☀︎ Screen On";
          } else {
            state.viewer.noSleep.enable(); // user gesture: this click
            state.viewer.noSleepEnabled = true;
            btn.textContent = "☀︎ Screen On ✓";
          }
        } catch (e) {
          console.warn('Wake lock failed or blocked', e);
          btn.textContent = "☀︎ Nicht unterstützt";
        }
      }

      // ===== Page View Tracking =====
      async function trackPageView(pageType) {
        try {
          const response = await fetch('/api/stats/pageview', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ pageType })
          });
          if (!response.ok) {
            console.warn('Failed to track page view:', response.status);
          }
        } catch (error) {
          console.warn('Error tracking page view:', error);
        }
      }

      // Track index page view on load
      window.addEventListener('load', () => {
        trackPageView('index');
      });
