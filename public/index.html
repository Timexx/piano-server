    <script>
      const scheduleControlBarLayout = (() => {
        let raf = null;
        return () => {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = null;
            try {
              syncControlBarLayout();
            } catch (err) {
              console.warn('Control layout sync failed', err);
            }
          });
        };
      })();

      function getSafeAreaBottom() {
        const raw = getComputedStyle(document.documentElement).getPropertyValue('--sab');
        const parsed = parseInt(raw, 10);
        return Number.isFinite(parsed) ? parsed : 0;
      }

	      function getViewportBottomGap() {
	        try {
	          const vv = window.visualViewport;
	          if (!vv) return 0;
	          const gap = window.innerHeight - (vv.height + vv.offsetTop);
	          return Math.max(0, Math.round(gap));
	        } catch {
	          return 0;
	        }
	      }

	      // Touch -> click fallback for iPad/iOS: use pointerup(touch) + click(mouse/keyboard)
	      function bindTouchAwareClick(el, handler) {
	        if (!el || typeof handler !== 'function') return;
	        const boundKey = 'touchAwareClickBound';
	        if (el.dataset && el.dataset[boundKey] === '1') return;
	        if (el.dataset) el.dataset[boundKey] = '1';

	        let lastTouchTs = 0;
	        el.addEventListener('pointerup', (event) => {
	          if (event.pointerType !== 'touch') return;
	          lastTouchTs = Date.now();
	          handler(event);
	        }, { passive: false });
	        el.addEventListener('click', (event) => {
	          if (lastTouchTs && Date.now() - lastTouchTs < 700) {
	            event.preventDefault();
	            event.stopPropagation();
	            return;
	          }
	          handler(event);
	        });
	      }

	      function measureExpandedHeight() {
	        const controls = document.getElementById('controls');
	        const controlsInner = document.getElementById('controlsInner');
	        if (!controls || !controlsInner) return lastExpandedControlsHeight || 200;

        // If already expanded and visible, read directly
        if (!controls.classList.contains('controls-minimized') && !controls.classList.contains('hidden')) {
          const rect = controlsInner.getBoundingClientRect();
          const h = Math.round(rect.height || controlsInner.scrollHeight || 0);
          if (h > 0) lastExpandedControlsHeight = h;
          return lastExpandedControlsHeight || 200;
        }

        // Otherwise measure with a hidden flip to expanded
        const wasHidden = controls.classList.contains('hidden');
        const prevVisibility = controls.style.visibility;
        const prevPointer = controls.style.pointerEvents;

        controls.style.visibility = 'hidden';
        controls.style.pointerEvents = 'none';
        if (wasHidden) controls.classList.remove('hidden');
        controls.classList.remove('controls-minimized');

        const rect = controlsInner.getBoundingClientRect();
        const h = Math.round(rect.height || controlsInner.scrollHeight || 0);

        // Restore
        controls.classList.add('controls-minimized');
        if (wasHidden) controls.classList.add('hidden');
        controls.style.visibility = prevVisibility;
        controls.style.pointerEvents = prevPointer;

        if (h > 0) lastExpandedControlsHeight = h;
        return lastExpandedControlsHeight || 200;
      }

      let lastExpandedControlsHeight = 160;

      function updateExpandedHeightIfVisible() {
        const controls = document.getElementById('controls');
        if (controls && !controls.classList.contains('controls-minimized')) {
          measureExpandedHeight();
        }
      }

      function syncControlBarLayout() {
        const viewportGap = getViewportBottomGap();
        document.documentElement.style.setProperty('--viewport-bottom-gap', `${viewportGap}px`);

        const controls = document.getElementById('controls');
        const controlsInner = document.getElementById('controlsInner');
        if (!controls || !controlsInner) return;

        const safeAreaBottom = getSafeAreaBottom();
        const minimizedHeight = Math.round(controlsInner.getBoundingClientRect().height || 0) || 56;
        const expandedHeight = measureExpandedHeight();

        const visibleHeight = Math.max(320, (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0);

        const baseLift = 64; // fixed lift above the visible bottom edge
        const baseOffset = Math.max(baseLift, safeAreaBottom + viewportGap + baseLift);

        const expandedOffset = baseOffset;
        let minimizedOffset = Math.max(baseOffset, safeAreaBottom + 56, minimizedHeight + safeAreaBottom + 16);

        const padding = Math.max(
          expandedHeight + expandedOffset + 48,
          minimizedHeight + minimizedOffset + 48,
          280
        );

        document.documentElement.style.setProperty('--controls-height', `${expandedHeight}px`);
        document.documentElement.style.setProperty('--controls-offset', `${padding}px`);
        document.documentElement.style.setProperty('--controls-bottom-expanded', `${expandedOffset}px`);
        document.documentElement.style.setProperty('--controls-bottom-min', `${minimizedOffset}px`);
        const viewer = document.getElementById('viewer');
        if (viewer) {
          viewer.style.paddingBottom = `var(--controls-offset)`;
        }
      }

      window.syncControlBarLayout = syncControlBarLayout;
      window.addEventListener('resize', scheduleControlBarLayout);
      window.addEventListener('orientationchange', () => {
        updateExpandedHeightIfVisible();
        setTimeout(scheduleControlBarLayout, 120);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleControlBarLayout, { passive: true });
        window.visualViewport.addEventListener('scroll', scheduleControlBarLayout, { passive: true });
      }
      scheduleControlBarLayout();

      // Control-Bar Toggle - einfach die Klasse umschalten
      function initControlsToggle() {
        const controls = document.getElementById('controls');
        const controlsInner = document.getElementById('controlsInner');
        
        console.log('🎛️ initControlsToggle called');
        console.log('controls:', controls, 'classes:', controls?.className);
        console.log('controlsInner:', controlsInner);
        
        if (!controls || !controlsInner) {
          console.error('⚠️ controls or controlsInner not found');
          return;
        }

        const resyncLayout = () => scheduleControlBarLayout();
        // Seed accurate measurements immediately
        resyncLayout();

        if (controls.dataset.toggleReady === '1') {
          resyncLayout();
          return;
        }
        controls.dataset.toggleReady = '1';
        
        // Direktes Debuggen: klickbar machen
        console.log('⚙️ Setting up click handlers...');
        
	        // Expand Button im minimierten Zustand
	        const btnExpandMinimized = document.getElementById('btnExpandMinimized');
	        if (btnExpandMinimized) {
	          bindTouchAwareClick(btnExpandMinimized, (e) => {
	            const hasMinimized = controls.classList.contains('controls-minimized');
	            if (hasMinimized) {
	              e.preventDefault();
	              e.stopPropagation();
	              console.log('📘 Expand button clicked - OPENING');
	              controls.classList.remove('controls-minimized');
	              updateExpandedHeightIfVisible();
	              resyncLayout();
	            }
	          });
	          console.log('✅ Click handler registered on btnExpandMinimized');
	        }

	        // Zurück Button im minimierten Zustand
	        const btnBackMinimized = document.getElementById('btnBackMinimized');
	        if (btnBackMinimized) {
	          bindTouchAwareClick(btnBackMinimized, (e) => {
	            e.preventDefault();
	            e.stopPropagation();
	            console.log('📘 Back button clicked - navigating back');
	            // Prefer shared viewer-back logic (works across devices / base paths)
	            if (typeof window.navigateBackFromViewer === 'function') {
	              Promise.resolve(window.navigateBackFromViewer()).catch((err) => {
                console.warn('Back navigation failed', err);
              });
              return;
            }
            // Fallback: trigger the same action as the main back button
            const mainBackBtn = document.querySelector('#btnBack');
            if (mainBackBtn) {
              if (typeof mainBackBtn.click === 'function') mainBackBtn.click();
              else if (typeof mainBackBtn.onclick === 'function') mainBackBtn.onclick();
	            }
	          });
	          console.log('✅ Click handler registered on btnBackMinimized');
	        }

	        // Close Button im expandierten Zustand
	        const btnCloseExpanded = document.getElementById('btnCloseExpanded');
	        if (btnCloseExpanded) {
	          bindTouchAwareClick(btnCloseExpanded, (e) => {
	            e.preventDefault();
	            e.stopPropagation();
	            console.log('📘 Close button clicked - CLOSING');
	            controls.classList.add('controls-minimized');
	            updateExpandedHeightIfVisible();
            resyncLayout();
          });
          console.log('✅ Click handler registered on btnCloseExpanded');
        }
        
	        // Close via Close-Button (legacy)
	        const closeBtn = document.getElementById('btnControlsClose');
	        if (closeBtn) {
	          bindTouchAwareClick(closeBtn, (e) => {
	            e.stopPropagation();
	            controls.classList.add('controls-minimized');
	            updateExpandedHeightIfVisible();
	            resyncLayout();
	          });
        }
        
        // Schließen beim Klick außerhalb
        document.addEventListener('click', (e) => {
          if (controls.classList.contains('controls-minimized')) return;
          
          // UX: Don't auto-close if annotation mode is active
          if (window.annotations && typeof window.annotations.isActive === 'function' && window.annotations.isActive()) {
            return;
          }

          if (!controlsInner.contains(e.target)) {
            controls.classList.add('controls-minimized');
            resyncLayout();
          }
        });
        
        // Schließen beim Scrollen
        const viewer = document.getElementById('viewer');
        if (viewer) {
          viewer.addEventListener('scroll', () => {
            if (!controls.classList.contains('controls-minimized')) {
              // UX: Don't auto-close if annotation mode is active
              if (window.annotations && typeof window.annotations.isActive === 'function' && window.annotations.isActive()) {
                return;
              }
              controls.classList.add('controls-minimized');
              resyncLayout();
            }
          }, { passive: true });
        }
        
        if (typeof MutationObserver === 'function') {
          const mo = new MutationObserver(() => {
            updateExpandedHeightIfVisible();
            resyncLayout();
          });
          mo.observe(controls, { attributes: true, attributeFilter: ['class'] });
        }

        if (typeof ResizeObserver === 'function') {
          const ro = new ResizeObserver(() => {
            updateExpandedHeightIfVisible();
            resyncLayout();
          });
          ro.observe(controlsInner);
        }

        console.log('🎛️ initControlsToggle setup complete');
        resyncLayout();
      }
      
      // Initialisiere nach DOM-Load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initControlsToggle);
      } else {
        initControlsToggle();
      }
      
      // Auch nach Navigation/Viewer-Load erneut initialisieren
      window.initControlsToggle = initControlsToggle;
    </script>

      // --- Memory Management ---
      function checkMemoryPressure() {
        const now = Date.now();
        if (now - state.memory.lastCheck < state.memory.checkInterval) return;
        state.memory.lastCheck = now;
        
        try {
          // Use performance.memory if available (Chrome/Edge)
          if (performance.memory) {
            const { usedJSHeapSize, totalJSHeapSize } = performance.memory;
            const memoryUsage = usedJSHeapSize / totalJSHeapSize;
            state.memory.isLowMemory = memoryUsage > 0.8; // 80% threshold
            
            if (state.memory.isLowMemory) {
              console.warn('High memory usage detected:', Math.round(memoryUsage * 100) + '%');
              aggressiveCleanup();
            }
          }
        } catch (e) {
          // Fallback: assume low memory on iPad/mobile after extended use
          const isTouch = 'ontouchstart' in window;
          if (isTouch && state.thumbs.cache.size > 20) {
            state.memory.isLowMemory = true;
            aggressiveCleanup();
          }
        }
      }
      
      function aggressiveCleanup() {
        console.log('Performing aggressive memory cleanup...');
        
        // Clear offscreen canvases in viewer
        const container = document.querySelector('#viewer');
        if (container) {
          const canvases = container.querySelectorAll('canvas');
          canvases.forEach((canvas, index) => {
            const rect = canvas.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const isVisible = rect.bottom > containerRect.top && rect.top < containerRect.bottom;
            
            // Keep only visible canvases and a few around them
            if (!isVisible && index > 5) {
              const ctx = canvas.getContext('2d');
              if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
              canvas.width = canvas.height = 0;
              canvas.remove();
            }
          });
        }
        
        // Force garbage collection if available
        if (window.gc) {
          try { window.gc(); } catch (e) {}
        }
      }

          rootEl.removeEventListener?.('touchstart', once);

      async function acquireWakeLockAuto() {
        // Prefer Screen Wake Lock API
        try {
          if ('wakeLock' in navigator) {
            if (!state.viewer.wakeLock) {
              state.viewer.wakeLock = await navigator.wakeLock.request('screen');
              state.viewer.wakeLock.addEventListener?.('release', () => {
                state.viewer.wakeLock = null;
                setWakeBtn(false);
                // Do NOT try to re-acquire automatically - needs user gesture
              });
            }
            if (state.viewer.wakeDesired) setWakeBtn(true);
            return true;
          }
        } catch (e) {
          // Silently fail - WakeLock permission not granted or not supported
          // This is expected behavior and not an error
        }
        // Fallback: NoSleep.js (must be created from a user gesture on iOS)
        try {
          if (!state.viewer.noSleep && window.NoSleep) {
            state.viewer.noSleep = new window.NoSleep();
          }
          if (state.viewer.noSleep && !state.viewer.noSleepEnabled) {
            state.viewer.noSleep.enable(); // may throw if not from gesture on iOS
            state.viewer.noSleepEnabled = true;
            if (state.viewer.wakeDesired) setWakeBtn(true);
            return true;
          }
        } catch (e) {
          // Silently fail - needs user gesture on iOS/iPad
        }
        return false;

      function acquireWakeLockSync() {

        try {
          if (!state.viewer.noSleep && window.NoSleep) {
            state.viewer.noSleep = new window.NoSleep();
          }
          if (state.viewer.noSleep && !state.viewer.noSleepEnabled) {

            state.viewer.noSleepEnabled = true;
            if (state.viewer.wakeDesired) setWakeBtn(true);
          }
        } catch (e) {
          // Silently fail - needs user gesture on iOS/iPad
        }
        // Wake Lock API async im Hintergrund
        if ('wakeLock' in navigator && !state.viewer.wakeLock) {
          navigator.wakeLock.request('screen').then(lock => {
            state.viewer.wakeLock = lock;
            lock.addEventListener?.('release', () => {
              state.viewer.wakeLock = null;
              setWakeBtn(false);
              if (document.body.classList.contains('in-viewer')) {
                acquireWakeLockAuto();

      async function refreshPdfPages(fileName, pages, { bustToken } = {}) {
        if (!Array.isArray(pages) || !pages.length) return;
        if (!state.viewer._pdf) {
          console.warn('PDF not loaded, cannot refresh pages');
          return;
        }

        const container = document.querySelector('#viewer');
        if (!container) return;

        // Update URL with new cache token
        if (bustToken) {
          state.viewer.cacheToken = bustToken;
          const urlBase = `/sheets/${encodePathSegments(fileName)}`;
          state.viewer.url = `${urlBase}?v=${bustToken}`;
        }

        // Reload the PDF document with new cache token to get updated annotations
        const pdf = await pdfjsLib.getDocument(state.viewer.url).promise;
        state.viewer._pdf = pdf;

        // Reload annotation data from server for affected pages
        const { pages: annotationSnapshots, historyAvailable } = await getAnnotationsFromBackend(fileName);
        if (annotations?.setServerUndoAvailable) {
          annotations.setServerUndoAvailable(historyAvailable);
        }
        const snapshotMap = new Map();
        if (Array.isArray(annotationSnapshots)) {
          annotationSnapshots.forEach((snapshot) => {
            if (snapshot && Number.isInteger(snapshot.pageNumber)) {
              snapshotMap.set(snapshot.pageNumber, snapshot);
            }
          });
        }

        // Find and re-render each affected page
        for (const pageNum of pages) {
          const pageWrapper = container.querySelector(`.viewer-page[data-page="${pageNum}"]`);
          if (!pageWrapper) continue;

          // Update the annotation committed image for this page
          const snapshot = snapshotMap.get(pageNum);
          if (typeof annotations?.primeCommittedImage === 'function') {
            // If there's a snapshot, load it; otherwise pass null to clear
            annotations.primeCommittedImage(pageNum, snapshot || { pageNumber: pageNum, dataUrl: null });
          }

          // Mark for re-render by removing rendered flag
          delete pageWrapper.dataset.rendered;
          
          // Re-render the page
          await renderOnePageInto(pageWrapper, pdf, pageNum);
        }

        // Refresh annotation overlays
        annotations.refreshOverlayActivation();
      }

      // This dramatically improves initial page load by only loading visible thumbnails
      let lazyThumbObserver = null;
      const pendingThumbs = new Set();
      
      function initLazyThumbObserver() {
        if (lazyThumbObserver) return;
        
        // Use IntersectionObserver for efficient lazy loading
        lazyThumbObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              const src = img.dataset.src;
              if (src && !img.src) {
                img.src = src;
                img.classList.add('thumb-loading');
                img.onload = () => {
                  img.classList.remove('thumb-loading', 'lazy-thumb');
                  img.classList.add('thumb-loaded');
                };
                img.onerror = () => {
                  img.classList.remove('thumb-loading');
                  img.style.display = 'none';
                  if (img.nextElementSibling) img.nextElementSibling.style.display = 'grid';
                };
              }
              lazyThumbObserver.unobserve(img);
              pendingThumbs.delete(img);
            }
          });
        }, {
          root: null,
          rootMargin: '200px', // Load thumbnails 200px before they enter viewport
          threshold: 0.01
        });
      }
      
      function registerLazyThumb(img) {
        if (!lazyThumbObserver) initLazyThumbObserver();
        pendingThumbs.add(img);
        lazyThumbObserver.observe(img);

      }

      function adjustScrollForZoom(prevZoom, newZoom, focal) {
        if (!focal || state.viewer.dualMode) return;
        const viewerEl = document.querySelector('#viewer');
        if (!viewerEl) return;
        if (!Number.isFinite(prevZoom) || prevZoom <= 0) return;
        if (!Number.isFinite(newZoom) || newZoom <= 0) return;
        const ratio = newZoom / prevZoom;
        if (!Number.isFinite(ratio) || ratio <= 0) return;

        const { contentY, viewportOffsetY, contentX, viewportOffsetX } = focal;

        if (Number.isFinite(contentY) && Number.isFinite(viewportOffsetY)) {
          const targetScrollY = contentY * ratio - viewportOffsetY;
          const maxScrollY = Math.max(0, viewerEl.scrollHeight - viewerEl.clientHeight);
          viewerEl.scrollTop = Math.max(0, Math.min(maxScrollY, targetScrollY));
        }

        if (Number.isFinite(contentX) && Number.isFinite(viewportOffsetX)) {
          const targetScrollX = contentX * ratio - viewportOffsetX;
          const maxScrollX = Math.max(0, viewerEl.scrollWidth - viewerEl.clientWidth);
          viewerEl.scrollLeft = Math.max(0, Math.min(maxScrollX, targetScrollX));
        }
      }

      function applyZoomPreviewLayout(zoom) {
        if (!document.body.classList.contains('in-viewer')) return;
        
        const containers = [];
        const viewer = document.querySelector('#viewer');
        if (viewer) containers.push(viewer);
        const dualViewer = document.querySelector('#dualViewer');
        if (dualViewer && !dualViewer.classList.contains('hidden')) containers.push(dualViewer);

        let lastBlockHeight = null;
        let lastScaledHeight = null;
        let lastStageWidth = null;
        let lastLabelAllowance = null;

        for (const container of containers) {
          const placeholders = Array.from(container.querySelectorAll('[data-page], .dual-page'));
          for (const ph of placeholders) {
            if (!(ph instanceof HTMLElement)) continue;
            // In dual mode we don't have data-rendered=1 but we have the canvas
            const isDual = ph.classList.contains('dual-page');
            if (!isDual && ph.dataset.rendered !== '1') continue;

            const stage = ph.querySelector('[data-role="page-stage"]');
            if (!stage) continue;
            const canvas = stage.querySelector('canvas[data-role="pdf-canvas"]');
            if (!canvas) continue;
            const baseWidth = Number(canvas.dataset.baseWidth);
            const baseHeight = Number(canvas.dataset.baseHeight);
            if (!Number.isFinite(baseWidth) || !Number.isFinite(baseHeight)) continue;

            const scaledWidth = Math.max(1, Math.round(baseWidth * zoom));
            const scaledHeight = Math.max(1, Math.round(baseHeight * zoom));

            if (isDual) {
              // For dual mode: only resize the canvas, leave the stage as a flexible centering container
              // This prevents asymmetric shifts since the stage stays at 100% height with align-items: center
              canvas.style.width = `${scaledWidth}px`;
              canvas.style.height = `${scaledHeight}px`;

              const overlayLayers = stage.querySelectorAll('canvas.annotation-layer, canvas.annotation-committed');
              overlayLayers.forEach((layer) => {
                layer.style.width = `${scaledWidth}px`;
                layer.style.height = `${scaledHeight}px`;
              });
              continue;
            }

            // Single page mode: resize stage and canvas
            stage.style.width = `${scaledWidth}px`;
            stage.style.minWidth = `${scaledWidth}px`;
            stage.style.maxWidth = 'none';
            stage.style.height = `${scaledHeight}px`;
            canvas.style.width = `${scaledWidth}px`;
            canvas.style.height = `${scaledHeight}px`;

            const overlayLayers = stage.querySelectorAll('canvas.annotation-layer, canvas.annotation-committed');
            overlayLayers.forEach((layer) => {
              layer.style.width = `${scaledWidth}px`;
              layer.style.height = `${scaledHeight}px`;
            });

            if (isDual) continue; // Dual mode doesn't use block heights/labels

            const labelAllowance = Number(stage.dataset.labelAllowance) || Number(ph.dataset.labelAllowance) || (() => {
              const label = ph.querySelector('[data-role="page-label"]');
              return label ? label.offsetHeight + 16 : 48;
            })();

            const blockHeight = scaledHeight + labelAllowance;
            ph.style.height = `${blockHeight}px`;
            ph.style.minHeight = `${blockHeight}px`;
            ph.dataset.blockHeight = String(blockHeight);
            ph.dataset.renderedHeight = String(blockHeight);
            ph.dataset.labelAllowance = String(labelAllowance);

            lastBlockHeight = blockHeight;
            lastScaledHeight = scaledHeight;
            lastStageWidth = scaledWidth;
            lastLabelAllowance = labelAllowance;
          }
        }

        if (Number.isFinite(lastBlockHeight)) {
          state.viewer.pageBlockHeight = lastBlockHeight;
        }
        if (Number.isFinite(lastScaledHeight)) {
          state.viewer.pageScaledHeight = lastScaledHeight;
        }
        if (Number.isFinite(lastStageWidth)) {
          state.viewer.pageStageWidth = lastStageWidth;
        }
        if (Number.isFinite(lastLabelAllowance)) {
          state.viewer.pageLabelAllowance = lastLabelAllowance;
        }

        state.viewer.autoScroll.needsRecalc = true;
      }

      function getViewerCenterFocal() {
        const isDual = state.viewer.dualMode;
        const viewerEl = document.querySelector(isDual ? '#dualViewer' : '#viewer');
        if (!viewerEl) return null;
        const offsetX = viewerEl.clientWidth / 2;
        const offsetY = viewerEl.clientHeight / 2;
        return {
          contentX: (isDual ? 0 : viewerEl.scrollLeft) + offsetX,
          viewportOffsetX: offsetX,
          contentY: (isDual ? 0 : viewerEl.scrollTop) + offsetY,
          viewportOffsetY: offsetY
        };
      }

      function setViewerZoom(value, { immediate = false, preview = false, focal = null, force = false } = {}) {
        const clamped = clampZoom(value);
        const focalPoint = focal || getViewerCenterFocal();

        if (preview) {
          const prevPreview = state.viewer.zoomPreview ?? state.viewer.zoom;
          const delta = Math.abs(clamped - prevPreview);
          if (delta < 0.001) return;
          if (state.viewer.zoomTimer) {
            clearTimeout(state.viewer.zoomTimer);
            state.viewer.zoomTimer = null;
          }
          state.viewer.zoomPreview = clamped;
          updateZoomUI();
          applyZoomPreviewLayout(clamped);
          adjustScrollForZoom(prevPreview, clamped, focalPoint);
          return;
        }

        const prevZoom = state.viewer.zoom;
        const changed = Math.abs(clamped - prevZoom) >= 0.001;

        if (state.viewer.zoomTimer) {
          clearTimeout(state.viewer.zoomTimer);
          state.viewer.zoomTimer = null;
        }

        if (changed) {
          state.viewer.zoom = clamped;
          state.viewer.zoomPreview = null;
          state.viewer.zoomVersion += 1;
          persistZoom(clamped, state.viewer.dualMode);
        } else if (!force) {
          state.viewer.zoomPreview = null;
          updateZoomUI();
          return;
        } else {
          state.viewer.zoomPreview = null;
        }

        updateZoomUI();
        adjustScrollForZoom(prevZoom, clamped, focalPoint);

        const viewerActive = document.body.classList.contains('in-viewer') && state.viewer._pdf;
        if (!viewerActive) return;
        if (state.viewer.dualMode) {
          renderDualSpread(state.viewer.currentPage).catch(() => {});
        }

        if (immediate || force) {
          applyZoomToPages().catch((err) => console.warn('Zoom update failed', err));
          return;
        }

        if (changed) {
          state.viewer.zoomTimer = window.setTimeout(() => {
            state.viewer.zoomTimer = null;
            applyZoomToPages().catch((err) => console.warn('Zoom update failed', err));
          }, 160);
        }
      }

      async function applyZoomToPages() {
        if (!document.body.classList.contains('in-viewer')) return;
        const pdf = state.viewer._pdf;
        if (!pdf) return;
        const container = document.querySelector('#viewer');
        if (!container) return;

        const version = state.viewer.zoomVersion;
        const placeholders = Array.from(container.querySelectorAll('[data-page]'));
        let didRender = false;
        for (const ph of placeholders) {
          if (!ph || !ph.isConnected) continue;
          const pageNumber = Number(ph.dataset.page);
          if (!Number.isFinite(pageNumber)) continue;
          if (!ph.dataset.rendered && !ph.querySelector('canvas')) continue;
          await renderOnePageInto(ph, pdf, pageNumber);
          didRender = true;
          if (version !== state.viewer.zoomVersion) return;
        }

        if (!didRender && Number.isFinite(state.viewer.pageBlockHeight)) {
          adjustPlaceholderHeights(state.viewer.pageBlockHeight);
        }

        if (window.JumpMarkers?.renderAllMarkers) {
          window.JumpMarkers.renderAllMarkers();
        }

        state.viewer.autoScroll.needsRecalc = true;
        computeSpeed();
        if (state.viewer.autoScroll.running) {
          state.viewer.autoScroll.lastTs = performance.now();
        }
        refreshTapZones();
        updateStatus();
        state.viewer.committedZoom = state.viewer.zoom;
        state.viewer.zoomPreview = null;
      }

      function adjustPlaceholderHeights(blockHeight) {
        if (!Number.isFinite(blockHeight) || blockHeight <= 0) return;
        state.viewer.pageBlockHeight = blockHeight;
        const container = document.querySelector('#viewer');
        if (!container) return;
  const stageWidthHint = Number(state.viewer.pageStageWidth);
  const labelAllowanceHint = Number(state.viewer.pageLabelAllowance);
        const nodes = container.querySelectorAll('[data-page]');
        nodes.forEach((node) => {
          if (!(node instanceof HTMLElement)) return;
          if (node.dataset.rendered) return;
          node.style.height = `${blockHeight}px`;
          node.style.minHeight = `${blockHeight}px`;
          const stage = node.querySelector('[data-role="page-stage"]');
          if (stage instanceof HTMLElement) {
            const label = node.querySelector('[data-role="page-label"]');
            const measuredAllowance = label instanceof HTMLElement ? label.offsetHeight + 16 : 48;
            const stageDatasetWidth = Number(stage?.dataset?.scaledWidth);
            const stageDatasetAllowance = Number(stage?.dataset?.labelAllowance);
            const labelAllowance = Number.isFinite(labelAllowanceHint) && labelAllowanceHint > 0
              ? labelAllowanceHint
              : (Number.isFinite(stageDatasetAllowance) && stageDatasetAllowance > 0 ? stageDatasetAllowance : measuredAllowance);
            const stageHeight = Math.max(Math.round(blockHeight - labelAllowance), 120);
            const stageWidth = Number.isFinite(stageWidthHint) && stageWidthHint > 0
              ? stageWidthHint
              : (Number.isFinite(stageDatasetWidth) && stageDatasetWidth > 0 ? stageDatasetWidth : null);
            const skeleton = stage.querySelector('[data-role="skeleton"]');
            if (skeleton instanceof HTMLElement) {
              skeleton.style.height = `${stageHeight}px`;
            }
            if (stageWidth) {
              stage.style.width = `${stageWidth}px`;
              stage.style.minWidth = `${stageWidth}px`;
              stage.style.maxWidth = 'none';
            } else {
              stage.style.width = '100%';
              stage.style.minWidth = '';
              stage.style.maxWidth = '1400px';
            }
            stage.style.height = `${stageHeight}px`;
            stage.style.transform = 'none';
            stage.style.transformOrigin = 'top center';
            stage.style.margin = '0 auto';
            stage.dataset.scaledWidth = stageWidth ? String(stageWidth) : stage.dataset.scaledWidth || '';
            stage.dataset.scaledHeight = String(stageHeight);
            stage.dataset.labelAllowance = String(labelAllowance);
            delete stage.dataset.zoom;
          }
        });
        const spacer = container.querySelector('[data-role="end-spacer"]');
        if (spacer instanceof HTMLElement) {
          spacer.style.height = `${Math.round(blockHeight * 0.1)}px`;
        }
      }

      // ===== Router =====
      const params = new URLSearchParams(location.search);
      const currentFile = params.get("file"); // encoded

      // Update favorites chip counter live
      function updateFavoritesChipCounter() {
        const favChip = document.getElementById('filterFavChip');

        const favCount = state.library.favorites?.size || 0;
        const favActive = state.library.onlyFavorites;

        if (favChip) {
          // Find or create badge span
          let badge = favChip.querySelector('span:last-child');
          const isBadge = badge && badge.textContent.match(/^\d+$/);

          if (favCount > 0) {
            const badgeClasses = `inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1.5 rounded-full text-xs font-bold ${favActive ? 'bg-amber-400/90 text-neutral-900' : 'bg-amber-500/20 text-amber-300'}`;
            if (isBadge) {
              // Update existing badge
              badge.textContent = favCount;
              badge.className = badgeClasses;
            } else {
              // Create new badge
              const newBadge = document.createElement('span');
              newBadge.className = badgeClasses;
              newBadge.textContent = favCount;
              favChip.appendChild(newBadge);
            }
          } else if (isBadge) {
            // Remove badge if count is 0
            badge.remove();
          }
        }

        const sidebarFav = document.querySelector('.sidebar-quick-btn[data-quick="favorites"]');
        if (sidebarFav) {
          sidebarFav.classList.toggle('is-active', state.library.onlyFavorites);
          let sidebarPill = sidebarFav.querySelector('.sidebar-pill');
          if (favCount > 0) {
            if (!sidebarPill) {
              sidebarPill = document.createElement('span');
              sidebarPill.className = 'sidebar-pill';
              sidebarFav.appendChild(sidebarPill);
            }
            sidebarPill.textContent = String(favCount);
          } else if (sidebarPill) {
            sidebarPill.remove();
          }
        }

        if (document.querySelector('#libraryQuickAccess')) {
          renderLibraryQuickAccess();
        }
      }

      function applyAccentTheme(catId, { ignorePlaylistAccent = false } = {}) {
        let accent = null;
        let accentSource = null;

        if (!ignorePlaylistAccent && playlist?.mode && playlist.accentColor) {
          accent = playlist.accentColor;
          accentSource = { id: playlist.activeId, icon: playlist.icon, type: 'playlist' };
        } else if (catId) {
          const targetCat = categoryHelpers.byId(catId);
          if (targetCat) {
            accent = targetCat.color || null;
            accentSource = { id: targetCat.id, icon: targetCat.icon, type: 'category' };
          }
        }

        const effective = accent || "#6366F1";
        state.ui.accentColor = effective;
        state.ui.accentSource = accentSource;

          document.body.appendChild(backdrop);

          const submitBtn = backdrop.querySelector('button[type="submit"]'); // Button is now in footer, not in form
          const cancelBtn = backdrop.querySelector('[data-role="cancel"]');
          const manageBtn = form.querySelector('[data-role="manage"]');

          let modalClosed = false;
          const handleKeyDown = (ev) => {

              ev.preventDefault();

          function closeModal() {
            if (modalClosed) return;
            modalClosed = true;
            document.removeEventListener('keydown', handleKeyDown);

            state.ui.uploadOpen = false;

            uploadBtn?.focus();

          const closeBtn = backdrop.querySelector('.share-dialog-close');
          closeBtn?.addEventListener('click', closeModal);
          cancelBtn?.addEventListener('click', closeModal);

          if (manageBtn) {
            manageBtn.addEventListener('click', () => {
              closeModal();
              openCategoryManager({ focusMode: 'create' });

          }

          backdrop.querySelectorAll('[data-cat]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-cat');
              if (!id) return;
              if (selected.has(id)) {
                selected.delete(id);
                btn.classList.remove('is-selected');
                btn.querySelector('[data-role="indicator"]')?.classList.add('hidden');
              } else {
                selected.add(id);
                btn.classList.add('is-selected');
                btn.querySelector('[data-role="indicator"]')?.classList.remove('hidden');
              }
            });
          });

          fileInput.addEventListener('change', () => {
            const name = fileInput.files?.[0]?.name;
            fileLabel.textContent = name ? `Ausgewählt: ${name}` : `${limitMb} MB max • Nur PDF`;
            statusEl.textContent = '';
          });

          form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            statusEl.textContent = '';
            const file = fileInput.files?.[0];
            if (!file) {
              statusEl.textContent = 'Bitte wähle eine PDF-Datei aus.';
              return;
            }
            const lowerName = (file.name || '').toLowerCase();
            const declaredType = (file.type || '').toLowerCase();
            if (!declaredType.includes('pdf') && !lowerName.endsWith('.pdf')) {
              statusEl.textContent = 'Nur PDF-Dateien können hochgeladen werden.';
              return;
            }
            const secsRaw = (secsInput.value || '').trim();
            let secsValue = null;
            if (secsRaw) {
              const parsed = Number(secsRaw);
              if (!Number.isFinite(parsed) || parsed < 5 || parsed > 600) {
                statusEl.textContent = 'Sekunden pro Seite müssen zwischen 5 und 600 liegen.';
                return;
              }
              secsValue = Math.round(parsed);
            }
            const metaPayload = {
              originalName: file.name || 'upload.pdf',
              categories: Array.from(selected),
              favorite: favoriteInput.checked
            };
            if (secsValue !== null) metaPayload.secsPerPage = secsValue;

            submitBtn.disabled = true;
            cancelBtn.disabled = true;
            submitBtn.textContent = 'Lade hoch…';

            try {
              // Avoid setting Content-Type explicitly to let the browser choose;
              // some iOS browsers throw TypeError on manual Content-Type with Blob bodies.
              const resolvedName = (file.name && file.name.toLowerCase().endsWith('.pdf')) ? file.name : (file.name || 'upload.pdf');
              const headers = new Headers({
                'X-Upload-Name': encodeURIComponent(resolvedName),
                'X-Upload-Meta': encodeURIComponent(JSON.stringify(metaPayload)),
                'Accept': 'application/json'
              });

              const res = await fetch('/api/upload', { method: 'POST', headers, body: file });
              let payload;
              try {
                payload = await res.json();
              } catch {
                payload = {};
              }
              if (!res.ok || !payload.ok) {
                const err = new Error(payload.error || 'Upload fehlgeschlagen.');
                err.status = res.status;
                throw err;
              }
              state.ui.uploadSupported = true;
              if (Array.isArray(payload.favorites)) {
                state.library.favorites = new Set(payload.favorites);
              }
              if (payload.maxUploadBytes) {
                const mb = Math.round(Number(payload.maxUploadBytes) / 1024 / 1024);
                if (Number.isFinite(mb) && mb > 0) {
                  state.ui.uploadLimitMb = mb;
                }
              }
              closeModal();
              await loadPage();
              renderLibrary();

              if (error?.name === 'TypeError' && !error.status) {
                error.message = 'Netzwerkfehler beim Upload (TypeError). Bitte erneut versuchen.';
              }
              if (error.status === 503) {
                state.ui.uploadSupported = false;
                statusEl.textContent = error.message || 'Uploads sind aktuell nicht verfügbar.';
                setTimeout(() => {
                  closeModal();

              } else if (error.status === 415) {
                statusEl.textContent = 'Nur PDF-Dateien erlaubt.';

      // ===== API (Library) =====
      async function fetchPage({ q = "", sort, order, page, pageSize, fav = false, category = null }) {
        const qs = new URLSearchParams({ q, sort, order, page: String(page), pageSize: String(pageSize) });
        if (fav) qs.set("fav", "1");
        if (category) qs.set("category", category);
        const res = await fetch(`/api/sheets?${qs.toString()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("API error");
        return res.json();
      }
      async function loadPage() {
        const L = state.library;
        const snapshotParams = {
          q: L.q,
          sort: L.sort,
          order: L.order,
          page: L.page,
          pageSize: L.pageSize,
          fav: L.onlyFavorites,
          category: L.categoryFilter
        };
        let data;
        try {
          data = await fetchPage({
            q: L.q,
            sort: L.sort,
            order: L.order,
            page: L.page,
            pageSize: L.pageSize,
            fav: L.onlyFavorites,
            category: L.categoryFilter
          });
          saveLibrarySnapshot({ params: snapshotParams, payload: data });
        } catch (err) {
          console.warn('Bibliothek konnte nicht geladen werden, verwende lokale Daten', err);
          const snapshot = loadLibrarySnapshot();
          if (snapshot && snapshot.payload && snapshotParamsEqual(snapshot.params, snapshotParams)) {
            data = snapshot.payload;
            showToast('Letzte Bibliothek wird angezeigt.', 3200);
          } else {
            throw err;
          }
        }

        const payload = data || {};
        L.items = Array.isArray(payload.items) ? payload.items : [];
        L.total = Number(payload.total) || 0;
        if (Array.isArray(payload.categories)) {
          state.categories = payload.categories;
          // Preserve special filter 'none' (uncategorized)
          if (L.categoryFilter && L.categoryFilter !== 'none' && !state.categories.some(cat => cat.id === L.categoryFilter)) {
            L.categoryFilter = null;
            localStorage.removeItem("libCategory");
          }
        }
        L.loadedOnce = true;
      }

      async function applyCategoryFilter(catId) {
        state.library.categoryFilter = catId || null;
        // Do not accent the synthetic 'none' filter
        applyAccentTheme(state.library.categoryFilter === 'none' ? null : state.library.categoryFilter);
        if (state.library.categoryFilter) localStorage.setItem("libCategory", state.library.categoryFilter);
        else localStorage.removeItem("libCategory");
        state.library.page = 1;
        appEl.innerHTML = '<div class="flex items-center justify-center h-[60vh] text-neutral-400">Lade…</div>';
        await loadPage();
        renderLibrary();
      }

      function setNavMode(mode) {
        const nextPlaylistMode = mode === 'playlist';
        playlist.mode = nextPlaylistMode;
        localStorage.setItem('playlistMode', nextPlaylistMode ? '1' : '0');
        localStorage.setItem('libNavMode', nextPlaylistMode ? 'playlist' : 'library');
      }

      function getNavMode() {
        return playlist.mode ? 'playlist' : 'library';
      }

      const LIB_RECENT_KEY = 'libRecent';
      const LIB_RECENT_MAX = 12;

      function formatLibraryDisplayName(name) {
        const base = name ? name.split('/').pop() : '';
        return base ? base.replace(/\.pdf$/i, '') : '';
      }

      function loadRecentList() {
        try {
          const raw = localStorage.getItem(LIB_RECENT_KEY);
          const list = raw ? JSON.parse(raw) : [];
          return Array.isArray(list) ? list.filter(Boolean) : [];
        } catch {
          return [];
        }
      }

      function saveRecentList(list) {
        try {
          localStorage.setItem(LIB_RECENT_KEY, JSON.stringify(list));
        } catch {}
      }

      function trackRecentOpen(fileName) {
        if (!fileName) return;
        const list = loadRecentList();
        const next = [fileName, ...list.filter((name) => name !== fileName)].slice(0, LIB_RECENT_MAX);
        saveRecentList(next);
        if (document.querySelector('#libraryQuickAccess')) {
          renderLibraryQuickAccess();
        }
      }

      function removeRecentEntry(fileName) {
        if (!fileName) return;
        const list = loadRecentList();
        const next = list.filter((name) => name !== fileName);
        if (next.length !== list.length) {
          saveRecentList(next);
          if (document.querySelector('#libraryQuickAccess')) {
            renderLibraryQuickAccess();
          }
        }
      }

      function purgeLocalMissingDocument(fileName) {
        if (!fileName) return;
        removeRecentEntry(fileName);
        if (state.library?.favorites?.has?.(fileName)) {
          state.library.favorites.delete(fileName);
        }
        if (Array.isArray(state.library.items)) {
          const before = state.library.items.length;
          state.library.items = state.library.items.filter((item) => item?.name !== fileName);
          if (state.library.total > 0 && state.library.items.length !== before) {
            state.library.total = Math.max(0, state.library.total - 1);
          }
        }
      }

      async function cleanupMissingDocument(fileName, statusCode) {
        if (!fileName) return;
        purgeLocalMissingDocument(fileName);
        try {
          const headers = { "Content-Type": "application/json" };
          const csrfToken = sessionStorage.getItem('csrfToken');
          if (csrfToken) headers["X-CSRF-Token"] = csrfToken;
          await fetch("/api/sheets/cleanup-missing", {
            method: "POST",
            headers,
            body: JSON.stringify({ name: fileName, status: statusCode })
          });
        } catch (err) {
          console.warn("cleanupMissingDocument failed", err);
        }
        try {
          await fetchPlaylists();
        } catch {}
        try {
          await loadPage();
        } catch {}
      }

      function extractHttpStatus(err) {
        if (!err) return null;
        if (Number.isFinite(err.status)) return Number(err.status);
        if (Number.isFinite(err?.response?.status)) return Number(err.response.status);
        const msg = String(err.message || "");
        const match = msg.match(/\b(403|404)\b/);
        if (match) return Number(match[1]);
        return null;
      }

      function getQuickAccessItemMeta(fileName) {
        const item = Array.isArray(state.library.items)
          ? state.library.items.find((entry) => entry?.name === fileName)
          : null;
        const displayName = item?.displayName || formatLibraryDisplayName(fileName);
        const thumbPath = fileName
          ? `/thumbnails/${encodePathSegments(fileName.replace(/\.pdf$/i, '.jpg'))}`
          : '';
        return {
          name: fileName,
          displayName,
          thumbnail: item?.thumbnail || thumbPath
        };
      }

      function buildQuickAccessCards(list, { emptyText }) {
        if (!list.length) {
          return `<div class="quick-access-empty">${emptyText}</div>`;
        }
        return list.map((meta) => `
          <button class="quick-access-card" type="button" data-open-file="${escapeHtml(meta.name)}">
            <div class="quick-access-thumb">
              <img src="${escapeHtml(meta.thumbnail)}" alt="${escapeHtml(meta.displayName)}" loading="lazy" onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');">
              <div class="quick-access-fallback hidden">PDF</div>
            </div>
            <div class="quick-access-title" title="${escapeHtml(meta.displayName)}">${escapeHtml(meta.displayName)}</div>
          </button>
        `).join('');
      }

      function renderLibraryQuickAccess() {
        const host = document.querySelector('#libraryQuickAccess');
        if (!host) return;
        const recentList = loadRecentList().slice(0, 8).map(getQuickAccessItemMeta);
        const recentCollapsed = state.library.quickAccess?.recentCollapsed === true;
        host.innerHTML = `
          <div class="quick-access-row" data-quick-section="recent" data-collapsed="${recentCollapsed ? 'true' : 'false'}">
            <div class="quick-access-header">
              <h3>Zuletzt gespielt</h3>
              <div class="quick-access-actions">
                <button type="button" class="quick-access-toggle" data-action="toggle-recent">${recentCollapsed ? 'Einblenden' : 'Ausblenden'}</button>
                ${recentCollapsed ? '' : '<button type="button" class="quick-access-link" data-quick-target="recent">Ansehen</button>'}
              </div>
            </div>
            <div class="quick-access-body">
              <div class="quick-access-scroller">
                ${buildQuickAccessCards(recentList, { emptyText: 'Noch keine zuletzt gespielten Titel.' })}
              </div>
            </div>
          </div>
        `;

        const toggleBtn = host.querySelector('[data-action="toggle-recent"]');
        if (toggleBtn) {
          toggleBtn.addEventListener('click', async () => {
            const next = !(state.library.quickAccess?.recentCollapsed === true);
            if (!state.library.quickAccess) state.library.quickAccess = { recentCollapsed: false };
            state.library.quickAccess.recentCollapsed = next;
            renderLibraryQuickAccess();
            const res = await setLibraryPrefs({ quickAccess: { recentCollapsed: next } });
            if (!res) {
              showToast('Einstellung konnte nicht gespeichert werden', 2200);
            }
          });
        }

        host.querySelectorAll('[data-open-file]').forEach((btn) => {
          const fileName = btn.getAttribute('data-open-file');
          let moved = false;
          let startX = 0;
          let startY = 0;
          btn.addEventListener('pointerdown', (ev) => {
            if (ev.pointerType !== 'touch') return;
            moved = false;
            startX = ev.clientX;
            startY = ev.clientY;
          });
          btn.addEventListener('pointermove', (ev) => {
            if (ev.pointerType !== 'touch') return;
            const dx = Math.abs(ev.clientX - startX);
            const dy = Math.abs(ev.clientY - startY);
            if (dx + dy > 10) moved = true;
          });
          btn.addEventListener('click', (ev) => {
            if (moved) {
              moved = false;
              return;
            }
            ev.preventDefault();
            if (!fileName) return;
            acquireWakeLockSync();
            history.replaceState(null, '', `/?file=${encodeURIComponent(fileName)}`);
            renderViewer(fileName);
          });
        });

        host.querySelectorAll('[data-quick-target]').forEach((btn) => {
          const target = btn.getAttribute('data-quick-target');
          btn.addEventListener('click', () => {
            const section = host.querySelector(`[data-quick-section="${target}"]`);
            section?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        });
      }

      function renderLibrarySidebar({ activeMode }) {
        const navLibraryActive = activeMode === 'library';

      function getLibraryScrollSignature() {
        const L = state.library;
        return JSON.stringify({
          q: L.q || "",

          category: L.categoryFilter,
          onlyFavorites: L.onlyFavorites,
          pageSize: L.pageSize,
          page: L.page
        });
      }

      function restoreLibraryScroll(scroller, signature) {
        if (!scroller || !signature) return;
        const raw = localStorage.getItem(`libScroll:${signature}`);
        const value = Number(raw);
        if (Number.isFinite(value)) {
          scroller.scrollTop = value;
        }
      }

      function attachLibraryScrollPersistence(scroller, signature, { restore = false } = {}) {
        if (!scroller || !signature) return;
        if (state.library.scrollPersist?.scroller && state.library.scrollPersist?.handler) {
          state.library.scrollPersist.scroller.removeEventListener('scroll', state.library.scrollPersist.handler);
        }
        if (restore) restoreLibraryScroll(scroller, signature);
        let timer = null;
        const handler = () => {
          if (timer) return;
          timer = window.setTimeout(() => {
            timer = null;
            try {
              localStorage.setItem(`libScroll:${signature}`, String(scroller.scrollTop || 0));
            } catch {}
          }, 180);
        };
        scroller.addEventListener('scroll', handler, { passive: true });
        state.library.scrollPersist = { scroller, handler };
      }

        releaseWakeLock();
        stopWakeWatch();
        stopAutoScroll();
        try { teardownTapZones(); } catch {}
        if (state.viewer.layoutObserver) {
          state.viewer.layoutObserver.disconnect();

  // order icon already reflects state (rotation)

        // Clear button functionality

              requestAnimationFrame(() => {
                const wrapAfter = document.querySelector('#virtualWrap');

                  mountVirtualizer(true);
                  const scroller = document.querySelector('#libraryScroll');

                updatePaginationDisplay();

          searchTimer = setTimeout(async () => {
            state.library.q = searchValue;
            localStorage.setItem('libQuery', searchValue);
            state.library.page = 1;
            
            // Store current focus state
            const hadFocus = document.activeElement === searchEl;
            const cursorPos = searchEl.selectionStart;
            
            // Show loading in results area only, not entire page
            const wrap = document.querySelector('#virtualWrap');
            if (wrap) {
              wrap.innerHTML = '<div class="flex items-center justify-center h-full text-neutral-400">Lade…</div>';
            }
            
            await loadPage();
            
            // Only update the virtualizer, not the entire library UI
            requestAnimationFrame(() => {

              if (wrapAfter) {
                mountVirtualizer(true);
                const scroller = document.querySelector('#libraryScroll');
                attachLibraryScrollPersistence(scroller, getLibraryScrollSignature(), { restore: true });
              }
              
              updatePaginationDisplay();
              
              // Restore focus if it was in the search field
              if (hadFocus) {
                const searchElAfter = document.querySelector('#search');
                if (searchElAfter && searchElAfter !== searchEl) {
                  searchElAfter.focus();
                  if (typeof cursorPos === 'number') {
                    searchElAfter.setSelectionRange(cursorPos, cursorPos);

                }
              }
            });
          }, 300);
        });

        // ===== SORT DROPDOWN - OPTIMIZED BEHAVIOR =====
        if (sortMenuBtn && sortMenu) {
          let isMenuOpen = false;
          
          // Get the wrapper for better positioning
          const wrapper = sortMenuBtn.closest('.sort-dropdown-wrapper');
          const menuPlaceholder = document.createElement('span');
          menuPlaceholder.style.display = 'none';
          menuPlaceholder.className = 'sort-menu-anchor';

          const detachMenu = () => {
            if (!wrapper) return;
            if (sortMenu.parentElement !== document.body) {
              wrapper.insertBefore(menuPlaceholder, sortMenu);
              document.body.appendChild(sortMenu);
            }
          };

          const restoreMenu = () => {
            if (menuPlaceholder.parentElement) {
              menuPlaceholder.parentElement.replaceChild(sortMenu, menuPlaceholder);
            }
          };
          
          const positionMenu = () => {
            const btnRect = sortMenuBtn.getBoundingClientRect();
            const margin = 12;
            const gap = 4;
            
            let top = btnRect.bottom + gap;
            let left = btnRect.left;
            
            sortMenu.style.top = `${top}px`;
            sortMenu.style.left = `${left}px`;
            
            const menuRect = sortMenu.getBoundingClientRect();
            
            if (menuRect.right > window.innerWidth - margin) {
              left = Math.max(margin, window.innerWidth - margin - menuRect.width);
              sortMenu.style.left = `${left}px`;
            }
            
            if (menuRect.left < margin) {
              left = margin;
              sortMenu.style.left = `${left}px`;
            }
            
            if (menuRect.bottom > window.innerHeight - margin) {
              const aboveTop = btnRect.top - gap - menuRect.height;
              top = Math.max(margin, Math.min(aboveTop, window.innerHeight - margin - menuRect.height));
              sortMenu.style.top = `${top}px`;
            }

            if (top < margin) {
              top = margin;
              sortMenu.style.top = `${top}px`;
            }
          };
          
          const openMenu = () => {
            if (isMenuOpen) return;
            isMenuOpen = true;
            detachMenu();
            
            // Remove hidden first to allow proper measurement
            sortMenu.classList.remove('hidden');

            // Rotate chevron icon
            const chevron = sortMenuBtn.querySelector('svg');
            if (chevron) chevron.style.transform = 'rotate(180deg)';
            
            syncSortMenuState();
            
            // Add outside click listener on next tick
            requestAnimationFrame(() => {
              document.addEventListener('click', handleOutsideClick, true);
            });
          };
          
          const closeMenu = () => {
            if (!isMenuOpen) return;
            isMenuOpen = false;
            sortMenu.classList.add('hidden');
            sortMenuBtn.setAttribute('aria-expanded', 'false');
            sortMenu.style.top = '-9999px';
            sortMenu.style.left = '-9999px';
            restoreMenu();
            
            // Reset chevron icon
            const chevron = sortMenuBtn.querySelector('svg');
            if (chevron) chevron.style.transform = 'rotate(0deg)';
            
            document.removeEventListener('click', handleOutsideClick, true);
          };
          
          const handleOutsideClick = (ev) => {
            // Check if click is inside the menu or button
            if (sortMenu.contains(ev.target) || sortMenuBtn.contains(ev.target)) {
              return;
            }
            closeMenu();

          state.library.scrollListener = null;
        }
        
        let lastScrollY = 0;
        let isCollapsing = false;
        const SCROLL_THRESHOLD = 40; // Start collapsing after this scroll distance
        const COLLAPSE_DISTANCE = 120; // Distance to fully collapse (increased for smoother transition)
        
        const virtualWrap = document.querySelector('#virtualWrap');
        
        // Wait for virtualizer to mount, then attach scroll listener
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const scroller = document.querySelector('#libraryScroll');
            const filterContent = document.querySelector('#filterContent');
            const filterPanel = document.querySelector('#filterPanel');
            if (!scroller) return;
            
            // Get initial full height (if filter exists)
            let fullHeight = 0;
            if (filterContent && filterPanel && !state.ui.filterCollapsed) {
              filterContent.style.maxHeight = 'none';
              filterContent.style.opacity = '1';
              fullHeight = filterContent.scrollHeight;
              filterContent.style.maxHeight = fullHeight + 'px';
            }
            
            // Use requestAnimationFrame for smooth scroll-linked animations
            let ticking = false;
            
            const handleScroll = () => {
              const currentScrollY = scroller.scrollTop;
              const scrollDelta = currentScrollY - lastScrollY;
              
              // ===== FILTER COLLAPSE LOGIC (smooth & elegant) =====
              if (filterPanel && filterContent && !ticking) {
                ticking = true;
                requestAnimationFrame(() => {
                  // Scrolling down - progressively collapse
                  if (currentScrollY > SCROLL_THRESHOLD && !state.ui.filterCollapsed) {
                    if (!isCollapsing) {
                      isCollapsing = true;
                      // Ensure we have the full height
                      if (fullHeight === 0) {
                        filterContent.style.maxHeight = 'none';
                        fullHeight = filterContent.scrollHeight;
                      }
                      // Disable CSS transitions for scroll-linked animation
                      filterContent.style.transition = 'none';
                    }
                    
                    // Calculate collapse progress (0 to 1) with easing
                    const rawProgress = Math.min((currentScrollY - SCROLL_THRESHOLD) / COLLAPSE_DISTANCE, 1);
                    // Apply ease-out curve for smoother feel
                    const scrollProgress = 1 - Math.pow(1 - rawProgress, 2);
                    const currentHeight = fullHeight * (1 - scrollProgress);
                    const currentOpacity = 1 - (scrollProgress * 0.8); // Fade to 20% opacity
                    
                    // Apply smooth transform
                    filterContent.style.maxHeight = Math.max(0, currentHeight) + 'px';
                    filterContent.style.opacity = String(Math.max(0.2, currentOpacity));
                    filterContent.style.overflow = 'hidden';
                    filterContent.style.transform = `translateY(${-scrollProgress * 4}px)`; // Subtle slide up
                    
                    // Fully collapsed?
                    if (rawProgress >= 1) {
                      state.ui.filterCollapsed = true;
                      localStorage.setItem('filterCollapsed', 'true');
                      filterContent.style.maxHeight = '0';
                      filterContent.style.opacity = '0';
                      
                      // Update toggle button icon

                        }
                        toggleBtn.setAttribute('aria-expanded', 'false');
                        toggleBtn.title = 'Filter anzeigen';
                      }
                      isCollapsing = false;
                    }
                  }
                  // Near top - expand if collapsed
                  else if (currentScrollY < SCROLL_THRESHOLD && state.ui.filterCollapsed) {
                    state.ui.filterCollapsed = false;
                    localStorage.setItem('filterCollapsed', 'false');
                    isCollapsing = false;
                    
                    // Smooth expand animation with CSS transition
                    filterContent.style.transition = 'max-height 350ms cubic-bezier(0.4, 0.0, 0.2, 1), opacity 300ms cubic-bezier(0.4, 0.0, 0.2, 1), transform 300ms cubic-bezier(0.4, 0.0, 0.2, 1)';
                    filterContent.style.maxHeight = fullHeight + 'px';
                    filterContent.style.opacity = '1';
                    filterContent.style.transform = 'translateY(0)';
                    filterContent.style.overflow = 'visible';
                    
                    // Update toggle button icon
                    const toggleBtn = document.querySelector('#filterToggle');
                    if (toggleBtn) {
                      const iconContainer = toggleBtn.querySelector('div:last-child');
                      if (iconContainer) {
                        iconContainer.innerHTML = SVG_CHEVRON_UP;
                      }
                      toggleBtn.setAttribute('aria-expanded', 'true');
                      toggleBtn.title = 'Filter ausblenden';
                    }
                  }
                  // Not collapsed and scrolling back up but not at top yet - restore partially
                  else if (isCollapsing && scrollDelta < 0 && !state.ui.filterCollapsed) {
                    const rawProgress = Math.min((currentScrollY - SCROLL_THRESHOLD) / COLLAPSE_DISTANCE, 1);
                    const scrollProgress = 1 - Math.pow(1 - rawProgress, 2);
                    const currentHeight = fullHeight * (1 - scrollProgress);
                    const currentOpacity = 1 - (scrollProgress * 0.8);
                    
                    filterContent.style.maxHeight = Math.max(0, currentHeight) + 'px';
                    filterContent.style.opacity = String(Math.max(0.2, currentOpacity));
                    filterContent.style.transform = `translateY(${-scrollProgress * 4}px)`;
                  }
                  
                  ticking = false;
                });
              }
              
              lastScrollY = currentScrollY;
            };
            
            scroller.addEventListener('scroll', handleScroll, { passive: true });
            state.library.scrollListener = handleScroll;
          });
