      const playlistApi = {
        async request(path, { method = "GET", body, cache = "no-store" } = {}) {
          const opts = { method, headers: {}, cache };
          if (body !== undefined) {
            opts.body = JSON.stringify(body);
            opts.headers["Content-Type"] = "application/json";
          }
          // CSRF-Token explizit setzen, falls vorhanden
          const csrfToken = sessionStorage.getItem('csrfToken');
          if (csrfToken && ["POST", "PUT", "DELETE", "PATCH"].includes(method.toUpperCase()) && path.startsWith('/api/')) {
            opts.headers["X-CSRF-Token"] = csrfToken;
          }
          const res = await fetch(path, opts);
          if (!res?.ok) {
            const status = res ? res.status : "network";
            let errorMessage = `Request failed (${status})`;
            // Try to get error message from response
            try {
              const errorData = await res.json();
              if (errorData?.error) {
                errorMessage = errorData.error;
              }
            } catch {
              // If JSON parsing fails, try to get text
              try {
                const errorText = await res.text();
                if (errorText) errorMessage = errorText;
              } catch {}
            }
            const error = new Error(errorMessage);
            error.status = status;
            throw error;
          }
          const text = await res.text();
          if (!text) return null;
          try { return JSON.parse(text); } catch { return null; }
        },
        fetchState() {
          return playlistApi.request("/api/playlists");
        },
        create(payload = {}) {
          return playlistApi.request("/api/playlists", { method: "POST", body: payload });
        },
        activate(id) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/activate`, { method: "POST" });
        },
        update(id, payload) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}`, { method: "PATCH", body: payload });
        },
        remove(id) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}`, { method: "DELETE" });
        },
        addItem(id, name) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/add`, { method: "POST", body: { name } });
        },
        removeItem(id, name) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/remove`, { method: "POST", body: { name } });
        },
        clear(id) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/clear`, { method: "POST" });
        },
        reorder(id, order) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/reorder`, { method: "POST", body: { order } });
        },
        setItems(id, items, currentIndex) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/set`, { method: "POST", body: { items, currentIndex } });
        },
        setCurrent(id, index) {
          return playlistApi.request(`/api/playlists/${encodeURIComponent(id)}/items/current`, { method: "POST", body: { index } });
        },
        assign(name, playlistIds) {
          console.log('playlistApi.assign called with:', { name, type: typeof name, playlistIds });
          console.log('Request body will be:', JSON.stringify({ name, playlists: playlistIds }, null, 2));
          return playlistApi.request(`/api/playlists/items/assign`, { method: "POST", body: { name, playlists: playlistIds } });
        }
      };

      async function fetchPlaylists() {
        try {
          const data = await playlistApi.fetchState();
          applyPlaylistState(data);
        } catch (err) {
          console.warn('fetchPlaylists failed', err);
        }
      }
      function connectPlaylistEvents() {
        try { playlist.es?.close?.(); } catch {}
        const sseUrl = typeof withBasePath === 'function'
          ? withBasePath('/api/playlists/events')
          : '/api/playlists/events';
        
        const es = new EventSource(sseUrl, { withCredentials: true });
        const markSseActivity = () => {
          playlist.lastSseActivity = Date.now();
        };
        
        es.onopen = () => {
          // console.log('[SSE] ✅ Connected to playlist events');
          // Reset reconnection attempts on successful connection
          playlist.reconnectAttempts = 0;
          markSseActivity();
        };
        
        es.onmessage = (ev) => {
          try {
            markSseActivity();
            const data = JSON.parse(ev.data);
            console.log('[SSE] 📨 Received generic message:', data);
            applyPlaylistState(data, { silent: true });
          } catch (err) {
            console.warn('[SSE] ⚠️ Parse failed:', err);
          }
        };
        
        // Handle specific event types for playlist updates
        es.addEventListener('playlist-active', (ev) => {
          try {
            markSseActivity();
            const data = JSON.parse(ev.data);
            console.log('[SSE] 📨 Received playlist-active update:', data);
            applyPlaylistState(data, { silent: true });
          } catch (err) {
            console.warn('[SSE] ⚠️ Parse failed for playlist-active:', err);
          }
        });
        
        es.addEventListener('playlist-state', (ev) => {
          try {
            markSseActivity();
            const data = JSON.parse(ev.data);
            console.log('[SSE] 📨 Received playlist-state update:', data);
            applyPlaylistState(data, { silent: true });
          } catch (err) {
            console.warn('[SSE] ⚠️ Parse failed for playlist-state:', err);
          }
        });
        
        es.addEventListener('ping', () => {
          markSseActivity();
        });
        
        es.onerror = (err) => {
          console.error('[SSE] ❌ Connection error:', err, 'ReadyState:', es.readyState);
          markSseActivity();
          try { es.close(); } catch {}
          
          // Implement exponential backoff for reconnection
          playlist.reconnectAttempts = (playlist.reconnectAttempts || 0) + 1;
          const maxDelay = 30000; // Max 30 seconds
          const baseDelay = 2500; // Base 2.5 seconds
          const delay = Math.min(baseDelay * Math.pow(1.5, playlist.reconnectAttempts - 1), maxDelay);
          
          // console.log(`[SSE] Reconnecting in ${delay}ms (attempt ${playlist.reconnectAttempts})...`);
          setTimeout(connectPlaylistEvents, delay);
        };
        
        playlist.es = es;
        // Ensure polling safety net stays alive
        ensurePlaylistSyncHeartbeat();
      }
      
      let playlistSseWatchdog = null;
      function ensurePlaylistSseWatchdog() {
        if (playlistSseWatchdog) return;
        playlistSseWatchdog = setInterval(() => {
          if (!playlist.es || playlist.es.readyState !== EventSource.OPEN) return;
          const last = playlist.lastSseActivity || 0;
          if (Date.now() - last > 30000) {
            console.warn('[SSE] ⚠️ Playlist stream stale, forcing refresh');
            try { playlist.es.close(); } catch {}
            playlist.es = null;
            fetchPlaylists().catch(() => {});
            connectPlaylistEvents();
          }
        }, 15000);
      }

      let playlistSyncHeartbeat = null;
      function ensurePlaylistSyncHeartbeat() {
        if (playlistSyncHeartbeat) return;
        // Poll as safety net when SSE is stale or dropped (Safari/iOS flakiness)
        playlistSyncHeartbeat = setInterval(async () => {
          const now = Date.now();
          const last = playlist.lastSseActivity || 0;
          const sseHealthy = playlist.es && playlist.es.readyState === EventSource.OPEN && (now - last) < 8000;
          if (sseHealthy) return;
          try {
            const data = await playlistApi.fetchState();
            if (data) {
              playlist.lastSseActivity = Date.now();
              applyPlaylistState(data, { silent: true });
            }
          } catch (err) {
            console.warn('[Playlist Sync] Poll fallback failed:', err?.message || err);
          }
        }, 8000);
      }
      function applyPlaylistState(data, { silent = false } = {}) {
        if (!data || typeof data !== 'object') return;
        const list = Array.isArray(data.playlists) ? data.playlists : [];
        playlist.list = list.map((entry) => ({
          id: entry.id,
          name: entry.name || null,
          icon: entry.icon || "🎵",
          accentColor: entry.accentColor || "#6366F1",
          items: Array.isArray(entry.items) ? entry.items.slice() : [],
          currentIndex: Number.isInteger(entry.currentIndex) ? entry.currentIndex : -1,
          createdAt: Number(entry.createdAt) || null,
          updatedAt: Number(entry.updatedAt) || Date.now(),
          itemCount: Number.isFinite(entry.itemCount) ? entry.itemCount : (Array.isArray(entry.items) ? entry.items.length : 0)
        }));
        playlist.byId = new Map(playlist.list.map((pl) => [pl.id, pl]));
        playlist.activeId = typeof data.activeId === 'string' && playlist.byId.has(data.activeId)
          ? data.activeId
          : (playlist.list[0]?.id || null);
        const active = playlist.activeId ? playlist.byId.get(playlist.activeId) : null;
        playlist.items = active?.items ? active.items.slice() : [];
        playlist.currentIndex = Number.isInteger(active?.currentIndex) ? active.currentIndex : -1;
        playlist.name = active?.name || null;
        playlist.icon = active?.icon || "🎵";
        playlist.accentColor = active?.accentColor || "#6366F1";
        playlist.itemCount = Number.isFinite(active?.itemCount) ? active.itemCount : playlist.items.length;
        playlist.updatedAt = Number(active?.updatedAt) || Number(data.updatedAt) || Date.now();
        playlist.ready = true;

        refreshAccentTheme();
        ensurePlaylistBadge();
        updatePlaylistPanel();
        updateViewerPlaylistControls();
        updateLibraryPlaylistButtons();

        playlist.managerRender?.({});

        // WICHTIG: Wenn wir in der Detail-Ansicht einer Playlist sind, diese aktualisieren
        // statt zur Übersicht zurückzukehren
        if (!document.body.classList.contains('in-viewer') && playlist.mode) {
          if (playlist.currentDetailId) {
            // In Detail-Ansicht: nur diese Playlist aktualisieren
            renderPlaylistDetail(playlist.currentDetailId);
          } else {
            // In Übersicht: normale Library rendern
            renderPlaylistLibrary();
          }
        }
      }

      function refreshAccentTheme() {
        const inViewer = document.body.classList.contains('in-viewer');
        if (playlist.mode) {
          if (inViewer) {
            applyAccentTheme(null, { ignorePlaylistAccent: true });
          } else {
            applyAccentTheme(null, { ignorePlaylistAccent: true });
          }
        } else {
          applyAccentTheme(state.library?.categoryFilter || null);
        }
      }

      function getPlaylistEntry(id = playlist.activeId) {
        if (!id) return null;
        return playlist.byId.get(id) || null;
      }

      async function addToPlaylist(name, targetId = playlist.activeId) {
        if (!targetId || !name) return;
        const entry = getPlaylistEntry(targetId);
        if (entry && !entry.items.includes(name)) {
          entry.items = entry.items.slice();
          entry.items.push(name);
          entry.itemCount = entry.items.length;
          entry.updatedAt = Date.now();
          if (targetId === playlist.activeId) {
            playlist.items = entry.items.slice();
            playlist.itemCount = entry.itemCount;
            playlist.updatedAt = entry.updatedAt;
            updatePlaylistPanel();
            updateViewerPlaylistControls();
            updateLibraryPlaylistButtons();
            ensurePlaylistBadge();
            if (!document.body.classList.contains('in-viewer') && playlist.mode) {
              renderPlaylistLibrary();
            }
          }
        }
        try {
          await playlistApi.addItem(targetId, name);
        } catch (err) {
          console.warn('addToPlaylist failed', err);
          fetchPlaylists();
        }
      }
      async function removeFromPlaylist(name, targetId = playlist.activeId) {
        if (!targetId || !name) return;
        const entry = getPlaylistEntry(targetId);
        if (entry) {
          const idx = entry.items.indexOf(name);
          if (idx !== -1) {
            entry.items = entry.items.slice();
            entry.items.splice(idx, 1);
            entry.itemCount = entry.items.length;
            if (entry.currentIndex >= entry.items.length) {
              entry.currentIndex = entry.items.length ? entry.items.length - 1 : -1;
            }
            entry.updatedAt = Date.now();
          if (targetId === playlist.activeId) {
            playlist.items = entry.items.slice();
            playlist.itemCount = entry.itemCount;
            playlist.currentIndex = entry.currentIndex;
            playlist.updatedAt = entry.updatedAt;
            updatePlaylistPanel();
            updateViewerPlaylistControls();
            updateLibraryPlaylistButtons();
            ensurePlaylistBadge();
            if (!document.body.classList.contains('in-viewer') && playlist.mode) {
              renderPlaylistLibrary();
            }
          }
          }
        }
        try {
          await playlistApi.removeItem(targetId, name);
        } catch (err) {
          console.warn('removeFromPlaylist failed', err);
          fetchPlaylists();
        }
      }
      async function setPlaylistOrder(order, targetId = playlist.activeId) {
        if (!targetId || !Array.isArray(order)) return;
        const entry = getPlaylistEntry(targetId);
        if (entry) {
          entry.items = order.slice();
          if (!entry.items.length) entry.currentIndex = -1;
          else if (entry.currentIndex >= entry.items.length) entry.currentIndex = entry.items.length - 1;
          entry.itemCount = entry.items.length;
          entry.updatedAt = Date.now();
          if (targetId === playlist.activeId) {
            playlist.items = entry.items.slice();
            playlist.currentIndex = entry.currentIndex;
            playlist.itemCount = entry.itemCount;
            playlist.updatedAt = entry.updatedAt;
            updatePlaylistPanel();
            updateViewerPlaylistControls();
            if (!document.body.classList.contains('in-viewer') && playlist.mode) {
              renderPlaylistLibrary();
            }
          }
        }
        try {
          await playlistApi.reorder(targetId, order);
        } catch (err) {
          console.warn('setPlaylistOrder failed', err);
          fetchPlaylists();
        }
      }
      async function setPlaylistCurrentIndex(index, targetId = playlist.activeId) {
        if (!targetId || !Number.isInteger(index)) return;
        const entry = getPlaylistEntry(targetId);
        if (entry) {
          entry.currentIndex = Math.max(-1, Math.min(entry.items.length - 1, index));
          entry.updatedAt = Date.now();
          if (targetId === playlist.activeId) {
            playlist.currentIndex = entry.currentIndex;
            playlist.updatedAt = entry.updatedAt;
            updateViewerPlaylistControls();
            updatePlaylistPanel();
          }
        }
        try {
          await playlistApi.setCurrent(targetId, index);
        } catch (err) {
          console.warn('setPlaylistCurrentIndex failed', err);
          fetchPlaylists();
        }
      }
      async function clearPlaylist(targetId = playlist.activeId) {
        if (!targetId) return;
        const entry = getPlaylistEntry(targetId);
        if (entry) {
          entry.items = [];
          entry.itemCount = 0;
          entry.currentIndex = -1;
          entry.updatedAt = Date.now();
          if (targetId === playlist.activeId) {
            playlist.items = [];
            playlist.itemCount = 0;
            playlist.currentIndex = -1;
            playlist.updatedAt = entry.updatedAt;
            updatePlaylistPanel();
            updateViewerPlaylistControls();
            updateLibraryPlaylistButtons();
            ensurePlaylistBadge();
            if (playlist.mode && !document.body.classList.contains('in-viewer')) {
              renderPlaylistLibrary();
            }
          }
        }
        try {
          await playlistApi.clear(targetId);
        } catch (err) {
          console.warn('clearPlaylist failed', err);
          fetchPlaylists();
        }
      }

      async function activatePlaylistOnBackend(id) {
        if (!id || id === playlist.activeId) return;
        try {
          const res = await playlistApi.activate(id);
          if (res?.state) {
            applyPlaylistState(res.state);
          } else {
            await fetchPlaylists();
          }
        } catch (err) {
          console.warn('activatePlaylist failed', err);
          fetchPlaylists();
        }
      }

      async function createPlaylistOnBackend(meta = {}) {
        try {
          const payload = {};
          if (meta.name !== undefined) payload.name = meta.name;
          if (meta.icon !== undefined) payload.icon = meta.icon;
          if (meta.accentColor !== undefined) payload.accentColor = meta.accentColor;
          if (Array.isArray(meta.items)) payload.items = meta.items;
          const res = await playlistApi.create(payload);
          if (res?.state) {
            applyPlaylistState(res.state);
          } else {
            await fetchPlaylists();
          }
          return res?.playlist || null;
        } catch (err) {
          console.warn('createPlaylist failed', err);
          return null;
        }
      }

      async function updatePlaylistMetaOnBackend(id, meta = {}) {
        if (!id || !meta || typeof meta !== 'object') return null;
        try {
          const payload = {};
          if (meta.name !== undefined) payload.name = meta.name;
          if (meta.icon !== undefined) payload.icon = meta.icon;
          if (meta.accentColor !== undefined) payload.accentColor = meta.accentColor;
          if (meta.currentIndex !== undefined) payload.currentIndex = meta.currentIndex;
          const res = await playlistApi.update(id, payload);
          if (res?.playlist) {
            const entry = playlist.byId.get(id);
            if (entry) {
              if (payload.name !== undefined) entry.name = res.playlist.name;
              if (payload.icon !== undefined) entry.icon = res.playlist.icon;
              if (payload.accentColor !== undefined) entry.accentColor = res.playlist.accentColor;
              if (payload.currentIndex !== undefined && Number.isInteger(res.playlist.currentIndex)) {
                entry.currentIndex = res.playlist.currentIndex;
              }
              entry.updatedAt = res.playlist.updatedAt;
              const isActive = id === playlist.activeId;
              if (isActive) {
                playlist.name = entry.name;
                playlist.icon = entry.icon;
                playlist.accentColor = entry.accentColor;
                playlist.currentIndex = entry.currentIndex;
                playlist.updatedAt = entry.updatedAt;
                refreshAccentTheme();
                updateViewerPlaylistControls();
                updatePlaylistPanel();
              }
              if (playlist.mode && !document.body.classList.contains('in-viewer')) {
                renderPlaylistLibrary();
              } else if (isActive) {
                ensurePlaylistBadge();
              }
            }
            playlist.managerRender?.({ focusId: id });
          } else {
            await fetchPlaylists();
          }
          return res?.playlist || null;
        } catch (err) {
          console.warn('updatePlaylistMeta failed', err);
          fetchPlaylists();
          return null;
        }
      }

      async function deletePlaylistOnBackend(id) {
        if (!id) return false;
        try {
          const res = await playlistApi.remove(id);
          if (res?.state) {
            applyPlaylistState(res.state);
          } else {
            await fetchPlaylists();
          }
          return true;
        } catch (err) {
          console.warn('deletePlaylist failed', err);
          fetchPlaylists();
          return false;
        }
      }

      async function assignItemToPlaylists(name, playlistIds) {
        if (!name) {
          console.error('assignItemToPlaylists: name is empty');
          showToast('Fehler: Kein Dateiname angegeben', 3000);
          return false;
        }
        if (!Array.isArray(playlistIds) || playlistIds.length === 0) {
          console.error('assignItemToPlaylists: no playlists selected');
          showToast('Fehler: Keine Playlists ausgewählt', 3000);
          return false;
        }
        
        console.log('assignItemToPlaylists:', { name, playlistIds });
        
        try {
          const res = await playlistApi.assign(name, playlistIds);
          if (res?.state) {
            applyPlaylistState(res.state);
            showToast(`Zu ${playlistIds.length} Playlist${playlistIds.length > 1 ? 's' : ''} hinzugefügt`, 2500);
          } else {
            await fetchPlaylists();
          }
          return true;
        } catch (err) {
          console.error('assignItemToPlaylists failed:', err);
          const errorMsg = err?.message || 'Unbekannter Fehler';
          showToast(`Fehler beim Zuordnen: ${errorMsg}`, 3500);
          await fetchPlaylists();
          return false;
        }
      }

            .filter((pl) => pl.items.includes(itemName))
            .map((pl) => pl.id)

            saveBtn.disabled = selected.size === 0;
            return;
          }
          const items = playlist.list.map((pl) => {
            const checked = selected.has(pl.id);
            const accent = pl.accentColor || '#6366F1';
            const icon = escapeHtml(pl.icon || '🎵');
            const count = pl.itemCount || 0;
            const label = escapeHtml(pl.name || 'Setlist');

      function ensurePlaylistBadge() {
        // Playlist badge removed from top bar - user should use playlist page instead
        document.querySelector('#headerPlaylistBadge')?.remove();
      }

      function closePlaylistManager() {
        if (playlist.managerBackdropCleanup) {
          try { playlist.managerBackdropCleanup(); } catch {}
          playlist.managerBackdropCleanup = null;
        }
        if (playlist.managerBackdrop?.isConnected) {
          playlist.managerBackdrop.classList.add('fade-out');
          setTimeout(() => {
            playlist.managerBackdrop?.remove();
            playlist.managerBackdrop = null;
            playlist.managerRender = null;
          }, 200);
        } else {
          playlist.managerBackdrop = null;
          playlist.managerRender = null;
        }
      }

      function openPlaylistManager(options = {}) {
        const { focusId = null } = options;
        if (playlist.managerBackdrop?.isConnected) {
          playlist.managerRender?.({ focusId });
          return;
        }

        const accentColor = playlist.accentColor || '#6366F1';
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.dataset.modal = 'playlist-manager';
        backdrop.style.setProperty('--badge-accent', accentColor);
        backdrop.innerHTML = `
          <div class="share-dialog-container">
            <button class="share-dialog-close" aria-label="Schließen" title="Schließen (ESC)" data-role="manager-close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <div class="share-dialog-header">
              <div class="share-dialog-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 18V5l12-2v13"></path>
                  <circle cx="6" cy="18" r="3"></circle>
                  <circle cx="18" cy="16" r="3"></circle>
                </svg>
                <span>Playlists verwalten</span>
              </div>
              <div class="share-dialog-subtitle">
                Organisiere unterschiedliche Programme, stimme Farben und Icons ab
              </div>
            </div>
            
            <div class="share-dialog-body">
              <div class="space-y-3" data-role="manager-list"></div>
            </div>
            
            ${!focusId ? `
              <div class="share-dialog-footer">
                <button type="button" data-role="manager-create" class="btn btn-primary is-ready">
                  <span class="text-base leading-none mr-1">＋</span>
                  Neue Playlist
                </button>
              </div>
            ` : ''}
          </div>
        `;

        const onBackdropClick = (ev) => {
          if (ev.target === backdrop) {
            closePlaylistManager();
          }
        };
        backdrop.addEventListener('click', onBackdropClick);

        const closeBtn = backdrop.querySelector('[data-role="manager-close"]');
        closeBtn?.addEventListener('click', (ev) => {
          ev.preventDefault();
          closePlaylistManager();
        });
        
        // ESC key support
        const handleEsc = (ev) => {
          if (ev.key === 'Escape') {
            closePlaylistManager();
            document.removeEventListener('keydown', handleEsc);
          }
        };
        document.addEventListener('keydown', handleEsc);

        document.body.appendChild(backdrop);
        playlist.managerBackdrop = backdrop;

        const listEl = backdrop.querySelector('[data-role="manager-list"]');
        const createBtn = backdrop.querySelector('[data-role="manager-create"]');

        const render = ({ focusId: nextFocus } = {}) => {
          if (!playlist.managerBackdrop?.isConnected || !listEl) return;
          if (!playlist.list.length) {
            listEl.innerHTML = '<div class="rounded-xl border border-neutral-800/60 bg-neutral-900/70 p-6 text-neutral-400 text-sm">Noch keine Playlists angelegt. Erstelle jetzt deine erste Auswahl für ein Konzert.</div>';
            return;
          }

          // Wenn wir von einer Detail-Ansicht kommen (focusId gesetzt), nur diese Playlist anzeigen
          const playlistsToShow = nextFocus 
            ? playlist.list.filter(entry => entry.id === nextFocus)
            : playlist.list;

          const canDelete = playlist.list.length > 1;
          const markup = playlistsToShow.map((entry) => {
            const isActive = entry.id === playlist.activeId;
            const accent = entry.accentColor || '#6366F1';
            const updatedLabel = (() => {
              if (!Number.isFinite(entry.updatedAt)) return '';
              try {
                return new Date(entry.updatedAt).toLocaleString(undefined, { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
              } catch {
                return '';
              }
            })();
            const badge = `${entry.itemCount || 0} ${entry.itemCount === 1 ? 'Titel' : 'Titel'}`;
            const colorButtons = PLAYLIST_COLOR_PALETTE.map((color) => {
              const selected = color === entry.accentColor;
              return `<button type="button" data-role="color" data-color="${color}" class="w-6 h-6 rounded-full border ${selected ? 'ring-2 ring-offset-2 ring-offset-neutral-900 ring-white/70 border-transparent' : 'border-neutral-700/60 hover:border-white/40'}" style="background:${color};"></button>`;
            }).join('');

            return `
              <section class="playlist-manager-card rounded-2xl border border-neutral-800/60 bg-neutral-900/70 p-5 transition-all" data-id="${entry.id}" style="--playlist-accent:${accent}">
                <div class="flex flex-wrap items-start justify-between gap-4">
                  <div class="flex items-start gap-3 min-w-0">
                    <div class="h-12 w-12 rounded-xl border border-neutral-700/70 bg-neutral-950/90 text-2xl grid place-items-center">${escapeHtml(entry.icon || '🎵')}</div>
                    <div class="min-w-0">
                      <label class="sr-only" for="pl-name-${entry.id}">Playlistname</label>
                      <input id="pl-name-${entry.id}" data-role="name" value="${escapeHtml(entry.name || '')}" class="w-full bg-transparent border border-transparent focus:border-[--playlist-accent] focus:ring-2 focus:ring-[--playlist-accent]/40 rounded-lg px-2 py-1.5 text-base font-semibold text-neutral-50 transition-colors" placeholder="Name der Playlist" />
                      <div class="mt-1 text-xs text-neutral-400 flex items-center gap-2">
                        <span>${badge}</span>
                        ${updatedLabel ? `<span class="w-1 h-1 rounded-full bg-neutral-700"></span><span>Aktualisiert ${escapeHtml(updatedLabel)}</span>` : ''}
                      </div>
                    </div>
                  </div>
                  <div class="flex flex-wrap gap-2 shrink-0 items-center">
                    ${isActive ? '<span class="px-3 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-300 border border-emerald-400/30 text-sm font-medium">Aktiv</span>' : ''}
                    <button type="button" data-action="delete" class="btn btn-secondary ${canDelete ? '' : 'opacity-40 cursor-not-allowed'}" ${canDelete ? '' : 'disabled'} style="border-color: rgba(239, 68, 68, 0.5); color: rgb(252, 165, 165);">
                      Löschen
                    </button>
                  </div>
                </div>
                <div class="mt-4 flex flex-wrap items-center gap-4">
                  <label class="flex items-center gap-2 text-xs uppercase tracking-[0.24em] text-neutral-500">
                    <span>Icon</span>
                    <input data-role="icon" value="${escapeHtml(entry.icon || '')}" maxlength="2" class="w-16 px-2 py-1.5 rounded-lg bg-neutral-950/80 border border-neutral-700/60 text-base text-neutral-100 focus:border-[--playlist-accent] focus:ring-1 focus:ring-[--playlist-accent]/40" placeholder="🎵" />
                  </label>
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="text-xs uppercase tracking-[0.24em] text-neutral-500">Farbe</span>
                    <div class="flex flex-wrap items-center gap-2" data-role="color-grid">
                      ${colorButtons}
                    </div>
                  </div>
                </div>
              </section>
            `;
          }).join('');

          listEl.innerHTML = markup;

          if (nextFocus) {
            const focusInput = listEl.querySelector(`section[data-id="${nextFocus}"] input[data-role="name"]`);
            if (focusInput) {
              setTimeout(() => focusInput.select(), 50);
            }
          }

          listEl.querySelectorAll('input[data-role="name"]').forEach((input) => {
            const id = input.closest('section')?.dataset.id;
            if (!id) return;
            const entry = playlist.byId.get(id);
            input.addEventListener('input', () => {
              input.value = input.value.slice(0, 80);
            });
            input.addEventListener('keydown', (ev) => {
              if (ev.key === 'Enter') {
                ev.preventDefault();
                input.blur();
              }
            });
            input.addEventListener('blur', async () => {
              const value = input.value.trim();
              if (entry && value && value !== entry.name) {
                const previous = entry.name;
                input.disabled = true;
                try {
                  const result = await updatePlaylistMetaOnBackend(id, { name: value });
                  if (result) {
                    showToast(`Playlist umbenannt: ${value}`, 2000);
                  } else {
                    throw new Error('Update failed');
                  }
                } catch (err) {
                  console.error('Failed to update playlist name:', err);
                  entry.name = previous;
                  if (entry.id === playlist.activeId) {
                    playlist.name = previous;
                    ensurePlaylistBadge();
                  }
                  input.value = previous;
                  showToast('Fehler beim Speichern des Namens', 2500);
                } finally {
                  input.disabled = false;
                }
              } else if (!value && entry) {
                input.value = entry.name || '';
              }
            });
          });

          listEl.querySelectorAll('input[data-role="icon"]').forEach((input) => {
            const id = input.closest('section')?.dataset.id;
            if (!id) return;
            const entry = playlist.byId.get(id);
            input.addEventListener('input', () => {
              const trimmed = input.value.trim();
              const limited = [...trimmed].slice(0, 2).join('');
              if (input.value !== limited) input.value = limited;
            });
            input.addEventListener('blur', async () => {
              const value = input.value.trim();
              if (entry && value && value !== entry.icon) {
                const previous = entry.icon;
                const normalized = [...value].slice(0, 2).join('') || '🎵';
                input.disabled = true;
                try {
                  const result = await updatePlaylistMetaOnBackend(id, { icon: normalized });
                  if (result) {
                    showToast(`Icon aktualisiert: ${normalized}`, 2000);
                  } else {
                    throw new Error('Update failed');
                  }
                } catch (err) {
                  console.error('Failed to update playlist icon:', err);
                  entry.icon = previous;
                  input.value = previous;
                  if (entry.id === playlist.activeId) {
                    playlist.icon = previous;
                    ensurePlaylistBadge();
                  }
                  showToast('Fehler beim Speichern des Icons', 2500);
                } finally {
                  input.disabled = false;
                }
              } else if (!value && entry?.icon) {
                input.value = entry.icon;
              }
            });
          });

          listEl.querySelectorAll('button[data-role="color"]').forEach((button) => {
            button.addEventListener('click', async () => {
              const id = button.closest('section')?.dataset.id;
              const color = button.getAttribute('data-color');
              if (!id || !color) return;
              const entry = playlist.byId.get(id);
              if (entry && entry.accentColor === color) return;
              
              button.disabled = true;
              try {
                const result = await updatePlaylistMetaOnBackend(id, { accentColor: color });
                if (result) {
                  showToast('Farbe aktualisiert', 2000);
                  render({});
                } else {
                  throw new Error('Update failed');
                }
              } catch (err) {
                console.error('Failed to update playlist color:', err);
                showToast('Fehler beim Speichern der Farbe', 2500);
              } finally {
                button.disabled = false;
              }
            });
          });

          listEl.querySelectorAll('button[data-action="delete"]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const id = btn.closest('section')?.dataset.id;
              const entry = id ? playlist.byId.get(id) : null;
              if (!id || !entry) return;
              if (playlist.list.length <= 1) return;
              showConfirmDialog({
                title: 'Playlist löschen?',
                message: `Möchtest du die Playlist "${escapeHtml(entry.name || 'Ohne Titel')}" dauerhaft entfernen?`,
                confirmText: 'Ja, löschen',
                cancelText: 'Abbrechen',
                isDangerous: true,
                onConfirm: async () => {
                  const success = await deletePlaylistOnBackend(id);
                  if (success) {
                    render({});
                  }
                }
              });
            });
          });
        };

        playlist.managerRender = render;
        render({ focusId });

        createBtn?.addEventListener('click', async (ev) => {
          ev.preventDefault();
          const created = await createPlaylistOnBackend({});
          if (created) {
            render({ focusId: created.id });
          }
        });

        const onKeyDown = (ev) => {
          if (ev.key === 'Escape') {
            closePlaylistManager();
          }
        };
        document.addEventListener('keydown', onKeyDown, true);

        playlist.managerBackdropCleanup = () => {
          document.removeEventListener('keydown', onKeyDown, true);
          backdrop.removeEventListener('click', onBackdropClick);
        };
      }

      function toDisplayName(rel) {
        return rel.split('/').pop();
      }

      // Confirmation Dialog
      function showConfirmDialog({ title, message, confirmText = 'Bestätigen', cancelText = 'Abbrechen', onConfirm, isDangerous = false }) {
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.style.zIndex = '10000';
        
        const confirmBtnClass = isDangerous 
          ? 'px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-medium transition-colors shadow-sm'
          : 'px-4 py-2 rounded-lg bg-[--accent-color] hover:opacity-90 text-white font-medium transition-all shadow-sm';
        
        backdrop.innerHTML = `
          <div class="glass-panel w-[440px] max-w-[90vw] p-6 text-neutral-200" role="alertdialog" aria-modal="true">
            <div class="flex items-start gap-3 mb-4">
              ${isDangerous ? `
                <div class="flex-shrink-0 w-10 h-10 rounded-full bg-rose-500/20 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" class="text-rose-400">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                  </svg>
                </div>
              ` : ''}
              <div class="flex-1">
                <h3 class="text-lg font-semibold text-neutral-100 mb-2">${title}</h3>
                <p class="text-sm text-neutral-400 leading-relaxed">${message}</p>
              </div>
            </div>
            <div class="flex items-center justify-end gap-3 mt-6">
              <button id="confirmCancel" class="px-4 py-2 rounded-lg border border-neutral-700 text-neutral-300 hover:bg-neutral-800 transition-colors font-medium">
                ${cancelText}
              </button>
              <button id="confirmOk" class="${confirmBtnClass}">
                ${confirmText}
              </button>
            </div>
          </div>
        `;
        
        document.body.appendChild(backdrop);
        
        const close = () => {
          backdrop.remove();
        };
        
        backdrop.querySelector('#confirmCancel').addEventListener('click', close);
        backdrop.querySelector('#confirmOk').addEventListener('click', () => {
          close();
          if (onConfirm) onConfirm();
        });
        backdrop.addEventListener('click', (ev) => {
          if (ev.target === backdrop) close();
        });
        
        // Focus on confirm button
        setTimeout(() => {
          backdrop.querySelector('#confirmOk')?.focus();
        }, 100);
      }

      let playlistBackdrop = null;
      async function openPlaylistPanel() {
        if (playlistBackdrop?.isConnected) return;
        playlistBackdrop = document.createElement('div');
        playlistBackdrop.className = 'modal-backdrop';
        playlistBackdrop.dataset.modal = 'playlist';
        const accent = playlist.accentColor || '#6366F1';
        const iconDisplay = escapeHtml(playlist.icon || '🎵');
        const playlistName = escapeHtml(playlist.name || 'Setlist');
        const totalItems = playlist.itemCount || playlist.items.length;
        playlistBackdrop.innerHTML = `
          <div class="glass-panel w-[720px] max-w-full p-6 text-sm text-neutral-200" role="dialog" aria-modal="true" style="border-color:${accent}33;">
              <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="h-12 w-12 rounded-xl grid place-items-center bg-neutral-950/80 border border-white/20 text-2xl" id="panelPlaylistIcon">${iconDisplay}</div>
                  <div class="min-w-0">

                  Verwalten
                </button>
                <button id="btnPlaylistClear" type="button" class="inline-flex items-center gap-1.5 px-3.5 py-1.75 rounded-lg border border-neutral-700 text-neutral-300 hover:bg-neutral-800 hover:text-neutral-100 transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-rose-500/40 focus:border-rose-500">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-80">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                    <path d="M15 3H9l-1 3h8l-1-3z"></path>
                  </svg>
                  <span>Leeren</span>
                </button>
                <button id="btnPlaylistClose" type="button" class="inline-flex items-center justify-center w-8 h-8 rounded-full border border-neutral-700 text-neutral-400 hover:text-neutral-200 hover:bg-neutral-800/60 transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-[--badge-accent]/40">
                  <span class="text-lg leading-none">✕</span>
                </button>
              </div>
            </div>
            <div id="playlistList" class="mt-4 divide-y divide-neutral-800 max-h-[60vh] overflow-y-auto">
            </div>
          </div>`;
        document.body.appendChild(playlistBackdrop);
        
        // Close on backdrop click
        playlistBackdrop.addEventListener('click', (ev) => { 
          if (ev.target === playlistBackdrop) closePlaylistPanel(); 
        });
        
        // Close button
        const closeBtn = playlistBackdrop.querySelector('#btnPlaylistClose');
        if (closeBtn) {
          closeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            closePlaylistPanel();
          });
        }

        const manageBtn = playlistBackdrop.querySelector('#btnPlaylistManagePanel');
        if (manageBtn) {
          manageBtn.addEventListener('click', (e) => {
            e.preventDefault();
            closePlaylistPanel();
            openPlaylistManager();
          });
        }

        // Clear button with confirmation
        const clearBtn = playlistBackdrop.querySelector('#btnPlaylistClear');
        if (clearBtn) {
          clearBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const itemCount = playlist.items?.length || 0;
            if (itemCount === 0) return;
            
            showConfirmDialog({
              title: 'Playlist leeren?',
              message: `Möchtest du wirklich alle ${itemCount} ${itemCount === 1 ? 'Titel' : 'Titel'} aus der Playlist entfernen? Diese Aktion kann nicht rückgängig gemacht werden.`,
              confirmText: 'Ja, leeren',
              cancelText: 'Abbrechen',
              isDangerous: true,
              onConfirm: async () => {
                try {
                  await clearPlaylist();
                } catch (err) {
                  console.error('Fehler beim Leeren der Playlist:', err);
                  fetchPlaylists();
                }
              }
            });
          });
        }
        
        updatePlaylistPanel();
      }
      function closePlaylistPanel() {
        if (!playlistBackdrop?.isConnected) return;
        playlistBackdrop.remove();
        playlistBackdrop = null;
      }
      function updatePlaylistPanel() {
        const list = document.querySelector('#playlistList');
        if (!list) return;
        const nameEl = playlistBackdrop?.querySelector('#panelPlaylistName');
        if (nameEl) nameEl.textContent = playlist.name || 'Setlist';
        const iconEl = playlistBackdrop?.querySelector('#panelPlaylistIcon');
        if (iconEl) iconEl.textContent = playlist.icon || '🎵';
        const metaEl = playlistBackdrop?.querySelector('#panelPlaylistMeta');
        if (metaEl) {
          const total = playlist.itemCount || playlist.items.length;
          metaEl.textContent = `${total} ${total === 1 ? 'Titel' : 'Titel'}`;
        }
        const rows = (playlist.items || []).map((rel, idx) => {
          const active = idx === playlist.currentIndex;
          const dn = toDisplayName(rel);
          return `<div class="flex items-center gap-3 py-2 px-1 ${active ? 'bg-neutral-800/50' : ''}">
            <div class="w-6 text-neutral-500 text-right">${idx + 1}</div>
            <div class="flex-1 truncate">${dn}</div>
            <div class="flex items-center gap-2">
              <button data-act="play" data-idx="${idx}" class="px-2 py-1 rounded border border-neutral-700 hover:bg-neutral-800">Öffnen</button>
              <button data-act="remove" data-idx="${idx}" class="px-2 py-1 rounded border border-rose-700 text-rose-300 hover:bg-rose-900/20">Entfernen</button>
            </div>
          </div>`;
        }).join('') || '<div class="py-6 text-neutral-400">Noch keine Titel in der Playlist. Füge welche aus der Bibliothek hinzu.</div>';
        list.innerHTML = rows;
        list.querySelectorAll('button[data-act]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const act = btn.getAttribute('data-act');
            const idx = Number(btn.getAttribute('data-idx'));
            if (!Number.isFinite(idx)) return;
            const rel = playlist.items[idx];
            if (!rel) return;
            if (act === 'remove') {
              await removeFromPlaylist(rel);
            } else if (act === 'play') {
              await setPlaylistCurrentIndex(idx);
              // Wake Lock SOFORT aktivieren (synchron in User-Geste für iOS)
              acquireWakeLockSync();
              // open viewer with this file
              history.replaceState(null, '', '/');
              renderViewer(rel);
              closePlaylistPanel();
            }
          });
        });
      }

      // ===== Virtualized Grid/List (simplified without canvas thumbnails) =====
      function mountVirtualizer(resetScroll = false) {
        const wrap = document.querySelector('#virtualWrap');
        if (!wrap) {
          console.warn('mountVirtualizer: #virtualWrap not found');
          return;
        }
        wrap.innerHTML = "";

        const L = state.library;
        let items = L.items;

        const fuse = window.Fuse && L.q
          ? new Fuse(items, { keys: ["name", "displayName"], threshold: 0.3 })
          : null;
        if (fuse) items = fuse.search(L.q).map(r => r.item);

        const isGrid = L.view === "grid";
        const isSmallScreen = window.innerWidth <= 720;
        const wrapW = wrap.clientWidth;
        const minCardW = 220;      // minimal card width
        const maxCardW = 320;      // cap card width for medium screens to avoid huge tiles
        const minGap = 16;         // minimal horizontal gap between cards
        let cols = isGrid ? Math.max(1, Math.floor((wrapW + minGap) / (minCardW + minGap))) : 1;
        const cardH = isGrid ? 360 : (isSmallScreen ? 104 : 88); // allow a bit more breathing room on phones
        const listGap = 10;              // add vertical spacing between list items
        // Base computation with min width
        let gridCardW = isGrid ? Math.floor((wrapW - (cols - 1) * minGap) / cols) : wrapW;
        // If cards get too wide, increase columns to keep a modern responsive look
        if (isGrid && gridCardW > maxCardW) {
          cols = Math.max(1, Math.floor((wrapW + minGap) / (maxCardW + minGap)));
          gridCardW = Math.floor((wrapW - (cols - 1) * minGap) / cols);
        }
        const gap = isGrid ? minGap : listGap; // keep gap consistent; consume space by growing card width

        const total = items.length;
  const rows = Math.ceil(total / cols);
  const rowStride = cardH + gap;
  const totalHeight = rows * rowStride - gap; // avoid extra gap at end

        const externalScroller = document.querySelector('#libraryScroll');
        const useExternalScroller = externalScroller && externalScroller.contains(wrap);
        const scroller = useExternalScroller ? externalScroller : document.createElement("div");
        wrap.innerHTML = "";
        if (!useExternalScroller) {
          scroller.className = "relative w-full h-full overflow-auto no-scrollbar";
        }
        const spacer = document.createElement("div");
        spacer.style.height = `${totalHeight}px`;
        spacer.style.position = "relative";
        if (useExternalScroller) {
          wrap.appendChild(spacer);
        } else {
          scroller.appendChild(spacer);
          wrap.appendChild(scroller);
        }

        const pool = new Map();
        
        // For small datasets (≤100 items), render all items immediately without virtualization
        // This ensures favorites and filtered lists always show completely
        const useFullRender = total <= 100;

        function renderViewport() {
          const scrollTop = scroller.scrollTop;
          const listOffset = useExternalScroller
            ? Math.max(0, (wrap.getBoundingClientRect().top - scroller.getBoundingClientRect().top) + scrollTop)
            : 0;
          const listScrollTop = Math.max(0, scrollTop - listOffset);
          let viewH = scroller.clientHeight;
          
          // Safety: If viewport height is not yet calculated or too small, use a reasonable minimum
          // This ensures initial render shows enough items
          if (viewH < 300) viewH = Math.max(600, window.innerHeight - 200);
          
          const bufferRows = 3;

          let firstIndex, lastIndex;
          
          if (useFullRender) {
            // Render all items for small datasets
            firstIndex = 0;
            lastIndex = total - 1;
          } else {
            // Use virtualization for large datasets
            const firstRow = Math.max(0, Math.floor(listScrollTop / rowStride) - bufferRows);
            const lastRow  = Math.min(rows - 1, Math.floor((listScrollTop + viewH) / rowStride) + bufferRows);
            firstIndex = firstRow * cols;
            lastIndex  = Math.min(total - 1, (lastRow + 1) * cols - 1);
          }

          // Simple cleanup - remove out-of-view elements (only for virtualized mode)
          if (!useFullRender) {
            for (const [key, el] of pool) {
              const idx = Number(key);
              if (idx < firstIndex || idx > lastIndex) {
                el.remove();
                pool.delete(key);
              }
            }
          }

          for (let i = firstIndex; i <= lastIndex; i++) {
            if (i < 0 || i >= total) continue;
            const key = String(i);
            if (pool.has(key)) continue;

            const item = items[i];
            const col = i % cols;
            const row = Math.floor(i / cols);
            const startX = 0; // align with filters/categories grid (no centering)
            const x = isGrid ? startX + col * (gridCardW + gap) : startX;
            const y = row * rowStride;

            const el = isGrid ? renderCard(item) : renderRow(item);
            el.style.position = "absolute";
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.width = `${isGrid ? gridCardW : wrapW}px`;
            el.style.height = `${cardH}px`;

            spacer.appendChild(el);
            pool.set(key, el);
            // Keep playlist add-buttons in sync for newly mounted nodes
            updateLibraryPlaylistButtons();
          }
        }

        // Throttle renderViewport using requestAnimationFrame
        let renderTimer = null;
        function scheduleRenderViewport() {
          if (renderTimer) return;
          renderTimer = requestAnimationFrame(() => {
            renderViewport();
            renderTimer = null;
          });
        }
        
        // Only add scroll listener for large datasets that use virtualization
        if (!useFullRender) {
          if (useExternalScroller && state.library.virtualScrollHandler) {
            scroller.removeEventListener('scroll', state.library.virtualScrollHandler);
          }
          scroller.addEventListener("scroll", scheduleRenderViewport, { passive: true });
          if (useExternalScroller) {
            state.library.virtualScrollHandler = scheduleRenderViewport;
          }
        }
        window.addEventListener("resize", () => mountVirtualizer(false), { once: true });

        renderViewport();
        if (resetScroll) scroller.scrollTop = 0;
        
        // Check auth and show delete buttons for authorized users
        setTimeout(() => checkAuthAndShowActions(), 100);
      }

          canDelete ? { key: 'delete', label: 'Löschen', sub: 'PDF dauerhaft entfernen', icon: SVG_TRASH_MINI, destructive: true } : null
        ].filter(Boolean);

        if (!actions.length) return;

        const backdrop = document.createElement('div');

        backdrop.innerHTML = `
          <div class="mobile-action-sheet" role="dialog" aria-modal="true" aria-label="Aktionen für ${escapeHtml(displayName)}">

              ${actions.map((act) => `
                <button type="button" class="sheet-btn ${act.destructive ? 'destructive' : ''} ${act.active ? 'is-active' : ''}" data-action="${act.key}">
                  <span class="sheet-icon">${act.icon}</span>
                  <div class="sheet-labels">
                    <div class="sheet-label">${escapeHtml(act.label)}</div>
                    ${act.sub ? `<div class="sheet-sublabel">${escapeHtml(act.sub)}</div>` : ''}
                  </div>
                </button>
              `).join('')}
            </div>
          </div>
        `;
        const sheet = backdrop.querySelector('.mobile-action-sheet');
        const handleEl = sheet?.querySelector('.sheet-handle') || sheet;
        let dragStartY = null;
        let lastDragDelta = 0;
        let dragStartTime = 0;

        const cleanupSheetListeners = () => {
          handleEl?.removeEventListener('touchstart', onTouchStart);
          handleEl?.removeEventListener('touchmove', onTouchMove);
          handleEl?.removeEventListener('touchend', onTouchEnd);
        };

        const onTouchStart = (ev) => {
          // Nicht swipen starten, wenn auf einen Aktions-Button getippt wird
          if (ev.target?.closest('.sheet-actions button')) return;
          const t = ev.touches?.[0];
          if (!t) return;
          dragStartY = t.clientY;
          lastDragDelta = 0;
          dragStartTime = Date.now();
          if (sheet) sheet.style.transition = 'none';
          ev.preventDefault();
        };

        const onTouchMove = (ev) => {
          if (dragStartY === null) return;
          const t = ev.touches?.[0];
          if (!t) return;
          const delta = Math.max(0, t.clientY - dragStartY);
          lastDragDelta = delta;
          if (sheet) sheet.style.transform = `translateY(${delta}px)`;
          if (delta > 0) ev.preventDefault();
        };

        const onTouchEnd = () => {
          if (dragStartY === null) return;
          const duration = Date.now() - dragStartTime;
          const shouldClose = lastDragDelta > 80 || (lastDragDelta > 40 && duration < 220);
          dragStartY = null;
          lastDragDelta = 0;
          if (sheet) {
            sheet.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
            sheet.style.transform = '';
          }
          if (shouldClose) close();
        };

        handleEl?.addEventListener('touchstart', onTouchStart, { passive: false });
        handleEl?.addEventListener('touchmove', onTouchMove, { passive: false });
        handleEl?.addEventListener('touchend', onTouchEnd);

        document.body.appendChild(backdrop);
        requestAnimationFrame(() => backdrop.classList.add('open'));

        const close = () => {
          backdrop.classList.remove('open');
          backdrop.classList.add('closing');
          setTimeout(() => backdrop.remove(), 180);
          document.removeEventListener('keydown', onKeyDown);
          cleanupSheetListeners();
          mobileActionSheetCleanup = null;
        };
        const onKeyDown = (ev) => {
          if (ev.key === 'Escape') {
            ev.preventDefault();
            close();
          }
        };

        mobileActionSheetCleanup = close;

        document.addEventListener('keydown', onKeyDown);
        backdrop.addEventListener('click', (ev) => {
          if (ev.target === backdrop) {
            close();
          }
        });

        const syncFavorites = (active) => {
          document.querySelectorAll(`[data-item-name="${cssEscape(item.name)}"] .fav`).forEach((btn) => {
            setFavVisual(btn, active);
            btn.setAttribute('aria-pressed', String(active));
          });
        };

        backdrop.querySelectorAll('[data-action]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const action = btn.getAttribute('data-action');
            close();
            try {
              switch (action) {
                case 'open':
                  acquireWakeLockSync();
                  history.replaceState(null, '', `/?file=${item.id}`);
                  renderViewer(item.name);
                  break;
                case 'favorite': {
                  const makeFav = !state.library.favorites.has(item.name);
                  try {
                    await setFavoriteOnBackend(item.name, makeFav);
                    if (makeFav) state.library.favorites.add(item.name);
                    else state.library.favorites.delete(item.name);
                    syncFavorites(makeFav);
                    updateFavoritesChipCounter();
                  } catch (err) {
                    console.error('Favoriten-Update fehlgeschlagen', err);
                    syncFavorites(state.library.favorites.has(item.name));
                  }
                  break;
                }
                case 'playlist':
                  openPlaylistAssignmentDialog(item.name);
                  break;
                case 'assign':
                  openCategoryAssignDialog(item);
                  break;
                case 'share':
                  await openShareDialog(item);
                  break;
                case 'remove-shared':
                  await confirmAndRemoveSharedDocument(item);
                  break;
                case 'delete':
                  await confirmAndDeletePdf(item);
                  break;
              }
            } catch (err) {
              console.error('Aktion fehlgeschlagen', err);
            }
          });
        });
      }

        a.addEventListener('pointermove', (ev) => {

                if (!touchList || id === null) return null;

                  p = p.parentElement;

              const scrollEl = getScrollContainer(container);

              const computeOrder = () => Array.from(container.querySelectorAll('[data-item-name]')).map((el) => el.getAttribute('data-item-name'));

                const rows = Array.from(container.querySelectorAll('[data-item-name]'));
                rows.forEach((rowEl, index) => {

                    btn.setAttribute('data-item-index', String(index));

                const currentPlaylist = playlist.byId.get(playlistId);

                container.querySelectorAll('[data-item-name]').forEach((rowEl, idx) => {
                  const isRowActive = isActive && idx === activeIndex;

                  if (clientY < rect.top + rect.height / 2) {

                placeholder.style.marginBottom = style.marginBottom;

                ghost.style.position = 'fixed';
                ghost.style.left = '0px';
                ghost.style.top = '0px';

                ghost.style.height = `${rect.height}px`;
                ghost.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0)`;
                ghost.style.pointerEvents = 'none';

                const itemName = row.getAttribute('data-item-name') || '';

                container.insertBefore(placeholder, row.nextElementSibling);
                row.classList.add('is-dragging-source');
                row.remove();

                drag = {
                  pointerId: ev.pointerId,
                  row,
                  ghost,
                  placeholder,
                  offsetX: ev.clientX - rect.left,
                  offsetY: ev.clientY - rect.top,
                  frame: null,
                  pending: null,
                  originalIndex: Number(row.getAttribute('data-item-index') ?? '0'),
                  initialOrder,
                  itemName,
                  targetIndex: placeholderIndex()
                };

                container.classList.add('is-dragging');
                positionGhost(ev.clientX, ev.clientY);
                try { if (navigator.vibrate) navigator.vibrate(10); } catch {}
              };

                if (cancelled) {

                  const order = drag.initialOrder;
                  const nodes = new Map();
                  container.querySelectorAll('[data-item-name]').forEach((node) => {
                    nodes.set(node.getAttribute('data-item-name'), node);

                  row.classList.remove('is-dragging-source');
                  order.forEach((name) => {
                    const node = nodes.get(name);

                  updateDomIndices();
                  refreshActiveStates();
                  container.classList.remove('is-dragging');

                  return;

                container.insertBefore(row, placeholder);
                placeholder.remove();
                row.classList.remove('is-dragging-source');

                updateDomIndices();
                const newOrder = computeOrder();

                const prev = drag.initialOrder;
                let orderChanged = newOrder.length !== prev.length;
                if (!orderChanged) {
                  for (let i = 0; i < newOrder.length; i++) {
                    if (newOrder[i] !== prev[i]) {
                      orderChanged = true;
                      break;
                    }
                  }
                }

                if (orderChanged) {
                  const currentPlaylist = playlist.byId.get(playlistId);
                  const itemName = drag.itemName;
                  const originalIndex = drag.originalIndex;
                  const newIndex = newOrder.indexOf(itemName);

                  if (currentPlaylist) {
                    currentPlaylist.items = newOrder.slice();
                    if (playlistId === playlist.activeId) {
                      playlist.items = newOrder.slice();
                    }
                    if (isActive && Number.isInteger(currentPlaylist.currentIndex)) {
                      if (currentPlaylist.currentIndex === originalIndex) {
                        currentPlaylist.currentIndex = newIndex;
                      } else if (currentPlaylist.currentIndex > originalIndex && currentPlaylist.currentIndex <= newIndex) {
                        currentPlaylist.currentIndex -= 1;
                      } else if (currentPlaylist.currentIndex < originalIndex && currentPlaylist.currentIndex >= newIndex) {
                        currentPlaylist.currentIndex += 1;
                      }

                finishDrag(ev, false);
              };

                if (drag) return;
                const row = ev.target.closest && ev.target.closest('[data-item-name]');
                if (!row) return;
                if (ev.target.closest(interactiveSelector)) return;

                longPressStart = { x: touch.clientX, y: touch.clientY };

                if (handle) {

                  return;

                  const point = lastTouchPoint || longPressStart;
                  if (!point) return;
                  beginDrag({ pointerId: activeTouchId, clientX: point.x, clientY: point.y }, longPressRow);

                if (activeTouchId === null) return;
                const touch = findTouchById(ev.touches, activeTouchId);
                if (!touch) return;
                lastTouchPoint = { x: touch.clientX, y: touch.clientY };

                    const dy = Math.abs(touch.clientY - longPressStart.y);

                }

      // ===== Thumbnails (lazy + concurrency limit + memory management) =====
      function cleanupThumbnailCache() {
        const now = Date.now();
        if (now - state.thumbs.lastCleanup < 30000) return; // Clean every 30s max
        state.thumbs.lastCleanup = now;
        
        if (state.thumbs.cache.size <= state.thumbs.maxCacheSize) return;
        
        // Remove oldest entries (LRU-style cleanup)
        const entries = Array.from(state.thumbs.cache.entries());
        const excess = entries.length - state.thumbs.maxCacheSize;
        const toDelete = entries.slice(0, excess);
        
        toDelete.forEach(([key, canvas]) => {
          if (canvas) {
            const ctx = canvas.getContext('2d');
            if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = canvas.height = 0;
          }
          state.thumbs.cache.delete(key);
        });
        
        console.log(`Cleaned ${excess} thumbnails from cache`);
      }
      
      // ===== Check Document Access Rights =====
      async function checkDocumentAccessRights(fileName) {
        try {
          const response = await fetch(`/api/share/info?name=${encodeURIComponent(fileName)}`, {
            credentials: 'include'
          });
          
          if (!response.ok) {
            return { accessRole: null, canEdit: false };
          }
          
          const shareInfo = await response.json();
          const canEdit = shareInfo.accessRole === 'owner';
          
          return {
            accessRole: shareInfo.accessRole,
            canEdit,
            sharedBy: shareInfo.sharedBy
          };
        } catch (error) {
          console.error('Failed to check access rights:', error);
          return { accessRole: null, canEdit: false };
        }
      }

            const scrollLeft = targetContainer.scrollLeft;
            if (touches.length < 2) return pinchState.focal;
            const centerX = (touches[0].clientX + touches[1].clientX) / 2;
            const centerY = (touches[0].clientY + touches[1].clientY) / 2;
            const offsetYRaw = centerY - viewerRect.top;
            const offsetXRaw = centerX - viewerRect.left;
            const offsetY = Math.max(0, Math.min(viewerRect.height, offsetYRaw));
            const offsetX = Math.max(0, Math.min(viewerRect.width, offsetXRaw));

              viewportOffsetY: offsetY,
              contentX: scrollLeft + offsetX,
              viewportOffsetX: offsetX

              pinchState.initialDistance = getDistance(e.touches[0], e.touches[1]);
              pinchState.initialZoom = state.viewer.zoomPreview ?? state.viewer.zoom;

              pinchState.lastZoom = pinchState.initialZoom;

          S.userActiveUntil = now() + 2000; // generous window updated on events

          S.userActiveUntil = t + grace;

          S.lastTs = t;
