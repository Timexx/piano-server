<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Piano Sheets</title>
    <link rel="icon" href="/icon-maskable.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/icon-maskable.svg" type="image/svg+xml">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Piano Sheets">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PDF.js & Fuse.js (local, served by server.js) -->
    <script src="/vendor/pdfjs/pdf.min.js" defer></script>
    <script src="/vendor/fuse.min.js" defer></script>
  <script src="/vendor/nosleep.min.js" defer></script>
  <script src="/jump-markers.js" defer></script>
  <script src="/auth-status.js" defer></script>

    <style>
      :root {
        color-scheme: light dark;
        --surface-0: #050506;
        --surface-1: #0b0b0c;
        --surface-2: #111114;
        --accent-color: #6366F1;
        --accent-soft: rgba(99, 102, 241, 0.16);
        --accent-muted: rgba(99, 102, 241, 0.35);
        --accent-contrast: #F9FAFB;
      }
      html, body { height: 100%; }
      body {
        background: linear-gradient(145deg, color-mix(in srgb, var(--accent-color) 8%, var(--surface-0)) 0%, var(--surface-0) 55%, var(--surface-1) 100%);
        transition: background 0.4s ease;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      main#app {
        flex: 1 1 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .vh { height: 100vh; height: 100dvh; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  /* iOS smoother programmatic scrolling */
  #viewer { -webkit-overflow-scrolling: touch; }
      .card:hover { transform: translateY(-2px); }
      .tap-highlight-none { -webkit-tap-highlight-color: rgba(0,0,0,0); }
      /* iOS/iPad safe-area handling + fullscreen fixes */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      /* Controls bar: keep clear of Home indicator */
      #controls { padding-bottom: var(--sab); }
      /* In fullscreen hide header and add top/bottom safe padding to viewer */
      html.is-fs header { 
        display: none !important; 
      }
      
      html.is-fs #viewerContent {
        padding: var(--sat) 0 calc(var(--sab) + 80px) 0;
      }
      
      html.is-fs #viewerPdfContainer {
        border-radius: 0;
        border: none;
      }
      
      html.is-fs #controls {
        background: transparent;
      }
      
      html.is-fs .control-panel {
        background: linear-gradient(135deg, 
          color-mix(in srgb, var(--accent-color) 10%, rgba(12, 12, 18, 0.98)) 0%, 
          color-mix(in srgb, var(--accent-color) 5%, rgba(8, 8, 12, 0.98)) 100%);
        border: 1px solid color-mix(in srgb, var(--accent-color) 30%, rgba(255, 255, 255, 0.12));
        box-shadow: 
          0 24px 48px -12px rgba(0, 0, 0, 0.7),
          0 0 32px -8px color-mix(in srgb, var(--accent-color) 25%, transparent);
      }
      
      /* Active accent color effect on header */
      body[data-accent-active="true"] #mainHeader > div {
        border-color: var(--accent-muted) !important;
        background: linear-gradient(to bottom,
          color-mix(in srgb, var(--accent-color) 12%, rgba(12,12,15,0.95)),
          color-mix(in srgb, var(--accent-color) 8%, rgba(12,12,15,0.90)),
          color-mix(in srgb, var(--accent-color) 6%, rgba(12,12,15,0.85))
        ) !important;
      }
      
      .category-pill {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
      }
      .category-pill:hover {
        transform: translateY(-1px) scale(1.02);
        box-shadow: 0 4px 12px -4px rgba(0,0,0,0.4);
      }
      .category-pill:active {
        transform: translateY(0) scale(0.98);
      }
      .category-pill.is-selected {
        box-shadow: 0 0 0 2px rgba(250, 250, 255, 0.25);
      }
      
      /* Manage Categories Button */
      #btnManageCategories {
        min-width: 36px; /* Ensure icon-only button is square on mobile */
      }
      
      #btnManageCategories svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      
      .category-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.75rem;
        padding: 0.15rem 0.55rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        text-shadow: 0 1px 1px rgba(0,0,0,0.25);
      }
      .badge-stack {
        max-height: 4.5rem;
        overflow: hidden;
        position: relative;
        padding-bottom: 0.35rem;
      }
      .badge-stack::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 28px;
        background: linear-gradient(to bottom, rgba(9,9,12,0) 0%, rgba(9,9,12,0.9) 100%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .badge-stack.is-overflowing::after {
        opacity: 1;
      }
      .glass-panel {
        backdrop-filter: blur(28px);
        background: rgba(15, 15, 21, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        box-shadow: 0 24px 48px -32px rgba(0, 0, 0, 0.65);
      }
      /* Music Card Collection */
      .music-card {
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        background: linear-gradient(160deg, var(--card-accent, var(--accent-color)) 0%, color-mix(in srgb, var(--card-accent, var(--accent-color)) 20%, #000) 100%);
        box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.6);
        transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
        cursor: pointer;
      }
      .music-card:hover { transform: translateY(-4px); box-shadow: 0 18px 36px -12px rgba(0, 0, 0, 0.7); }
      .music-card .card-bg {
        width: 100%;
        height: 220px;
        object-fit: cover;
        filter: brightness(0.9);
        display: block;
      }
      @media (min-width: 640px) { .music-card .card-bg { height: 240px; } }
      .music-card:hover .card-bg { filter: brightness(1.03); }
      .music-card .card-overlay {
        position: absolute; inset: auto 0 0 0;
        padding: 1rem;
        background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%);
        text-align: center;
      }
      .music-card .card-title { font-weight: 600; font-size: 1rem; color: #fff; }
      .music-card .card-subtitle { font-size: 0.875rem; color: rgba(255,255,255,0.82); }
      .music-card .icon-btn {
        height: 36px; width: 36px;
        display: grid; place-items: center;
        border-radius: 9999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.14);
        color: #e5e7eb;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
      }
      .music-card .icon-btn svg {
        display: block;
        margin: 0 auto;
      }
      .music-card .icon-btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.26); }
      .music-card .icon-btn:active { transform: translateY(1px); }
      .music-card .card-actions { margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
      /* Ensure all SVGs in buttons with grid place-items-center are perfectly centered */
      button.grid.place-items-center svg {
        display: block;
        margin: 0 auto;
      }
  /* Ensure favorite star on cards turns yellow when active */
  .music-card .icon-btn.fav.text-yellow-400 { color: #facc15; }
  .music-card .icon-btn.fav.text-neutral-300 { color: #d1d5db; }
      .music-card .icon-btn.offline-active {
        background: rgba(34, 197, 94, 0.18);
        border-color: rgba(134, 239, 172, 0.55);
        color: #bbf7d0;
      }
      .music-card .icon-btn.offline-active:hover {
        background: rgba(34, 197, 94, 0.25);
        border-color: rgba(134, 239, 172, 0.8);
      }
      .badge-offline {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #22c55e;
        color: #0f172a;
        border-radius: 999px;
        padding: 0 0.4rem;
        font-size: 0.65rem;
        font-weight: 700;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
      }
      .offline-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 0.55rem;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.18);
        border: 1px solid rgba(34, 197, 94, 0.35);
        color: #bbf7d0;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      
      /* Playlist Card Hover Effects - Glassmorphism */
      .playlist-card {
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }
      
      .playlist-card::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 0.75rem;
        padding: 1px;
        background: linear-gradient(135deg, 
          rgba(255, 255, 255, 0.1), 
          rgba(255, 255, 255, 0.05)
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      
      .playlist-card:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 
          0 20px 40px -16px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      
      .playlist-card:hover::before {
        opacity: 1;
      }
      
      .playlist-card:hover .playlist-card-bg {
        backdrop-filter: blur(32px);
      }
      
      .playlist-card:active {
        transform: translateY(-2px) scale(1.01);
      }
      
      /* Enhance playlist card buttons on card hover */
      .playlist-card:hover .playlist-play-btn,
      .playlist-card:hover .playlist-edit-btn {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }
      
      .offline-dot {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 999px;
        background: currentColor;
        display: inline-flex;
      }
      .btn-offline {
        position: relative;
      }
      .btn-offline[disabled] {
        opacity: 0.6;
      }
      .offline-spinner {
        width: 1.1rem;
        height: 1.1rem;
        animation: spin 0.9s linear infinite;
      }
      #libraryPager {
        background: linear-gradient(180deg, rgba(9,9,12,0.85) 0%, rgba(9,9,12,0.93) 100%);
        border-top: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 -12px 30px -16px rgba(0,0,0,0.7);
        padding: 1.5rem 0;
        min-height: 80px; /* Ensure minimum touchable height on iPad */
        padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px)); /* Account for iOS safe area */
      }
      @media (max-width: 540px) {
        #libraryPager { 
          padding: 1.25rem 0;
          padding-bottom: calc(1.75rem + env(safe-area-inset-bottom, 0px));
        }
        .filter-toggle {
          display: inline-flex;
        }
      }
      .filter-toggle {
        display: none;
        align-items: center;
        gap: 0.35rem;
        padding: 0.45rem 0.75rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(17,17,23,0.6);
        color: #e5e7eb;
        font-size: 0.85rem;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .filter-toggle:hover {
        background: rgba(24,24,32,0.75);
        border-color: rgba(255,255,255,0.2);
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(6, 6, 9, 0.68);
        backdrop-filter: blur(18px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 80;
        padding: 1.25rem;
      }
      /* ===== HEADER STYLES - Modern & Elegant ===== */
      #mainHeader {
        will-change: transform;
        transition: transform 300ms cubic-bezier(0.4, 0.0, 0.2, 1);
      }
      
      #mainHeader.header-hidden {
        transform: translateY(-100%) !important;
      }
      
      #headerSpacer {
        height: 64px; /* Default desktop height */
        transition: height 200ms cubic-bezier(0.4, 0.0, 0.2, 1), margin 200ms cubic-bezier(0.4, 0.0, 0.2, 1);
        flex-shrink: 0;
        overflow: hidden;
      }
      
      /* Safari-specific fixes */
      @supports (-webkit-touch-callout: none) {
        #mainHeader {
          -webkit-transform: translateZ(0);
          transform: translateZ(0);
        }
        
        #headerSpacer {
          -webkit-backface-visibility: hidden;
          backface-visibility: hidden;
        }
        
        #app {
          -webkit-font-smoothing: antialiased;
        }
      }
      
      #headerUploadBtn {
        display: inline-flex !important;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        height: 40px;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #ffffff;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.16) 0%, rgba(99, 102, 241, 0.12) 100%);
        border: 1px solid rgba(99, 102, 241, 0.35);
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0.0, 0.2, 1);
        white-space: nowrap;
        box-shadow: 0 2px 8px -2px rgba(99, 102, 241, 0.2);
      }
      #headerUploadBtn:hover {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.28) 0%, rgba(99, 102, 241, 0.22) 100%);
        border-color: rgba(99, 102, 241, 0.55);
        transform: translateY(-1px) scale(1.02);
        box-shadow: 
          0 4px 12px -2px rgba(99, 102, 241, 0.35),
          0 0 0 1px rgba(99, 102, 241, 0.2);
      }
      #headerUploadBtn:active {
        transform: translateY(0) scale(0.98);
      }
      #headerUploadBtn svg {
        width: 16px;
        height: 16px;
        opacity: 0.9;
        flex-shrink: 0;
      }
      #headerUploadBtn:hover svg {
        opacity: 1;
      }
      
      /* Enhanced Mode Switcher */
      #headerModeSwitch {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 0.75rem !important;
        padding: 0.25rem !important;
        box-shadow: 
          inset 0 1px 2px rgba(0, 0, 0, 0.2),
          0 2px 8px -2px rgba(0, 0, 0, 0.15);
      }
      
      #headerModeSwitch button {
        font-weight: 600 !important;
        letter-spacing: -0.01em;
        border-radius: 0.5rem !important;
        padding: 0.5rem 1rem !important;
        transition: all 0.25s cubic-bezier(0.4, 0.0, 0.2, 1) !important;
      }
      
      #headerModeSwitch button:hover:not([aria-pressed="true"]) {
        background: rgba(255, 255, 255, 0.05) !important;
      }
      
      #headerModeSwitch button[aria-pressed="true"] {
        box-shadow: 
          0 2px 8px -2px rgba(99, 102, 241, 0.4),
          0 0 0 1px rgba(99, 102, 241, 0.2) !important;
      }
      @media (max-width: 768px) {
        #app {
          padding-top: 0.5rem !important; /* 8px on tablets - tighter */
        }
        
        /* Smaller header on tablets */
        #mainHeader .mx-auto {
          height: 56px;
        }
        
        #headerSpacer {
          height: 56px !important;
        }
        
        .glass-panel { width: 92vw; }
      }

      /* ===== VIEWER MODE STYLES ===== */
      body.in-viewer {
        background: linear-gradient(145deg, #050506 0%, #0a0a0b 100%);
      }
      
      /* Hide header completely in viewer mode for maximum space */
      body.in-viewer #mainHeader {
        display: none !important;
      }
      
      body.in-viewer #headerSpacer {
        display: none !important;
      }
      
      #viewerShell {
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 0;
      }
      
      #viewerContent {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 0;
        padding-bottom: 0;
      }
      
      #viewerPdfContainer {
        flex: 1;
        min-height: 0;
        position: relative;
        border-radius: 0;
        overflow: hidden;
        background: transparent;
        backdrop-filter: none;
        border: none;
        box-shadow: none;
      }
      
      #viewer {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }
      
      /* PDF Page Styling */
      #viewer canvas {
        border-radius: 16px;
        box-shadow: 
          0 20px 40px -12px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.05);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      
      #viewer canvas:hover {
        transform: translateY(-2px);
        box-shadow: 
          0 24px 48px -12px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      
      [data-role="page-label"] {
        font-size: 0.75rem;
        color: #6b7280;
        margin-bottom: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.025em;
      }

      .viewer-page {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }
      .viewer-page-stage {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .viewer-page-frame {
        position: relative;
        width: 100%;
        max-width: 1400px;
      }
      .viewer-page-frame canvas[data-role="pdf-canvas"] {
        display: block;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 
          0 20px 40px -12px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.05);
      }
      .annotation-layer,
      .annotation-committed {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        touch-action: none;
      }
      .annotation-layer.is-active {
        pointer-events: auto;
        cursor: crosshair;
      }
      .annotation-tool-btn {
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        border-radius: 9px;
        padding: 0.3rem 0.5rem;
        color: #e5e7eb;
        font-size: 0.88rem;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .annotation-tool-btn[aria-pressed="true"] {
        background: rgba(99, 102, 241, 0.18);
        border-color: rgba(99, 102, 241, 0.45);
        color: #f8fafc;
      }
      .annotation-tool-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .annotation-color-btn {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        background: var(--annotation-color, #f1f5f9);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25) inset;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .annotation-color-btn:hover {
        transform: translateY(-1px);
      }
      .annotation-color-btn[aria-pressed="true"] {
        border-color: #ffffff;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.4);
      }
      .annotation-size {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.75rem;
        color: #cbd5f5;
      }
      .annotation-size input[type="range"] {
        width: 118px;
        accent-color: var(--accent-color);
      }
      .annotation-size span {
        min-width: 1.5rem;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .annotation-toggle-active {
        background: linear-gradient(135deg, var(--accent-color) 0%, color-mix(in srgb, var(--accent-color) 80%, #000) 100%) !important;
        border-color: color-mix(in srgb, var(--accent-color) 80%, rgba(255, 255, 255, 0.35)) !important;
        color: #ffffff !important;
      }
      .annotation-layer.is-saving {
        cursor: progress;
      }
      .annotation-layer.is-disabled {
        opacity: 0.75;
      }
      
      [data-role="skeleton"] {
        border-radius: 16px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.02) 0%,
          rgba(255, 255, 255, 0.05) 50%,
          rgba(255, 255, 255, 0.02) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 2s ease-in-out infinite;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      /* Loading State */
      .viewer-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 400px;
        gap: 1.5rem;
        padding: 3rem;
      }
      
      .viewer-loading-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: var(--accent-color);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes slideUp {
        from {
          opacity: 0;

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('✅ Service Worker registered:', registration.scope);
              
              // Update verfügbar
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Neuer Service Worker verfügbar
                    if (confirm('Neue Version verfügbar! Jetzt aktualisieren?')) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                      window.location.reload();
                    }
                  }
                });
              });
            })
            .catch((error) => {
              console.warn('❌ Service Worker registration failed:', error);
            });
          
          // Reload wenn neuer SW aktiviert wird
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }

  const $ = (sel, el = document) => el.querySelector(sel);
  const encodePathSegments = (rel) => rel.split('/').map(encodeURIComponent).join('/');
  const cssEscape = (value) => {
        if (window.CSS && typeof window.CSS.escape === 'function') {
          return window.CSS.escape(value);
        }
        return String(value ?? '').replace(/([\0-\x1F\x7F"'\\\[\]\{\}<>#%&*,./:;=?@`|~\s])/g, '\\$1');
      };

      const controlsEl = document.querySelector('#controls');
      const headerActionsEl = document.querySelector('#header-actions');
  let uploadBtn = null;

      const ZOOM_STORAGE_KEY = "viewer.zoom";
      const MIN_ZOOM = 0.6;
      const MAX_ZOOM = 2.0;
      const ZOOM_STEP = 0.05;

      const zoomControls = {
        slider: document.querySelector('#zoomSlider'),
        display: document.querySelector('#zoomDisplay'),
        btnIn: document.querySelector('#btnZoomIn'),
        btnOut: document.querySelector('#btnZoomOut'),
        btnReset: document.querySelector('#btnZoomReset')
      };

      function clampZoom(value) {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) return 1;
        const clamped = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, numeric));
        const snapped = Math.round(clamped / ZOOM_STEP) * ZOOM_STEP;
        return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, Math.round(snapped * 100) / 100));
      }

      function loadStoredZoom() {
        const saved = Number(localStorage.getItem(ZOOM_STORAGE_KEY));
        if (!Number.isFinite(saved)) return 1;
        return clampZoom(saved);
      }

      function persistZoom(value) {
        try { localStorage.setItem(ZOOM_STORAGE_KEY, value.toFixed(2)); } catch {}
      }

      function zoomToPercent(value) {
        return Math.round(clampZoom(value) * 100);
      }

      function percentToZoom(percent) {
        return clampZoom(Number(percent) / 100);
      }

        const getHeaderHeight = () => {
          if (window.innerWidth <= 380) return 48;
          if (window.innerWidth <= 640) return 52;
          if (window.innerWidth <= 768) return 56;
          return 64;
        };
        
        // Set initial height
        headerSpacer.style.height = getHeaderHeight() + 'px';
        
        // Update on resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(() => {
            if (!headerSpacer.classList.contains('hidden')) {
              headerSpacer.style.height = getHeaderHeight() + 'px';

      function checkMemoryPressure() {
        const now = Date.now();
        if (now - state.memory.lastCheck < state.memory.checkInterval) return;
        state.memory.lastCheck = now;
        
        try {
          // Use performance.memory if available (Chrome/Edge)
          if (performance.memory) {
            const { usedJSHeapSize, totalJSHeapSize } = performance.memory;
            const memoryUsage = usedJSHeapSize / totalJSHeapSize;
            state.memory.isLowMemory = memoryUsage > 0.8; // 80% threshold
            
            if (state.memory.isLowMemory) {
              console.warn('High memory usage detected:', Math.round(memoryUsage * 100) + '%');
              aggressiveCleanup();
            }
          }
        } catch (e) {
          // Fallback: assume low memory on iPad/mobile after extended use
          const isTouch = 'ontouchstart' in window;
          if (isTouch && state.thumbs.cache.size > 20) {
            state.memory.isLowMemory = true;
            aggressiveCleanup();
          }
        }

      function aggressiveCleanup() {
        console.log('Performing aggressive memory cleanup...');
        
        // Clear offscreen canvases in viewer
        const container = document.querySelector('#viewer');
        if (container) {
          const canvases = container.querySelectorAll('canvas');
          canvases.forEach((canvas, index) => {
            const rect = canvas.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const isVisible = rect.bottom > containerRect.top && rect.top < containerRect.bottom;
            
            // Keep only visible canvases and a few around them
            if (!isVisible && index > 5) {
              const ctx = canvas.getContext('2d');
              if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
              canvas.width = canvas.height = 0;
              canvas.remove();
            }
          });
        }
        
        // Force garbage collection if available
        if (window.gc) {
          try { window.gc(); } catch (e) {}
        }
      }

      function armWakeLockFromGestures(rootEl = document) {
        const once = async () => {
          await acquireWakeLockAuto();
          window.removeEventListener('pointerdown', once);
          window.removeEventListener('keydown', once);
          rootEl.removeEventListener?.('touchstart', once);
          rootEl.removeEventListener?.('pointerdown', once);

        window.addEventListener('pointerdown', once, { once: true });

        rootEl.addEventListener?.('touchstart', once, { once: true, passive: true });

      async function acquireWakeLockAuto() {
        // Prefer Screen Wake Lock API
        try {
          if ('wakeLock' in navigator) {
            if (!state.viewer.wakeLock) {
              state.viewer.wakeLock = await navigator.wakeLock.request('screen');
              state.viewer.wakeLock.addEventListener?.('release', () => {
                state.viewer.wakeLock = null;
                setWakeBtn(false);
                if (document.body.classList.contains('in-viewer')) {
                  // try to re-acquire silently
                  acquireWakeLockAuto();
                }
              });
            }
            if (state.viewer.wakeDesired) setWakeBtn(true);
            return true;
          }
        } catch (e) {
          console.warn('WakeLock.request failed', e);
        }
        // Fallback: NoSleep.js (must be created from a user gesture on iOS)
        try {
          if (!state.viewer.noSleep && window.NoSleep) {
            state.viewer.noSleep = new window.NoSleep();
          }
          if (state.viewer.noSleep && !state.viewer.noSleepEnabled) {
            state.viewer.noSleep.enable(); // may throw if not from gesture on iOS
            state.viewer.noSleepEnabled = true;
            if (state.viewer.wakeDesired) setWakeBtn(true);
            return true;
          }
        } catch (e) {
          console.warn('NoSleep.enable failed (needs user gesture on iOS)', e);
        }
        return false;

      // Synchrone Wake Lock Aktivierung für iOS/iPad - MUSS im Click-Handler aufgerufen werden
      function acquireWakeLockSync() {

        try {
          if (!state.viewer.noSleep && window.NoSleep) {
            state.viewer.noSleep = new window.NoSleep();
          }
          if (state.viewer.noSleep && !state.viewer.noSleepEnabled) {
            state.viewer.noSleep.enable();
            state.viewer.noSleepEnabled = true;
            if (state.viewer.wakeDesired) setWakeBtn(true);
          }
        } catch (e) {
          console.warn('NoSleep sync activation failed', e);
        }
        // Wake Lock API async im Hintergrund
        if ('wakeLock' in navigator && !state.viewer.wakeLock) {
          navigator.wakeLock.request('screen').then(lock => {
            state.viewer.wakeLock = lock;
            lock.addEventListener?.('release', () => {

      async function runPdfPageRefresh() {
        if (pdfRefreshState.running) {
          pdfRefreshState.timer = window.setTimeout(runPdfPageRefresh, 160);
          return;
        }

        pdfRefreshState.timer = null;

        const pendingPages = Array.from(pdfRefreshState.pages).sort((a, b) => a - b);
        const requiresUpdate = pendingPages.length > 0 || pdfRefreshState.needsDocRefresh;
        if (!requiresUpdate) return;

        const fileName = state.viewer.fileName;
        const bustToken = pdfRefreshState.token || (state.viewer.cacheToken ?? Date.now());
        if (!fileName) {
          resetPdfRefreshState();
          return;
        }

        pdfRefreshState.running = true;

        try {
          const urlBase = `/sheets/${encodePathSegments(fileName)}`;
          if (pdfRefreshState.needsDocRefresh) {
            state.viewer.cacheToken = bustToken;
            await preloadPdfDocument(`${urlBase}?v=${bustToken}`);
            await renderViewer(fileName, { bustToken });
          } else if (pendingPages.length) {
            await refreshPdfPages(fileName, pendingPages, { bustToken });
          }
        } catch (err) {
          console.warn('PDF refresh failed', err);
        } finally {
          const hasMore = pdfRefreshState.pages.size || pdfRefreshState.needsDocRefresh;
          pdfRefreshState.pages.clear();
          pdfRefreshState.needsDocRefresh = false;
          pdfRefreshState.token = null;
          pdfRefreshState.running = false;
          if (pdfRefreshState.timer) {
            clearTimeout(pdfRefreshState.timer);
            pdfRefreshState.timer = null;
          }
          if (hasMore) {
            pdfRefreshState.timer = window.setTimeout(runPdfPageRefresh, 200);
          }
        }

      async function sendMessageToServiceWorker(type, payload = {}) {
        if (!state.offline.supported) {
          throw new Error('Service Worker not available');
        }
        let registration;
        try {
          registration = await navigator.serviceWorker.ready;
        } catch (err) {
          throw new Error('Service Worker not ready');
        }
        const target = navigator.serviceWorker.controller || registration.active;
        if (!target) {
          throw new Error('Service Worker controller unavailable');
        }
        return new Promise((resolve, reject) => {
          const channel = new MessageChannel();
          const timeout = window.setTimeout(() => {
            channel.port1.close();
            reject(new Error('Service Worker response timeout'));
          }, 12000);
          channel.port1.onmessage = (event) => {
            window.clearTimeout(timeout);
            resolve(event.data || {});
          };
          try {
            target.postMessage({ ...payload, type }, [channel.port2]);
          } catch (err) {
            window.clearTimeout(timeout);
            reject(err);
          }
        });

      function offlineResourceUrlsForItem(item) {
        if (!item || !item.name) return [];

          `/api/prefs/file?name=${encodeURIComponent(item.name)}`,

      function updateOfflineButtonAppearance(btn, rel) {
        if (!btn) return;
        const busy = btn.dataset.offlineBusy === '1';
        const name = rel || btn.dataset.offlineName || '';
        if (!state.offline.supported) {

        const isCached = state.offline.cached.has(name);
        const controllerReady = state.offline.workerReady || !!navigator.serviceWorker?.controller;
        const onlineNow = navigator.onLine !== false;
        const allowDownload = controllerReady && onlineNow;

        if (!busy) {

          btn.classList.toggle('offline-active', isCached);
          btn.setAttribute('aria-pressed', String(isCached));

        }
        const urls = offlineResourceUrlsForItem(item);
        const manifestEntry = buildOfflineManifestEntry(item);
        const requestId = `offline-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const response = await sendMessageToServiceWorker('CACHE_URLS', {
          urls,
          name: item.name,
          manifest: manifestEntry,
          displayName: manifestEntry?.displayName || item.displayName || item.name,
          requestId
        });
        if (response && response.success === false) {
          const error = new Error(response.error || 'Caching failed');
          error.userMessage = 'Download fehlgeschlagen.';
          throw error;
        }
        state.offline.workerReady = true;
        return { requestId, manifest: manifestEntry };
      }

      async function removeItemFromOffline(item) {
        if (!state.offline.supported) {
          const error = new Error('Offline caching not supported');
          error.userMessage = 'Offline-Funktion nicht verfügbar.';
          throw error;
        }
        const urls = offlineResourceUrlsForItem(item);
        const response = await sendMessageToServiceWorker('REMOVE_URLS', { urls });
        if (response && response.success === false) {
          const error = new Error(response.error || 'Remove failed');
          error.userMessage = 'Offline-Daten konnten nicht entfernt werden.';
          throw error;
        }
        state.offline.workerReady = true;
        state.offline.cached.delete(item.name);
        delete state.offline.manifest[item.name];
        state.offline.lastSync = Date.now();
        persistOfflineState();
      }

      function buildOfflineLibraryItems() {
        const items = [];
        state.offline.cached.forEach((name) => {
          const manifest = getOfflineManifestEntry(name) || {};
          items.push({
            id: encodeURIComponent(name),
            name,
            displayName: manifest.displayName || name.split('/').pop(),
            folder: manifest.folder || '',
            thumbnail: manifest.thumbnail || `/thumbnails/${encodePathSegments(name.replace(/\.pdf$/i, '.jpg'))}`,
            url: manifest.url || `/sheets/${encodePathSegments(name)}`,
            categories: Array.isArray(manifest.categories) ? manifest.categories : [],
            size: manifest.size || 0,
            mtime: manifest.mtime || 0
          });
        });
        return items.sort((a, b) => a.displayName.localeCompare(b.displayName, 'de', { sensitivity: 'base' }));
      }

      function deriveOfflineCategories() {
        const seen = new Map();
        const manifest = state.offline.manifest || {};
        Object.keys(manifest).forEach((name) => {
          const entry = manifest[name];
          if (!entry || !Array.isArray(entry.categories)) return;
          entry.categories.forEach((cat) => {
            if (!cat || !cat.id) return;
            if (!seen.has(cat.id)) {
              seen.set(cat.id, { ...cat });
            }
          });
        });
        return Array.from(seen.values());
      }

      function buildOfflineLibraryFallbackData() {
        const items = buildOfflineLibraryItems();
        return {
          items,
          total: items.length,
          categories: deriveOfflineCategories()
        };
      }

      async function syncOfflineInventory({ silent = false } = {}) {
        if (!state.offline.supported) return;
        try {
          const response = await sendMessageToServiceWorker('GET_CACHED_PDFS');
          state.offline.workerReady = true;
          const pdfs = Array.isArray(response?.pdfs) ? response.pdfs : [];
          state.offline.cached = new Set(pdfs);
          Object.keys(state.offline.manifest).forEach((key) => {
            if (!state.offline.cached.has(key)) {
              delete state.offline.manifest[key];
            }
          });
          state.offline.lastSync = Date.now();
          persistOfflineState();
          refreshOfflineIndicators();
          renderOfflineShelf();
          if (!silent) {
            showToast(`Offline-Inhalte aktualisiert (${pdfs.length})`, 2600);
          }
        } catch (error) {
          state.offline.lastError = error?.message || String(error);
          if (!silent) {
            showToast('Offline-Status konnte nicht aktualisiert werden.', 3200);
          }
          console.warn('Offline sync failed:', error);
        }
      }

      async function clearOfflineCaches() {
        if (!state.offline.supported) return;
        try {
          await sendMessageToServiceWorker('CLEAR_OFFLINE');
          state.offline.workerReady = true;
        } catch (err) {
          console.warn('CLEAR_OFFLINE failed:', err);
        }
        state.offline.cached = new Set();
        state.offline.manifest = {};
        state.offline.libraryPrimed = false;
        state.offline.lastSync = Date.now();
        persistOfflineState();
        refreshOfflineIndicators();
        renderOfflineShelf();
      }

      function renderOfflineShelf() {
        const shelf = document.querySelector('#offlineShelf');

                </button>
                <button id="btnOfflineRefresh" type="button" class="btn btn-secondary btn-icon" title="Status aktualisieren">${SVG_REFRESH}</button>
                <button id="btnOfflineClear" type="button" class="btn btn-secondary btn-icon" title="Offline-Speicher leeren">${SVG_TRASH_MINI}</button>

      function saveLibrarySnapshot(snapshot) {

      function loadLibrarySnapshot() {

      function snapshotParamsEqual(a, b) {

      async function handleOfflineToggle(buttonEl, item) {
        if (!item || !item.name) return;
        if (!state.offline.supported) {
          showToast('Offline-Funktion nicht verfügbar.', 3200);
          return;
        }
        const rel = item.name;
        if (state.offline.pending.has(rel)) return;

        const targetBtn = document.querySelector(`.btn-offline[data-offline-name="${cssEscape(rel)}"]`) || buttonEl;
        if (targetBtn) {
          targetBtn.disabled = false;
          targetBtn.removeAttribute('disabled');
          targetBtn.setAttribute('aria-disabled', 'false');
        }
        const isCached = state.offline.cached.has(rel);

        if (isCached) {
          state.offline.pending.add(rel);
          setOfflineButtonsBusyByName(rel, true);
          try {
            const confirmed = await new Promise((resolve) => {
              showConfirmDialog({
                title: 'Offline-Version entfernen?',
                message: `Soll "${escapeHtml(item.displayName || item.name)}" aus dem Offline-Speicher entfernt werden?`,
                confirmText: 'Entfernen',
                cancelText: 'Abbrechen',
                isDangerous: true,
                onConfirm: () => resolve(true),
                onCancel: () => resolve(false)
              });
            });
            if (!confirmed) return;
            await removeItemFromOffline(item);
            showToast(`Offline-Version entfernt: ${item.displayName || item.name}`, 2600);
            refreshOfflineIndicators();
            renderOfflineShelf();
          } catch (error) {
            state.offline.lastError = error?.message || String(error);
            showToast(error?.userMessage || 'Offline-Aktion fehlgeschlagen.', 3600);
            console.warn('Offline toggle failed:', error);
          } finally {
            state.offline.pending.delete(rel);
            setOfflineButtonsBusyByName(rel, false);
          }
          return;
        }

        const controllerReady = state.offline.workerReady || !!navigator.serviceWorker?.controller;
        const onlineNow = navigator.onLine !== false;
        if (!onlineNow) {
          showToast('Keine Verbindung – Download nicht möglich.', 3200);
          return;
        }
        if (!controllerReady) {
          showToast('Offline-Unterstützung wird vorbereitet. Bitte kurz warten.', 3200);
          pendingControllerReadyActions.push({ type: 'cache', item, button: targetBtn || buttonEl });
          return;
        }

        state.offline.pending.add(rel);
        state.offline.inFlight.set(rel, { displayName: item.displayName || item.name });
        setOfflineButtonsBusyByName(rel, true);

        try {
          const { manifest } = await cacheItemForOffline(item);
          state.offline.pending.delete(rel);
          state.offline.inFlight.delete(rel);
          state.offline.cached.add(rel);
          if (manifest && typeof manifest === 'object') {
            state.offline.manifest[rel] = manifest;
          }
          state.offline.lastSync = Date.now();
          persistOfflineState();
          setOfflineButtonsBusyByName(rel, false);
          refreshOfflineIndicators();
          renderOfflineShelf();
          updateOfflineButtonAppearance(targetBtn || buttonEl, rel);
          showToast(`Download abgeschlossen: ${item.displayName || item.name}`, 2600);
        } catch (error) {
          state.offline.lastError = error?.message || String(error);
          state.offline.pending.delete(rel);
          state.offline.inFlight.delete(rel);
          setOfflineButtonsBusyByName(rel, false);
          showToast(error?.userMessage || 'Offline-Aktion fehlgeschlagen.', 3600);
          console.warn('Offline toggle failed:', error);
        }
      }

      function processPendingControllerReady() {
        if (!pendingControllerReadyActions.length) return;
          const queue = [...pendingControllerReadyActions];
          pendingControllerReadyActions.length = 0;
          queue.forEach((entry) => {
            if (!entry || typeof entry !== 'object') return;
            const btnEl = entry.button;
            if (btnEl) {
              btnEl.disabled = false;
              btnEl.removeAttribute('disabled');
              btnEl.setAttribute('aria-disabled', 'false');
            }
            if (entry.type === 'cache' && entry.item) {
              state.offline.pending.delete(entry.item.name);
              setOfflineButtonsBusyByName(entry.item.name, false);
              Promise.resolve().then(() => handleOfflineToggle(btnEl || null, entry.item));
            }
          });
        }

      function handleOfflineStatusChange() {
        if (!state.offline.supported) return;
        const previous = state.offline.online;
        updateOfflineOnlineStatus();
        refreshOfflineIndicators();
        renderOfflineShelf();
        if (state.offline.online && !previous) {
          showToast('Zurück online.', 2400);
          syncOfflineInventory({ silent: true });
        } else if (!state.offline.online && previous) {
          showToast('Offline. Nur gespeicherte Inhalte verfügbar.', 3600);
        }
      }

      function initializeOfflineSupport() {
        if (!state.offline.supported) return;
        updateOfflineOnlineStatus();
        renderOfflineShelf();
        refreshOfflineIndicators();
        const controller = navigator.serviceWorker.controller;
        if (controller) {
          state.offline.workerReady = true;
          processPendingControllerReady();
        }
        navigator.serviceWorker.ready
          .then(() => {
            state.offline.workerReady = true;
            processPendingControllerReady();
            if (!state.offline.lastSync) {
              syncOfflineInventory({ silent: true });
            } else {
              refreshOfflineIndicators();
              renderOfflineShelf();
            }
          })
          .catch((err) => console.warn('Service Worker ready failed:', err));
      }

      if (state.offline.supported) {
        window.addEventListener('online', handleOfflineStatusChange);
        window.addEventListener('offline', handleOfflineStatusChange);
        initializeOfflineSupport();
        navigator.serviceWorker.addEventListener?.('controllerchange', () => {
          state.offline.workerReady = true;
          processPendingControllerReady();
          refreshOfflineIndicators();
          renderOfflineShelf();
        });
        navigator.serviceWorker.addEventListener?.('message', (event) => {
          const data = event?.data;
          if (data && data.type === 'OFFLINE_CACHE_RESULT') {
            handleOfflineCacheResult(data);
          }
        });
      }

      function updatePaginationDisplay() {
        const offlineActive = state.offline.supported && state.offline.filterOnly && state.offline.cached.size > 0;
        const totalPages = offlineActive ? 1 : Math.max(1, Math.ceil(state.library.total / state.library.pageSize));
        const currentPage = offlineActive ? 1 : state.library.page;
        const prevDisabled = offlineActive || currentPage <= 1;
        const nextDisabled = offlineActive || currentPage >= totalPages;

        const pNow = document.querySelector('#pNow');
        if (pNow) pNow.textContent = currentPage;

        const prevBtn = document.querySelector('#prevPage');
        if (prevBtn) {
          prevBtn.classList.toggle('invisible', prevDisabled);
          prevBtn.classList.toggle('pointer-events-none', prevDisabled);
          prevBtn.classList.toggle('select-none', prevDisabled);
          prevBtn.classList.toggle('opacity-0', prevDisabled);
          if (prevDisabled) {
            prevBtn.setAttribute('aria-disabled', 'true');
            prevBtn.setAttribute('tabindex', '-1');
          } else {
            prevBtn.removeAttribute('aria-disabled');
            prevBtn.removeAttribute('tabindex');
          }
        }

        const nextBtn = document.querySelector('#nextPage');
        if (nextBtn) {
          nextBtn.classList.toggle('invisible', nextDisabled);
          nextBtn.classList.toggle('pointer-events-none', nextDisabled);
          nextBtn.classList.toggle('select-none', nextDisabled);
          nextBtn.classList.toggle('opacity-0', nextDisabled);
          if (nextDisabled) {
            nextBtn.setAttribute('aria-disabled', 'true');
            nextBtn.setAttribute('tabindex', '-1');
          } else {
            nextBtn.removeAttribute('aria-disabled');
            nextBtn.removeAttribute('tabindex');
          }
        }

        const pager = document.querySelector('#libraryPager');
        if (pager) {
          pager.classList.toggle('hidden', offlineActive);
        }
      }

  const pdfRefreshState = {
    pages: new Set(),
    timer: null,
    running: false,
    token: null,
    needsDocRefresh: false
  };

  function queuePdfPageRefresh(pages, bustToken) {
    if (Array.isArray(pages) && pages.length) {
      pages.forEach((page) => {
        const num = Number(page);
        if (Number.isInteger(num) && num > 0) {
          pdfRefreshState.pages.add(num);
        }
      });
    } else {
      pdfRefreshState.needsDocRefresh = true;
    }

    if (Number.isFinite(bustToken)) {
      pdfRefreshState.token = bustToken;
    }

    if (pdfRefreshState.timer) return;
    pdfRefreshState.timer = window.setTimeout(runPdfPageRefresh, 150);
  }

  function resetPdfRefreshState() {
    pdfRefreshState.pages.clear();
    pdfRefreshState.needsDocRefresh = false;
    pdfRefreshState.token = null;
    if (pdfRefreshState.timer) {
      clearTimeout(pdfRefreshState.timer);
      pdfRefreshState.timer = null;
    }
    pdfRefreshState.running = false;
  }

  const annotations = createAnnotationManager({
      state,
      updateStatus,
      fetcher: (url, options) => fetch(url, options ?? {}),
      onSaved: (meta) => {
        if (!state.viewer.fileName) return;
        const pages = Array.isArray(meta?.pages) ? meta.pages : [];
        const mtimeValue = Number(meta?.mtime);
        const bust = Number.isFinite(mtimeValue) ? mtimeValue : Date.now();
        state.viewer.url = `/sheets/${encodePathSegments(state.viewer.fileName)}?v=${bust}`;
        state.viewer.cacheToken = bust;
        queuePdfPageRefresh(pages, bust);
      }
    });
    annotations.initControls();
    window.annotations = annotations;

    state.viewer.zoom = loadStoredZoom();
    state.viewer.committedZoom = state.viewer.zoom;
    state.viewer.zoomPreview = null;
    updateZoomUI();
    setupZoomControls();

      let cleanupLibraryViewportSizing = null;
      function disposeLibraryViewportSizing() {
        if (cleanupLibraryViewportSizing) {
          cleanupLibraryViewportSizing();
          cleanupLibraryViewportSizing = null;
        }
      }
      function ensureLibraryViewportSizing() {
        disposeLibraryViewportSizing();
        const wrap = document.querySelector('#virtualWrap');
        const pager = document.querySelector('#libraryPager');
        if (!wrap) return;
        const updateHeight = () => {
          if (!wrap.isConnected) return;
          const rect = wrap.getBoundingClientRect();
          const footerVisible = controlsEl && !controlsEl.classList.contains('hidden');
          const footerHeight = footerVisible ? controlsEl.getBoundingClientRect().height : 0;
          
          // Measure pager height more reliably
          let pagerHeight = 0;
          if (pager) {
            const pagerRect = pager.getBoundingClientRect();
            pagerHeight = pagerRect.height || 70; // Fallback to min height
          }
          
          const appStyles = window.getComputedStyle(appEl);
          const paddingBottom = parseFloat(appStyles.paddingBottom || '0') || 0;
          const paddingTop = parseFloat(appStyles.paddingTop || '0') || 0;
          
          // iPad/iOS: Use much larger safety margin to ensure pager is fully visible
          const safeAreaBottom = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sab') || '0px') || 0;
          const safetyMargin = 120; // Very large margin for iPad - ensure full visibility
          
          // Calculate available height more conservatively
          let available = window.innerHeight - rect.top - footerHeight - paddingBottom - pagerHeight - safetyMargin - safeAreaBottom;
          
          // Additional check: ensure we leave enough space for the pager (even more space)
          const minPagerSpace = 120; // Much larger minimum space to reserve for pager visibility
          const maxWrapHeight = window.innerHeight - rect.top - footerHeight - paddingBottom - minPagerSpace;
          available = Math.min(available, maxWrapHeight);
          
          if (!Number.isFinite(available)) available = 480;
          if (available <= 0) available = 160;
          wrap.style.height = `${available}px`;
        };
        const resizeEvents = ['resize', 'orientationchange'];
        resizeEvents.forEach(evt => window.addEventListener(evt, updateHeight));
        if (window.visualViewport) window.visualViewport.addEventListener('resize', updateHeight);
        // Delay initial measurement to ensure layout is settled
        requestAnimationFrame(() => requestAnimationFrame(updateHeight));
        cleanupLibraryViewportSizing = () => {
          resizeEvents.forEach(evt => window.removeEventListener(evt, updateHeight));
          if (window.visualViewport) window.visualViewport.removeEventListener('resize', updateHeight);
          if (wrap.isConnected) wrap.style.height = '';
        };
      }

      // ===== Zoom Controls =====
      function setupZoomControls() {
        if (state.viewer.zoomControlsReady) return;
        const { slider, btnIn, btnOut, btnReset } = zoomControls;
        if (!slider || !btnIn || !btnOut || !btnReset) return;

        btnIn.addEventListener('click', () => adjustViewerZoom(ZOOM_STEP, { immediate: true }));
        btnOut.addEventListener('click', () => adjustViewerZoom(-ZOOM_STEP, { immediate: true }));
        btnReset.addEventListener('click', () => setViewerZoom(1, { immediate: true }));

        slider.addEventListener('input', (event) => {
          const percent = Number(event.target.value);
          const zoom = percentToZoom(percent);
          event.target.setAttribute('aria-valuenow', String(zoomToPercent(zoom)));
          setViewerZoom(zoom);
        });

        slider.addEventListener('change', (event) => {
          const percent = Number(event.target.value);
          const zoom = percentToZoom(percent);
          event.target.setAttribute('aria-valuenow', String(zoomToPercent(zoom)));
          setViewerZoom(zoom, { immediate: true });
        });

        state.viewer.zoomControlsReady = true;
      }

      function updateZoomUI() {
        const activeZoom = state.viewer.zoomPreview ?? state.viewer.zoom;
        const percent = zoomToPercent(activeZoom);
        if (zoomControls.slider) {
          zoomControls.slider.value = String(percent);
          zoomControls.slider.setAttribute('aria-valuenow', String(percent));
        }
        if (zoomControls.display) {
          zoomControls.display.textContent = `${percent}%`;
        }
      }

      function adjustViewerZoom(delta, { immediate = false } = {}) {
        setViewerZoom(state.viewer.zoom + delta, { immediate });
      }

      function adjustScrollForZoom(prevZoom, newZoom, focal) {
        if (!focal) return;
        const viewerEl = document.querySelector('#viewer');
        if (!viewerEl) return;
        if (!Number.isFinite(prevZoom) || prevZoom <= 0) return;
        if (!Number.isFinite(newZoom) || newZoom <= 0) return;
        const ratio = newZoom / prevZoom;
        if (!Number.isFinite(ratio) || ratio <= 0) return;

        const { contentY, viewportOffsetY, contentX, viewportOffsetX } = focal;

        if (Number.isFinite(contentY) && Number.isFinite(viewportOffsetY)) {
          const targetScrollY = contentY * ratio - viewportOffsetY;
          const maxScrollY = Math.max(0, viewerEl.scrollHeight - viewerEl.clientHeight);
          viewerEl.scrollTop = Math.max(0, Math.min(maxScrollY, targetScrollY));
        }

        if (Number.isFinite(contentX) && Number.isFinite(viewportOffsetX)) {
          const targetScrollX = contentX * ratio - viewportOffsetX;
          const maxScrollX = Math.max(0, viewerEl.scrollWidth - viewerEl.clientWidth);
          viewerEl.scrollLeft = Math.max(0, Math.min(maxScrollX, targetScrollX));
        }
      }

      function applyZoomPreviewLayout(zoom) {
        if (!document.body.classList.contains('in-viewer')) return;
        const container = document.querySelector('#viewer');
        if (!container) return;
        const placeholders = Array.from(container.querySelectorAll('[data-page]'));
        let lastBlockHeight = null;
        let lastScaledHeight = null;
        let lastStageWidth = null;
        let lastLabelAllowance = null;

        for (const ph of placeholders) {
          if (!(ph instanceof HTMLElement)) continue;
          if (ph.dataset.rendered !== '1') continue;
          const stage = ph.querySelector('[data-role="page-stage"]');
          if (!stage) continue;
          const canvas = stage.querySelector('canvas[data-role="pdf-canvas"]');
          if (!canvas) continue;
          const baseWidth = Number(canvas.dataset.baseWidth);
          const baseHeight = Number(canvas.dataset.baseHeight);
          if (!Number.isFinite(baseWidth) || !Number.isFinite(baseHeight)) continue;

          const scaledWidth = Math.max(1, Math.round(baseWidth * zoom));
          const scaledHeight = Math.max(1, Math.round(baseHeight * zoom));

          stage.style.width = `${scaledWidth}px`;
          stage.style.minWidth = `${scaledWidth}px`;
          stage.style.maxWidth = 'none';
          stage.style.height = `${scaledHeight}px`;
          canvas.style.width = `${scaledWidth}px`;
          canvas.style.height = `${scaledHeight}px`;

          const overlayLayers = stage.querySelectorAll('canvas.annotation-layer, canvas.annotation-committed');
          overlayLayers.forEach((layer) => {
            layer.style.width = `${scaledWidth}px`;
            layer.style.height = `${scaledHeight}px`;
          });

          const labelAllowance = Number(stage.dataset.labelAllowance) || Number(ph.dataset.labelAllowance) || (() => {
            const label = ph.querySelector('[data-role="page-label"]');
            return label ? label.offsetHeight + 16 : 48;
          })();

          const blockHeight = scaledHeight + labelAllowance;
          ph.style.height = `${blockHeight}px`;
          ph.style.minHeight = `${blockHeight}px`;
          ph.dataset.blockHeight = String(blockHeight);
          ph.dataset.renderedHeight = String(blockHeight);
          ph.dataset.labelAllowance = String(labelAllowance);

          lastBlockHeight = blockHeight;
          lastScaledHeight = scaledHeight;
          lastStageWidth = scaledWidth;
          lastLabelAllowance = labelAllowance;
        }

        if (Number.isFinite(lastBlockHeight)) {
          state.viewer.pageBlockHeight = lastBlockHeight;
        }
        if (Number.isFinite(lastScaledHeight)) {
          state.viewer.pageScaledHeight = lastScaledHeight;
        }
        if (Number.isFinite(lastStageWidth)) {
          state.viewer.pageStageWidth = lastStageWidth;
        }
        if (Number.isFinite(lastLabelAllowance)) {
          state.viewer.pageLabelAllowance = lastLabelAllowance;
        }

        state.viewer.autoScroll.needsRecalc = true;
      }

      function getViewerCenterFocal() {
        const viewerEl = document.querySelector('#viewer');
        if (!viewerEl) return null;
        const offsetX = viewerEl.clientWidth / 2;
        const offsetY = viewerEl.clientHeight / 2;
        return {
          contentX: viewerEl.scrollLeft + offsetX,
          viewportOffsetX: offsetX,
          contentY: viewerEl.scrollTop + offsetY,
          viewportOffsetY: offsetY
        };
      }

      function setViewerZoom(value, { immediate = false, preview = false, focal = null, force = false } = {}) {
        const clamped = clampZoom(value);
        const focalPoint = focal || getViewerCenterFocal();

        if (preview) {
          const prevPreview = state.viewer.zoomPreview ?? state.viewer.zoom;
          const delta = Math.abs(clamped - prevPreview);
          if (delta < 0.001) return;
          if (state.viewer.zoomTimer) {
            clearTimeout(state.viewer.zoomTimer);
            state.viewer.zoomTimer = null;
          }
          state.viewer.zoomPreview = clamped;
          updateZoomUI();
          applyZoomPreviewLayout(clamped);
          adjustScrollForZoom(prevPreview, clamped, focalPoint);
          return;
        }

        const prevZoom = state.viewer.zoom;
        const changed = Math.abs(clamped - prevZoom) >= 0.001;

        if (state.viewer.zoomTimer) {
          clearTimeout(state.viewer.zoomTimer);
          state.viewer.zoomTimer = null;
        }

        if (changed) {
          state.viewer.zoom = clamped;
          state.viewer.zoomPreview = null;
          state.viewer.zoomVersion += 1;
          persistZoom(clamped);
        } else if (!force) {
          state.viewer.zoomPreview = null;
          updateZoomUI();
          return;
        } else {
          state.viewer.zoomPreview = null;
        }

        updateZoomUI();
        adjustScrollForZoom(prevZoom, clamped, focalPoint);

        const viewerActive = document.body.classList.contains('in-viewer') && state.viewer._pdf;
        if (!viewerActive) return;

        if (immediate || force) {
          applyZoomToPages().catch((err) => console.warn('Zoom update failed', err));
          return;
        }

        if (changed) {
          state.viewer.zoomTimer = window.setTimeout(() => {
            state.viewer.zoomTimer = null;
            applyZoomToPages().catch((err) => console.warn('Zoom update failed', err));
          }, 160);
        }
      }

      async function applyZoomToPages() {
        if (!document.body.classList.contains('in-viewer')) return;
        const pdf = state.viewer._pdf;
        if (!pdf) return;
        const container = document.querySelector('#viewer');
        if (!container) return;

        const version = state.viewer.zoomVersion;
        const placeholders = Array.from(container.querySelectorAll('[data-page]'));
        let didRender = false;
        for (const ph of placeholders) {
          if (!ph || !ph.isConnected) continue;
          const pageNumber = Number(ph.dataset.page);
          if (!Number.isFinite(pageNumber)) continue;
          if (!ph.dataset.rendered && !ph.querySelector('canvas')) continue;
          await renderOnePageInto(ph, pdf, pageNumber);
          didRender = true;
          if (version !== state.viewer.zoomVersion) return;
        }

        if (!didRender && Number.isFinite(state.viewer.pageBlockHeight)) {
          adjustPlaceholderHeights(state.viewer.pageBlockHeight);
        }

        if (window.JumpMarkers?.renderAllMarkers) {
          window.JumpMarkers.renderAllMarkers();
        }

        state.viewer.autoScroll.needsRecalc = true;
        computeSpeed();
        if (state.viewer.autoScroll.running) {
          state.viewer.autoScroll.lastTs = performance.now();
        }
        updateStatus();
        state.viewer.committedZoom = state.viewer.zoom;
        state.viewer.zoomPreview = null;
      }

      function adjustPlaceholderHeights(blockHeight) {
        if (!Number.isFinite(blockHeight) || blockHeight <= 0) return;
        state.viewer.pageBlockHeight = blockHeight;
        const container = document.querySelector('#viewer');
        if (!container) return;
  const stageWidthHint = Number(state.viewer.pageStageWidth);
  const labelAllowanceHint = Number(state.viewer.pageLabelAllowance);
        const nodes = container.querySelectorAll('[data-page]');
        nodes.forEach((node) => {
          if (!(node instanceof HTMLElement)) return;
          if (node.dataset.rendered) return;
          node.style.height = `${blockHeight}px`;
          node.style.minHeight = `${blockHeight}px`;
          const stage = node.querySelector('[data-role="page-stage"]');
          if (stage instanceof HTMLElement) {
            const label = node.querySelector('[data-role="page-label"]');
            const measuredAllowance = label instanceof HTMLElement ? label.offsetHeight + 16 : 48;
            const stageDatasetWidth = Number(stage?.dataset?.scaledWidth);
            const stageDatasetAllowance = Number(stage?.dataset?.labelAllowance);
            const labelAllowance = Number.isFinite(labelAllowanceHint) && labelAllowanceHint > 0
              ? labelAllowanceHint
              : (Number.isFinite(stageDatasetAllowance) && stageDatasetAllowance > 0 ? stageDatasetAllowance : measuredAllowance);
            const stageHeight = Math.max(Math.round(blockHeight - labelAllowance), 120);
            const stageWidth = Number.isFinite(stageWidthHint) && stageWidthHint > 0
              ? stageWidthHint
              : (Number.isFinite(stageDatasetWidth) && stageDatasetWidth > 0 ? stageDatasetWidth : null);
            const skeleton = stage.querySelector('[data-role="skeleton"]');
            if (skeleton instanceof HTMLElement) {
              skeleton.style.height = `${stageHeight}px`;
            }
            if (stageWidth) {
              stage.style.width = `${stageWidth}px`;
              stage.style.minWidth = `${stageWidth}px`;
              stage.style.maxWidth = 'none';
            } else {
              stage.style.width = '100%';
              stage.style.minWidth = '';
              stage.style.maxWidth = '1400px';
            }
            stage.style.height = `${stageHeight}px`;
            stage.style.transform = 'none';
            stage.style.transformOrigin = 'top center';
            stage.style.margin = '0 auto';
            stage.dataset.scaledWidth = stageWidth ? String(stageWidth) : stage.dataset.scaledWidth || '';
            stage.dataset.scaledHeight = String(stageHeight);
            stage.dataset.labelAllowance = String(labelAllowance);
            delete stage.dataset.zoom;
          }
        });
        const spacer = container.querySelector('[data-role="end-spacer"]');
        if (spacer instanceof HTMLElement) {
          spacer.style.height = `${Math.round(blockHeight * 0.1)}px`;
        }
      }

              const id = btn.getAttribute('data-cat');
              if (!id) return;
              if (selected.has(id)) {
                selected.delete(id);
                btn.classList.remove('is-selected');
                btn.querySelector('[data-role="indicator"]')?.classList.add('hidden');
              } else {
                selected.add(id);
                btn.classList.add('is-selected');
                btn.querySelector('[data-role="indicator"]')?.classList.remove('hidden');
              }
            });
          });

          fileInput.addEventListener('change', () => {
            const name = fileInput.files?.[0]?.name;
            fileLabel.textContent = name ? `Ausgewählt: ${name}` : `${limitMb} MB max • Nur PDF`;
            statusEl.textContent = '';
          });

          form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            statusEl.textContent = '';
            const file = fileInput.files?.[0];
            if (!file) {
              statusEl.textContent = 'Bitte wähle eine PDF-Datei aus.';
              return;
            }
            const lowerName = (file.name || '').toLowerCase();
            const declaredType = (file.type || '').toLowerCase();
            if (!declaredType.includes('pdf') && !lowerName.endsWith('.pdf')) {
              statusEl.textContent = 'Nur PDF-Dateien können hochgeladen werden.';
              return;
            }
            const secsRaw = (secsInput.value || '').trim();
            let secsValue = null;
            if (secsRaw) {
              const parsed = Number(secsRaw);
              if (!Number.isFinite(parsed) || parsed < 5 || parsed > 600) {
                statusEl.textContent = 'Sekunden pro Seite müssen zwischen 5 und 600 liegen.';
                return;
              }
              secsValue = Math.round(parsed);
            }
            const metaPayload = {
              originalName: file.name || 'upload.pdf',
              categories: Array.from(selected),
              favorite: favoriteInput.checked
            };
            if (secsValue !== null) metaPayload.secsPerPage = secsValue;

            submitBtn.disabled = true;
            cancelBtn.disabled = true;
            submitBtn.textContent = 'Lade hoch…';

            try {
              // Avoid setting Content-Type explicitly to let the browser choose;
              // some iOS browsers throw TypeError on manual Content-Type with Blob bodies.
              const resolvedName = (file.name && file.name.toLowerCase().endsWith('.pdf')) ? file.name : (file.name || 'upload.pdf');
              const headers = new Headers({
                'X-Upload-Name': encodeURIComponent(resolvedName),
                'X-Upload-Meta': encodeURIComponent(JSON.stringify(metaPayload)),
                'Accept': 'application/json'
              });

              const res = await fetch('/api/upload', { method: 'POST', headers, body: file });
              let payload;
              try {
                payload = await res.json();
              } catch {
                payload = {};
              }
              if (!res.ok || !payload.ok) {
                const err = new Error(payload.error || 'Upload fehlgeschlagen.');
                err.status = res.status;
                throw err;
              }
              state.ui.uploadSupported = true;
              if (Array.isArray(payload.favorites)) {
                state.library.favorites = new Set(payload.favorites);
              }
              if (payload.maxUploadBytes) {
                const mb = Math.round(Number(payload.maxUploadBytes) / 1024 / 1024);
                if (Number.isFinite(mb) && mb > 0) {
                  state.ui.uploadLimitMb = mb;
                }
              }
              closeModal();
              await loadPage();
              renderLibrary();
            } catch (error) {
              // Normalize Safari/iOS TypeError messages
              if (error?.name === 'TypeError' && !error.status) {
                error.message = 'Netzwerkfehler beim Upload (TypeError). Bitte erneut versuchen.';
              }
              if (error.status === 503) {
                state.ui.uploadSupported = false;
                statusEl.textContent = error.message || 'Uploads sind aktuell nicht verfügbar.';
                setTimeout(() => {
                  closeModal();
                  setUploadButtonVisible(false);
                }, 1000);
                return;
              }
              if (error.status === 413) {
                statusEl.textContent = `Datei ist zu groß (max. ${limitMb} MB).`;
              } else if (error.status === 415) {
                statusEl.textContent = 'Nur PDF-Dateien erlaubt.';
              } else {
                statusEl.textContent = error.message || 'Upload fehlgeschlagen.';
              }
              submitBtn.disabled = false;
              cancelBtn.disabled = false;
              submitBtn.textContent = 'Hochladen';
            }
          });

          requestAnimationFrame(() => fileInput.focus());
        } catch (err) {
          console.error('Upload-Dialog konnte nicht geöffnet werden:', err);
          if (backdrop?.isConnected) backdrop.remove();
          state.ui.uploadOpen = false;
          setUploadButtonVisible(true);
        }

      // ===== API (Library) =====
      async function fetchPage({ q = "", sort, order, page, pageSize, fav = false, category = null }) {
        const qs = new URLSearchParams({ q, sort, order, page: String(page), pageSize: String(pageSize) });
        if (fav) qs.set("fav", "1");
        if (category) qs.set("category", category);
        const res = await fetch(`/api/sheets?${qs.toString()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("API error");
        return res.json();
      }
      async function loadPage() {
        const L = state.library;
        const snapshotParams = {
          q: L.q,
          sort: L.sort,
          order: L.order,
          page: L.page,
          pageSize: L.pageSize,
          fav: L.onlyFavorites,
          category: L.categoryFilter
        };
        let data;
        try {
          data = await fetchPage({
            q: L.q,
            sort: L.sort,
            order: L.order,
            page: L.page,
            pageSize: L.pageSize,
            fav: L.onlyFavorites,
            category: L.categoryFilter
          });
          saveLibrarySnapshot({ params: snapshotParams, payload: data });
        } catch (err) {
          console.warn('Bibliothek konnte nicht geladen werden, verwende lokale Daten', err);
          const snapshot = loadLibrarySnapshot();
          if (snapshot && snapshot.payload && snapshotParamsEqual(snapshot.params, snapshotParams)) {
            data = snapshot.payload;
            showToast('Letzte Bibliothek wird offline angezeigt.', 3200);
          } else {
            const fallback = buildOfflineLibraryFallbackData();
            if (fallback.items.length) {
              data = { items: fallback.items, total: fallback.total, categories: fallback.categories };
              state.offline.libraryPrimed = true;
              persistOfflineState();
              showToast('Offline-Bibliothek geladen.', 3200);
            } else {
              throw err;
            }
          }
        }

        const payload = data || {};
        L.items = Array.isArray(payload.items) ? payload.items : [];
        L.total = Number(payload.total) || 0;
        if (Array.isArray(payload.categories)) {
          state.categories = payload.categories;
          // Preserve special filter 'none' (uncategorized)
          if (L.categoryFilter && L.categoryFilter !== 'none' && !state.categories.some(cat => cat.id === L.categoryFilter)) {
            L.categoryFilter = null;
            localStorage.removeItem("libCategory");
          }
        }
      }

        state.library.page = 1;
        appEl.innerHTML = '<div class="flex items-center justify-center h-[60vh] text-neutral-400">Lade…</div>';
        await loadPage();
        renderLibrary();
      }

  renderCategoryBar();

        // Add header segmented mode switch + upload

    searchEl.value = L.q;

  // order icon already reflects state (rotation)

        // Clear button functionality

        // ===== SORT DROPDOWN - OPTIMIZED BEHAVIOR =====
        if (sortMenuBtn && sortMenu) {

          const wrapper = sortMenuBtn.closest('.sort-dropdown-wrapper');
          const menuPlaceholder = document.createElement('span');
          menuPlaceholder.style.display = 'none';

          const detachMenu = () => {
            if (!wrapper) return;
            if (sortMenu.parentElement !== document.body) {
              wrapper.insertBefore(menuPlaceholder, sortMenu);

          };

          const restoreMenu = () => {

          };
          
          const positionMenu = () => {
            const btnRect = sortMenuBtn.getBoundingClientRect();
            const margin = 12;
            const gap = 4;
            
            let top = btnRect.bottom + gap;
            let left = btnRect.left;
            
            sortMenu.style.top = `${top}px`;
            sortMenu.style.left = `${left}px`;
            
            const menuRect = sortMenu.getBoundingClientRect();
            
            if (menuRect.right > window.innerWidth - margin) {
              left = Math.max(margin, window.innerWidth - margin - menuRect.width);
              sortMenu.style.left = `${left}px`;

            if (menuRect.left < margin) {
              left = margin;
              sortMenu.style.left = `${left}px`;
            }
            
            if (menuRect.bottom > window.innerHeight - margin) {
              const aboveTop = btnRect.top - gap - menuRect.height;
              top = Math.max(margin, Math.min(aboveTop, window.innerHeight - margin - menuRect.height));
              sortMenu.style.top = `${top}px`;

          const openMenu = () => {

            // Reset chevron icon

            if (chevron) chevron.style.transform = 'rotate(0deg)';
            
            document.removeEventListener('click', handleOutsideClick, true);
          };
          
          const handleOutsideClick = (ev) => {
            // Check if click is inside the menu or button
            if (sortMenu.contains(ev.target) || sortMenuBtn.contains(ev.target)) {
              return;
            }
            closeMenu();
          };
          
          // Toggle menu on button click
          sortMenuBtn.addEventListener('click', (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            
            if (isMenuOpen) {

            } else {

          // Handle menu item clicks
          sortMenu.querySelectorAll('[data-sort]').forEach((btn) => {

          window.addEventListener('scroll', () => {

                positionMenu();
                scrollTicking = false;
              });
              scrollTicking = true;
            }
          }, { passive: true });
          
          // Reposition menu on resize
          window.addEventListener('resize', () => {
            if (isMenuOpen) {
              positionMenu();
            }
          });
          
          // Close menu on Escape key
          document.addEventListener('keydown', (ev) => {

        if (filterToggleBtn) {
