<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Piano Sheets</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PDF.js & Fuse.js (local, served by server.js) -->
    <script src="/vendor/pdfjs/pdf.min.js" defer></script>
    <script src="/vendor/fuse.min.js" defer></script>
    <script src="/vendor/nosleep.min.js" defer></script>

    <style>
      :root {
        color-scheme: light dark;
        --surface-0: #050506;
        --surface-1: #0b0b0c;
        --surface-2: #111114;
        --accent-color: #6366F1;
        --accent-soft: rgba(99, 102, 241, 0.16);
        --accent-muted: rgba(99, 102, 241, 0.35);
        --accent-contrast: #F9FAFB;
      }
      html, body { height: 100%; }
      body {
        background: linear-gradient(145deg, color-mix(in srgb, var(--accent-color) 8%, var(--surface-0)) 0%, var(--surface-0) 55%, var(--surface-1) 100%);
        transition: background 0.4s ease;
      }
      .vh { height: 100vh; height: 100dvh; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  /* iOS smoother programmatic scrolling */
  #viewer { -webkit-overflow-scrolling: touch; }
      .card:hover { transform: translateY(-2px); }
      .tap-highlight-none { -webkit-tap-highlight-color: rgba(0,0,0,0); }
      /* iOS/iPad safe-area handling + fullscreen fixes */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      /* Controls bar: keep clear of Home indicator */
      #controls { padding-bottom: var(--sab); }
      /* In fullscreen hide header and add top/bottom safe padding to viewer */
      html.is-fs header { display: none !important; }
      html.is-fs #viewer { padding-top: var(--sat); padding-bottom: calc(var(--sab) + 12px); }
      body[data-accent-active="true"] header {
        border-color: var(--accent-muted) !important;
        background: color-mix(in srgb, var(--accent-color) 10%, rgba(12,12,15,0.85));
      }
      body[data-accent-active="true"] #controls {
        border-color: var(--accent-muted) !important;
        background: color-mix(in srgb, var(--accent-color) 12%, rgba(12,12,15,0.88));
      }
      .category-pill {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .category-pill:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 32px -28px rgba(0, 0, 0, 0.6);
      }
      .category-pill.is-selected {
        outline: 2px solid rgba(250, 250, 255, 0.5);
        outline-offset: 2px;
      }
      .category-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.75rem;
        padding: 0.15rem 0.55rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        text-shadow: 0 1px 1px rgba(0,0,0,0.25);
      }
      .badge-stack {
        max-height: 4.5rem;
        overflow: hidden;
        position: relative;
        padding-bottom: 0.35rem;
      }
      .badge-stack::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 28px;
        background: linear-gradient(to bottom, rgba(9,9,12,0) 0%, rgba(9,9,12,0.9) 100%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .badge-stack.is-overflowing::after {
        opacity: 1;
      }
      .glass-panel {
        backdrop-filter: blur(28px);
        background: rgba(15, 15, 21, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        box-shadow: 0 24px 48px -32px rgba(0, 0, 0, 0.65);
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(6, 6, 9, 0.68);
        backdrop-filter: blur(18px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 80;
        padding: 1.25rem;
      }
      #headerUploadBtn {
        display: inline-flex !important;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #e5e7eb;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }
      #headerUploadBtn:hover {
        color: #ffffff;
        background: rgba(99, 102, 241, 0.25);
        border-color: rgba(99, 102, 241, 0.5);
        transform: translateY(-1px);
      }
      #headerUploadBtn svg {
        width: 16px;
        height: 16px;
        opacity: 0.85;
        flex-shrink: 0;
      }
      #headerUploadBtn:hover svg {
        opacity: 1;
      }
      @media (max-width: 768px) {
        .glass-panel { width: 92vw; }
      }

      /* Mobile tweaks */
      @media (max-width: 640px) {
        /* Controls bar wraps nicely on phones */
        #controls #status { flex-basis: 100%; text-align: right; margin-left: 0; }
      }

      /* Ultra-small phones (e.g., 320–380px) */
      @media (max-width: 380px) {
        .site-title-text { display: none; }
        #header-actions { gap: 0.25rem; }
        #headerModeSwitch button { padding: 0.25rem 0.5rem; font-size: 0.85rem; }
        #headerUploadBtn { padding: 0.4rem; }
        #headerUploadBtn span { display: none; }
        #headerUploadBtn svg { width: 18px; height: 18px; }
      }
    </style>
  </head>
  <body class="min-h-screen bg-neutral-950 text-neutral-100 antialiased tap-highlight-none">
    <!-- Header -->
    <header class="sticky top-0 z-30 bg-neutral-950/80 backdrop-blur border-b border-neutral-800">
      <div class="mx-auto max-w-7xl px-4 min-h-14 h-auto py-2 flex flex-wrap items-center justify-between gap-2 sm:gap-3">
        <a href="/" aria-label="Piano Sheets" class="text-base sm:text-lg font-semibold tracking-tight truncate max-w-[58vw] shrink-0 flex items-center gap-2">
          <span class="text-lg">🎼</span>
          <span class="site-title-text">Piano Sheets</span>
        </a>
        <div id="header-actions" class="flex flex-wrap items-center justify-end gap-2 shrink-0"></div>
      </div>
    </header>

    <!-- Main app mount point -->
    <main id="app" class="mx-auto max-w-7xl px-4 py-6"></main>

    <!-- Viewer Controls (single Play/Pause with integrated Screen-On) -->
    <div id="controls" class="fixed bottom-0 inset-x-0 z-40 hidden bg-neutral-900/85 backdrop-blur border-t border-neutral-800">
      <div class="mx-auto max-w-7xl px-4 py-3 flex flex-wrap items-center gap-3">
        <button id="btnBack" class="px-3 py-2 rounded-lg bg-neutral-800 hover:bg-neutral-700 border border-neutral-700">← Library</button>
        <button id="btnFullscreen" class="px-3 py-2 rounded-lg bg-neutral-800 hover:bg-neutral-700 border border-neutral-700">⤢ Fullscreen</button>

        <div class="flex items-center gap-2 ml-2">
          <label for="secsPerPage" class="text-sm text-neutral-300">Sek./Seite</label>
          <input id="secsPerPage" type="number" min="5" max="600" step="1"
                 class="w-20 sm:w-24 px-2 py-1 rounded bg-neutral-800 border border-neutral-700" />
        </div>

        <!-- ONE Play/Pause button -->
        <button id="btnPlayPause" class="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white">
          ▶︎ Start
        </button>

        <span id="status" class="ml-auto text-sm text-neutral-400"></span>
      </div>
    </div>

    <!-- App logic embedded as module -->
    <script type="module">
      // force same-origin worker to avoid blob/CORS issues (Safari/iPad)
      pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.js";

  const $ = (sel, el = document) => el.querySelector(sel);
  const encodePathSegments = (rel) => rel.split('/').map(encodeURIComponent).join('/');
      const appEl = document.querySelector('#app');
      const controlsEl = document.querySelector('#controls');
      const headerActionsEl = document.querySelector('#header-actions');
  let uploadBtn = null;

      // Icons for playlist toggle (add/remove)
      const SVG_PLAYLIST_ADD = `
        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M120-320v-80h280v80H120Zm0-160v-80h440v80H120Zm0-160v-80h440v80H120Zm520 480v-160H480v-80h160v-160h80v160h160v80H720v160h-80Z"/>
        </svg>`;
      const SVG_PLAYLIST_REMOVE = `
        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="m576-80-56-56 104-104-104-104 56-56 104 104 104-104 56 56-104 104 104 104-56 56-104-104L576-80ZM120-320v-80h280v80H120Zm0-160v-80h440v80H120Zm0-160v-80h440v80H120Z"/>
        </svg>`;
      const SVG_CATEGORY_ADD = `
        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M480-160v-80h120l180-240-180-240H160v200H80v-200q0-33 23.5-56.5T160-800h440q19 0 36 8.5t28 23.5l216 288-216 288q-11 15-28 23.5t-36 8.5H480Zm-10-320ZM200-120v-120H80v-80h120v-120h80v120h120v80H280v120h-80Z"/>
        </svg>`;

      // Icons for playlist list UI
      const SVG_PLAY = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M8 5v14l11-7z"></path>
        </svg>`;
      const SVG_TRASH = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>`;
      const SVG_CHEV_UP = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>`;
      const SVG_CHEV_DOWN = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>`;

      // Playlist client state
      const playlist = {
        items: [], // array of rel names
        currentIndex: -1,
        name: null,
        updatedAt: 0,
        es: null,
        mode: localStorage.getItem('playlistMode') === '1'
      };

      // Reflect fullscreen state on <html> to enable safe-area CSS
      document.addEventListener("fullscreenchange", () => {
        document.documentElement.classList.toggle("is-fs", !!document.fullscreenElement);
      });

      // --- Memory Management ---
      function checkMemoryPressure() {
        const now = Date.now();
        if (now - state.memory.lastCheck < state.memory.checkInterval) return;
        state.memory.lastCheck = now;
        
        try {
          // Use performance.memory if available (Chrome/Edge)
          if (performance.memory) {
            const { usedJSHeapSize, totalJSHeapSize } = performance.memory;
            const memoryUsage = usedJSHeapSize / totalJSHeapSize;
            state.memory.isLowMemory = memoryUsage > 0.8; // 80% threshold
            
            if (state.memory.isLowMemory) {
              console.warn('High memory usage detected:', Math.round(memoryUsage * 100) + '%');
              aggressiveCleanup();
            }
          }
        } catch (e) {
          // Fallback: assume low memory on iPad/mobile after extended use
          const isTouch = 'ontouchstart' in window;
          if (isTouch && state.thumbs.cache.size > 20) {
            state.memory.isLowMemory = true;
            aggressiveCleanup();
          }
        }
      }
      
      function aggressiveCleanup() {
        console.log('Performing aggressive memory cleanup...');
        
        // Clear offscreen canvases in viewer
        const container = document.querySelector('#viewer');
        if (container) {
          const canvases = container.querySelectorAll('canvas');
          canvases.forEach((canvas, index) => {
            const rect = canvas.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const isVisible = rect.bottom > containerRect.top && rect.top < containerRect.bottom;
            
            // Keep only visible canvases and a few around them
            if (!isVisible && index > 5) {
              const ctx = canvas.getContext('2d');
              if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
              canvas.width = canvas.height = 0;
              canvas.remove();
            }
          });
        }
        
        // Force garbage collection if available
        if (window.gc) {
          try { window.gc(); } catch (e) {}
        }
      }

      // --- Wake Lock: default ON in viewer (auto + resilient) ---
      function setWakeBtn(active) {
        const btn = document.querySelector('#btnWakeLock');
        if (btn) btn.textContent = active ? '☀︎ Screen On ✓' : '☀︎ Screen On';
      }
      function armWakeLockFromGestures(rootEl = document) {
        const once = async () => {
          await acquireWakeLockAuto();
          window.removeEventListener('pointerdown', once);
          window.removeEventListener('keydown', once);
          rootEl.removeEventListener?.('touchstart', once);
          rootEl.removeEventListener?.('pointerdown', once);
        };
        window.addEventListener('pointerdown', once, { once: true });
        window.addEventListener('keydown', once, { once: true });
        rootEl.addEventListener?.('touchstart', once, { once: true, passive: true });
        rootEl.addEventListener?.('pointerdown', once, { once: true });
      }
      async function acquireWakeLockAuto() {
        // Prefer Screen Wake Lock API
        try {
          if ('wakeLock' in navigator) {
            if (!state.viewer.wakeLock) {
              state.viewer.wakeLock = await navigator.wakeLock.request('screen');
              state.viewer.wakeLock.addEventListener?.('release', () => {
                state.viewer.wakeLock = null;
                setWakeBtn(false);
                if (document.body.classList.contains('in-viewer')) {
                  // try to re-acquire silently
                  acquireWakeLockAuto();
                }
              });
            }
            if (state.viewer.wakeDesired) setWakeBtn(true);
            return true;
          }
        } catch (e) {
          console.warn('WakeLock.request failed', e);
        }
        // Fallback: NoSleep.js (must be created from a user gesture on iOS)
        try {
          if (!state.viewer.noSleep && window.NoSleep) {
            state.viewer.noSleep = new window.NoSleep();
          }
          if (state.viewer.noSleep && !state.viewer.noSleepEnabled) {
            state.viewer.noSleep.enable(); // may throw if not from gesture on iOS
            state.viewer.noSleepEnabled = true;
            if (state.viewer.wakeDesired) setWakeBtn(true);
            return true;
          }
        } catch (e) {
          console.warn('NoSleep.enable failed (needs user gesture on iOS)', e);
        }
        return false;
      }
      
      // Synchrone Wake Lock Aktivierung für iOS/iPad - MUSS im Click-Handler aufgerufen werden
      function acquireWakeLockSync() {
        // NoSleep.js SOFORT aktivieren (synchron, in der User-Geste)
        try {
          if (!state.viewer.noSleep && window.NoSleep) {
            state.viewer.noSleep = new window.NoSleep();
          }
          if (state.viewer.noSleep && !state.viewer.noSleepEnabled) {
            state.viewer.noSleep.enable();
            state.viewer.noSleepEnabled = true;
            if (state.viewer.wakeDesired) setWakeBtn(true);
          }
        } catch (e) {
          console.warn('NoSleep sync activation failed', e);
        }
        // Wake Lock API async im Hintergrund
        if ('wakeLock' in navigator && !state.viewer.wakeLock) {
          navigator.wakeLock.request('screen').then(lock => {
            state.viewer.wakeLock = lock;
            lock.addEventListener?.('release', () => {
              state.viewer.wakeLock = null;
              setWakeBtn(false);
              if (document.body.classList.contains('in-viewer')) {
                acquireWakeLockAuto();
              }
            });
            if (state.viewer.wakeDesired) setWakeBtn(true);
          }).catch(e => {
            console.warn('WakeLock.request failed', e);
          });
        }
      }
      async function releaseWakeLock() {
        try { if (state.viewer.wakeLock) { await state.viewer.wakeLock.release(); state.viewer.wakeLock = null; } } catch {}
        try { if (state.viewer.noSleep && state.viewer.noSleepEnabled) { state.viewer.noSleep.disable(); state.viewer.noSleepEnabled = false; } } catch {}
        setWakeBtn(false);
      }

      // Wake-lock watchdog: re-assert lock every 15s while in viewer
      function startWakeWatch() {
        stopWakeWatch();
        state.viewer.wakeTimer = setInterval(() => {
          if (document.visibilityState === 'visible' && document.body.classList.contains('in-viewer')) {
            acquireWakeLockAuto();
          }
        }, 15000);
      }
      function stopWakeWatch() {
        if (state.viewer.wakeTimer) { clearInterval(state.viewer.wakeTimer); state.viewer.wakeTimer = null; }
      }
      // Re-acquire when the tab becomes visible again (Safari can drop locks)
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && document.body.classList.contains('in-viewer')) {
          acquireWakeLockAuto();
        }
      });
      // Re-acquire on fullscreen/rotation changes (often releases locks on iPadOS)
      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement && document.body.classList.contains('in-viewer')) {
          acquireWakeLockAuto();
        }
      });
      window.addEventListener('orientationchange', () => {
        if (document.body.classList.contains('in-viewer')) acquireWakeLockAuto();
      });
      window.addEventListener('pageshow', () => {
        if (document.body.classList.contains('in-viewer')) acquireWakeLockAuto();
      });
      window.addEventListener('pagehide', () => {
        // nothing; iOS may suspend timers – watchdog will restart on pageshow
      });

      const params = new URLSearchParams(location.search);
      const currentFile = params.get("file"); // encoded

      // ---- Global State (simplified for server-side thumbnails) ----
      const state = {
        library: {
          total: 0,
          sort: localStorage.getItem("libSort") || "name",
          order: localStorage.getItem("libOrder") || "asc",
          q: "",
          view: localStorage.getItem("libView") || "grid",
          favorites: new Set(),
          onlyFavorites: localStorage.getItem("onlyFav") === "true",
          pageSize: "80",
          page: 1,
          items: [],
          categoryFilter: localStorage.getItem("libCategory") || null
        },
        viewer: {
          fileName: null, url: null, numPages: 0,
          secsPerPage: 45,
          autoScroll: { running: false, lastTs: 0, speedPxPerSec: 0, needsRecalc: false, pending: false, token: null, pos: 0 },
          wakeDesired: false,
          wakeLock: null, noSleep: null, noSleepEnabled: false,
          wakeTimer: null,
          categories: [],
          layoutObserver: null
        },
        categories: [],
        ui: {
          accentColor: null,
          accentSource: null,
          uploadOpen: false,
          uploadLimitMb: 200,
          uploadSupported: true
        },
        thumbs: {
          cache: new Map(),
          maxCacheSize: 48,
          lastCleanup: 0
        },
        memory: {
          lastCheck: 0,
          isLowMemory: false,
          checkInterval: 10000 // Check every 10s
        }
      };

      // ===== Router =====
      (async function init() {
        // Initialize playlist sync early for UI affordances
        try { await fetchPlaylist(); } catch {}
        connectPlaylistEvents();
        if (currentFile) {
          await hydrateCategories();
          await renderViewer(decodeURIComponent(currentFile));
        } else {
          await loadPrefsFromBackend();
          await hydrateCategories();
          await loadPage();
          renderLibrary();
        }
      })();

      // ===== Backend Prefs =====
      async function loadPrefsFromBackend() {
        try {
          const res = await fetch("/api/prefs", { cache: "no-store" });
          if (!res.ok) return;
          const prefs = await res.json();
          if (Array.isArray(prefs.favorites)) {
            state.library.favorites = new Set(prefs.favorites);
          }
        } catch {}
      }
      async function setFavoriteOnBackend(name, favorite) {
        try {
          const res = await fetch("/api/prefs/favorites", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, favorite })
          });
          if (res.ok) {
            const j = await res.json();
            if (Array.isArray(j.favorites)) {
              state.library.favorites = new Set(j.favorites);
            }
          }
        } catch {}
      }
      async function getFilePrefsFromBackend(name) {
        try {
          const res = await fetch(`/api/prefs/file?name=${encodeURIComponent(name)}`, { cache: "no-store" });
          if (!res.ok) return null;
          const j = await res.json();
          return {
            secsPerPage: Number(j.secsPerPage) || null,
            categories: Array.isArray(j.categories) ? j.categories : [],
            categoryIds: Array.isArray(j.categoryIds) ? j.categoryIds : []
          };
        } catch { return null; }
      }
      async function setFileSecsOnBackend(name, secs) {
        try {
          await fetch("/api/prefs/file", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, secsPerPage: secs })
          });
        } catch {}
      }

      async function setFileCategoriesOnBackend(name, categories) {
        try {
          const res = await fetch("/api/prefs/file", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, categories })
          });
          if (res?.ok) {
            const payload = await res.json();
            return payload;
          }
        } catch {}
        return null;
      }

      async function hydrateCategories() {
        try {
          const res = await fetch("/api/categories", { cache: "no-store" });
          if (!res.ok) return;
          const data = await res.json();
          if (Array.isArray(data.categories)) {
            state.categories = data.categories;
            // Preserve special filter 'none' (uncategorized)
            if (state.library.categoryFilter && state.library.categoryFilter !== 'none' && !state.categories.some(cat => cat.id === state.library.categoryFilter)) {
              state.library.categoryFilter = null;
              localStorage.removeItem("libCategory");
            }
          }
        } catch {}
      }

      async function createCategoryOnBackend(payload) {
        try {
          const res = await fetch("/api/categories", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (res?.ok) {
            const data = await res.json();
            if (Array.isArray(data.categories)) {
              state.categories = data.categories;
            }
            return data.category || null;
          }
        } catch {}
        return null;
      }

      async function updateCategoryOnBackend(id, payload) {
        try {
          const res = await fetch(`/api/categories/${encodeURIComponent(id)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (res?.ok) {
            const data = await res.json();
            if (Array.isArray(data.categories)) {
              state.categories = data.categories;
            }
            return data.category || null;
          }
        } catch {}
        return null;
      }

      async function deleteCategoryOnBackend(id) {
        try {
          const res = await fetch(`/api/categories/${encodeURIComponent(id)}`, {
            method: "DELETE"
          });
          if (res?.ok) {
            const data = await res.json();
            if (Array.isArray(data.categories)) {
              state.categories = data.categories;
            }
            return true;
          }
        } catch {}
        return false;
      }

      const categoryHelpers = {
        byId(id) {
          return state.categories.find((cat) => cat.id === id) || null;
        },
        toChip(cat, size = "sm") {
          if (!cat) return "";
          const px = size === "lg" ? "0.35rem 0.75rem" : "0.2rem 0.55rem";
          const font = size === "lg" ? "0.8rem" : "0.72rem";
          return `<span class="category-chip" style="background:${cat.color}1a;border-color:${cat.color}44;color:${cat.color};padding:${px};font-size:${font};">${cat.icon || "♪"}<span class="truncate max-w-[8rem] inline-block align-middle">${cat.name}</span></span>`;
        }
      };

      function applyAccentTheme(catId) {
        const targetCat = catId ? categoryHelpers.byId(catId) : null;
        const accent = targetCat?.color || null;
        const icon = targetCat?.icon || null;
        state.ui.accentColor = accent;
        state.ui.accentSource = targetCat ? { id: targetCat.id, icon } : null;

        const root = document.documentElement;
        if (accent) {
          root.style.setProperty("--accent-color", accent);
          root.style.setProperty("--accent-soft", `${accent}26`);
          root.style.setProperty("--accent-muted", `${accent}4d`);
          document.body.setAttribute("data-accent-active", "true");
        } else {
          root.style.setProperty("--accent-color", "#6366F1");
          root.style.setProperty("--accent-soft", "rgba(99, 102, 241, 0.16)");
          root.style.setProperty("--accent-muted", "rgba(99, 102, 241, 0.35)");
          document.body.removeAttribute("data-accent-active");
        }
      }

      const DEFAULT_UPLOAD_LIMIT_MB = 200;

      function ensureUploadButton() {
        // Check if button exists AND is still in the DOM
        if (uploadBtn && uploadBtn.isConnected) return;
        
        uploadBtn = document.createElement('button');
        uploadBtn.id = 'headerUploadBtn';
        uploadBtn.type = 'button';
        uploadBtn.setAttribute('aria-label', 'Neues PDF hochladen');
        uploadBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Upload</span>
        `;
        uploadBtn.addEventListener('click', () => {
          openUploadDialog();
        });
        headerActionsEl.appendChild(uploadBtn);
      }

      function setUploadButtonVisible(visible) {
        if (!uploadBtn || !uploadBtn.isConnected) return;
        const shouldShow = Boolean(visible && !state.ui.uploadOpen && state.ui.uploadSupported);
        uploadBtn.hidden = !shouldShow;
      }

      async function openUploadDialog() {
        if (state.ui.uploadOpen) return;
        state.ui.uploadOpen = true;
        let backdrop = null;
        try {
          try { await hydrateCategories(); } catch (err) { console.warn('Kategorien konnten nicht aktualisiert werden:', err); }

          ensureUploadButton();
          setUploadButtonVisible(false);

          const categories = Array.isArray(state.categories) ? state.categories : [];
          const selected = new Set();
          const limitMb = state.ui.uploadLimitMb || DEFAULT_UPLOAD_LIMIT_MB;

          const categoriesMarkup = categories.length
            ? categories.map((cat) => {
              const color = cat.color || '#6366F1';
              return `<button type="button" class="category-pill px-3 py-1.5 rounded-full border border-neutral-700/70 text-sm text-neutral-200 hover:bg-neutral-800 flex items-center gap-2" data-cat="${cat.id}">
                  <span class="text-lg">${cat.icon || '♪'}</span>
                  <span>${cat.name}</span>
                  <span data-role="indicator" class="hidden text-xs text-emerald-300">✓</span>
                </button>`;
            }).join('')
            : '<div class="rounded-xl border border-dashed border-neutral-700 p-4 text-neutral-400 text-sm">Keine Kategorien vorhanden.</div>';

          backdrop = document.createElement('div');
          backdrop.className = 'modal-backdrop';
          backdrop.dataset.modal = 'upload';
          backdrop.innerHTML = `
            <div class="glass-panel w-[560px] max-w-full p-6 text-sm text-neutral-200" role="dialog" aria-modal="true">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <div class="text-xs uppercase tracking-wide text-neutral-500">Bibliothek</div>
                  <h2 class="text-lg font-semibold text-neutral-100">Neues PDF hinzufügen</h2>
                </div>
                <button type="button" class="px-2 py-1 rounded-full border border-neutral-700 text-neutral-400 hover:text-neutral-200" data-role="close">✕</button>
              </div>
              <form id="uploadForm" class="mt-5 space-y-4" enctype="multipart/form-data">
                <label class="flex flex-col gap-2 text-sm text-neutral-300">
                  <span class="text-xs uppercase tracking-wide text-neutral-400">PDF Datei</span>
                  <input type="file" name="file" accept="application/pdf" required class="px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-700 text-sm" />
                  <span data-role="fileLabel" class="text-xs text-neutral-500">${limitMb} MB max • Nur PDF</span>
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <label class="text-xs uppercase tracking-wide text-neutral-400">Scrollzeit pro Seite
                    <input type="number" name="secsPerPage" min="5" max="600" class="mt-1 w-full px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-700" placeholder="z.B. 45" />
                  </label>
                  <label class="flex items-center gap-2 text-sm text-neutral-300 sm:mt-6">
                    <input type="checkbox" name="favorite" class="h-4 w-4 rounded border-neutral-600 bg-neutral-900" />
                    <span>Als Favorit markieren</span>
                  </label>
                </div>
                <div>
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xs uppercase tracking-wide text-neutral-400">Kategorien (optional)</span>
                    <button type="button" data-role="manage" class="text-xs text-emerald-400 hover:text-emerald-200">Neue Kategorie</button>
                  </div>
                  <div id="uploadCategoryList" class="mt-3 flex flex-wrap gap-2">${categoriesMarkup}</div>
                </div>
                <p data-role="status" class="text-xs text-amber-400 min-h-[1.25rem]"></p>
                <div class="flex justify-end gap-2">
                  <button type="button" data-role="cancel" class="px-3 py-2 rounded-lg border border-neutral-700 text-neutral-200 hover:bg-neutral-800">Abbrechen</button>
                  <button type="submit" class="px-3 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-500">Hochladen</button>
                </div>
              </form>
            </div>`;

          document.body.appendChild(backdrop);

          const form = backdrop.querySelector('#uploadForm');
          const statusEl = form.querySelector('[data-role="status"]');
          const fileInput = form.querySelector('input[name="file"]');
          const fileLabel = form.querySelector('[data-role="fileLabel"]');
          const favoriteInput = form.querySelector('input[name="favorite"]');
          const secsInput = form.querySelector('input[name="secsPerPage"]');
          const submitBtn = form.querySelector('button[type="submit"]');
          const cancelBtn = form.querySelector('[data-role="cancel"]');
          const manageBtn = form.querySelector('[data-role="manage"]');

          let modalClosed = false;
          const handleKeyDown = (ev) => {
            if (ev.key === 'Escape') {
              ev.preventDefault();
              closeModal();
            }
          };

          function closeModal() {
            if (modalClosed) return;
            modalClosed = true;
            document.removeEventListener('keydown', handleKeyDown);
            backdrop.remove();
            state.ui.uploadOpen = false;
            setUploadButtonVisible(true);
            uploadBtn?.focus();
          }

          document.addEventListener('keydown', handleKeyDown);

          backdrop.addEventListener('click', (ev) => {
            if (ev.target === backdrop) closeModal();
          });

          backdrop.querySelectorAll('[data-role="close"]').forEach((btn) => btn.addEventListener('click', closeModal));
          cancelBtn?.addEventListener('click', closeModal);

          if (manageBtn) {
            manageBtn.addEventListener('click', () => {
              closeModal();
              openCategoryManager({ focusMode: 'create' });
            });
          }

          backdrop.querySelectorAll('[data-cat]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-cat');
              if (!id) return;
              if (selected.has(id)) {
                selected.delete(id);
                btn.classList.remove('is-selected');
                btn.querySelector('[data-role="indicator"]')?.classList.add('hidden');
              } else {
                selected.add(id);
                btn.classList.add('is-selected');
                btn.querySelector('[data-role="indicator"]')?.classList.remove('hidden');
              }
            });
          });

          fileInput.addEventListener('change', () => {
            const name = fileInput.files?.[0]?.name;
            fileLabel.textContent = name ? `Ausgewählt: ${name}` : `${limitMb} MB max • Nur PDF`;
            statusEl.textContent = '';
          });

          form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            statusEl.textContent = '';
            const file = fileInput.files?.[0];
            if (!file) {
              statusEl.textContent = 'Bitte wähle eine PDF-Datei aus.';
              return;
            }
            const lowerName = (file.name || '').toLowerCase();
            const declaredType = (file.type || '').toLowerCase();
            if (!declaredType.includes('pdf') && !lowerName.endsWith('.pdf')) {
              statusEl.textContent = 'Nur PDF-Dateien können hochgeladen werden.';
              return;
            }
            const secsRaw = (secsInput.value || '').trim();
            let secsValue = null;
            if (secsRaw) {
              const parsed = Number(secsRaw);
              if (!Number.isFinite(parsed) || parsed < 5 || parsed > 600) {
                statusEl.textContent = 'Sekunden pro Seite müssen zwischen 5 und 600 liegen.';
                return;
              }
              secsValue = Math.round(parsed);
            }
            const metaPayload = {
              originalName: file.name || 'upload.pdf',
              categories: Array.from(selected),
              favorite: favoriteInput.checked
            };
            if (secsValue !== null) metaPayload.secsPerPage = secsValue;

            submitBtn.disabled = true;
            cancelBtn.disabled = true;
            submitBtn.textContent = 'Lade hoch…';

            try {
              // Avoid setting Content-Type explicitly to let the browser choose;
              // some iOS browsers throw TypeError on manual Content-Type with Blob bodies.
              const headers = new Headers({
                'X-Upload-Name': (file.name && file.name.toLowerCase().endsWith('.pdf')) ? file.name : (file.name || 'upload.pdf'),
                'X-Upload-Meta': JSON.stringify(metaPayload),
                'Accept': 'application/json'
              });

              const res = await fetch('/api/upload', { method: 'POST', headers, body: file });
              let payload;
              try {
                payload = await res.json();
              } catch {
                payload = {};
              }
              if (!res.ok || !payload.ok) {
                const err = new Error(payload.error || 'Upload fehlgeschlagen.');
                err.status = res.status;
                throw err;
              }
              state.ui.uploadSupported = true;
              if (Array.isArray(payload.favorites)) {
                state.library.favorites = new Set(payload.favorites);
              }
              if (payload.maxUploadBytes) {
                const mb = Math.round(Number(payload.maxUploadBytes) / 1024 / 1024);
                if (Number.isFinite(mb) && mb > 0) {
                  state.ui.uploadLimitMb = mb;
                }
              }
              closeModal();
              await loadPage();
              renderLibrary();
            } catch (error) {
              // Normalize Safari/iOS TypeError messages
              if (error?.name === 'TypeError' && !error.status) {
                error.message = 'Netzwerkfehler beim Upload (TypeError). Bitte erneut versuchen.';
              }
              if (error.status === 503) {
                state.ui.uploadSupported = false;
                statusEl.textContent = error.message || 'Uploads sind aktuell nicht verfügbar.';
                setTimeout(() => {
                  closeModal();
                  setUploadButtonVisible(false);
                }, 1000);
                return;
              }
              if (error.status === 413) {
                statusEl.textContent = `Datei ist zu groß (max. ${limitMb} MB).`;
              } else if (error.status === 415) {
                statusEl.textContent = 'Nur PDF-Dateien erlaubt.';
              } else {
                statusEl.textContent = error.message || 'Upload fehlgeschlagen.';
              }
              submitBtn.disabled = false;
              cancelBtn.disabled = false;
              submitBtn.textContent = 'Hochladen';
            }
          });

          requestAnimationFrame(() => fileInput.focus());
        } catch (err) {
          console.error('Upload-Dialog konnte nicht geöffnet werden:', err);
          if (backdrop?.isConnected) backdrop.remove();
          state.ui.uploadOpen = false;
          setUploadButtonVisible(true);
        }
      }

      // ===== API (Library) =====
      async function fetchPage({ q = "", sort, order, page, pageSize, fav = false, category = null }) {
        const qs = new URLSearchParams({ q, sort, order, page: String(page), pageSize: String(pageSize) });
        if (fav) qs.set("fav", "1");
        if (category) qs.set("category", category);
        const res = await fetch(`/api/sheets?${qs.toString()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("API error");
        return res.json();
      }
      async function loadPage() {
        const L = state.library;
        // Keep page fixed when paginating; don't reset page here.
        const data = await fetchPage({ q: L.q, sort: L.sort, order: L.order, page: L.page, pageSize: L.pageSize, fav: L.onlyFavorites, category: L.categoryFilter });
        L.items = data.items || [];
        L.total = data.total || 0;
        if (Array.isArray(data.categories)) {
          state.categories = data.categories;
          // Preserve special filter 'none' (uncategorized)
          if (L.categoryFilter && L.categoryFilter !== 'none' && !state.categories.some(cat => cat.id === L.categoryFilter)) {
            L.categoryFilter = null;
            localStorage.removeItem("libCategory");
          }
        }
      }

      async function applyCategoryFilter(catId) {
        state.library.categoryFilter = catId || null;
        // Do not accent the synthetic 'none' filter
        applyAccentTheme(state.library.categoryFilter === 'none' ? null : state.library.categoryFilter);
        if (state.library.categoryFilter) localStorage.setItem("libCategory", state.library.categoryFilter);
        else localStorage.removeItem("libCategory");
        state.library.page = 1;
        appEl.innerHTML = '<div class="flex items-center justify-center h-[60vh] text-neutral-400">Lade…</div>';
        await loadPage();
        renderLibrary();
      }

      // ===== Library UI =====
      function renderLibrary() {
        document.body.classList.remove('in-viewer');
        // Ensure fullscreen is exited when returning to library
        if (document.fullscreenElement) {
          try { document.exitFullscreen(); } catch {}
        }
        releaseWakeLock();
        stopWakeWatch();
        stopAutoScroll();
        if (state.viewer.layoutObserver) {
          state.viewer.layoutObserver.disconnect();
          state.viewer.layoutObserver = null;
        }
        
        // Cleanup viewer memory when returning to library
        aggressiveCleanup();
        
        controlsEl.classList.add("hidden");
        headerActionsEl.innerHTML = "";

        // If playlist mode is active, render the playlist overview instead of the normal library
        if (playlist.mode) {
          renderPlaylistLibrary();
          return;
        }

        const L = state.library;
        applyAccentTheme(L.categoryFilter);
        const allMode = L.pageSize === "all";
        const favCls = L.onlyFavorites
          ? "bg-amber-500/20 border-amber-400 text-amber-300"
          : "bg-neutral-900 border-neutral-800";
        const totalPages = Math.max(1, Math.ceil(L.total / L.pageSize));

        appEl.innerHTML = `
          <section class="mb-4 flex flex-wrap items-center gap-2">
            <input id="search" placeholder="Suche nach Titel…"
                  class="w-full sm:w-72 px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-800" />
            <select id="sort" class="px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-800">
              <option value="name">Name</option>
              <option value="mtime">Zuletzt geändert</option>
              <option value="size">Dateigröße</option>
            </select>
            <select id="order" class="px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-800">
              <option value="asc">↑ aufsteigend</option>
              <option value="desc">↓ absteigend</option>
            </select>
            <button id="toggleView" class="px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-800">
              Ansicht: ${L.view === "grid" ? "Grid" : "Liste"}
            </button>
            <button id="filterFav" class="px-3 py-2 rounded-lg ${favCls}" aria-pressed="${L.onlyFavorites}">★ Favoriten</button>
            <span class="hidden sm:inline sm:ml-auto text-sm text-neutral-400">Seite ${L.page} / ${totalPages} • ${L.total} Dateien</span>
          </section>
          <section id="categoryBar" class="mb-4 flex flex-wrap items-center gap-2"></section>
          <section id="virtualWrap" class="relative overflow-auto border border-neutral-800 rounded-xl bg-neutral-900 h-[70vh]"></section>
          <section class="mt-3 flex items-center justify-between">
            <button id="prevPage" class="px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-800 ${L.page<=1?"invisible pointer-events-none select-none opacity-0":""}" ${L.page<=1?"aria-disabled=\"true\" tabindex=\"-1\"":""}>« Zurück</button>
            <div class="text-sm text-neutral-400">Seite <span id="pNow">${L.page}</span> / ${totalPages}</div>
            <button id="nextPage" class="px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-800 ${L.page>=totalPages?"invisible pointer-events-none select-none opacity-0":""}" ${L.page>=totalPages?"aria-disabled=\"true\" tabindex=\"-1\"":""}>Weiter »</button>
          </section>`;

  renderCategoryBar();

        const activeHeaderCategory = state.library.categoryFilter ? categoryHelpers.byId(state.library.categoryFilter) : null;
        if (activeHeaderCategory) {
          headerActionsEl.innerHTML = `<span class="category-chip" style="background:${activeHeaderCategory.color}1f;border-color:${activeHeaderCategory.color}44;color:${activeHeaderCategory.color};">${activeHeaderCategory.icon || '♪'}<span>${activeHeaderCategory.name}</span></span>`;
        }
        // Add header segmented mode switch + upload
        ensureModeSwitcher();
        ensureUploadButton();
        setUploadButtonVisible(true);

        const searchEl = document.querySelector('#search');
        const sortEl = document.querySelector('#sort');
        const orderEl = document.querySelector('#order');
        const viewBtn = document.querySelector('#toggleView');

        searchEl.value = L.q;
        sortEl.value = L.sort;
        orderEl.value = L.order;

        let searchTimer = null;
        searchEl.addEventListener("input", (e) => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(async () => {
            state.library.q = e.target.value.trim();
            state.library.page = 1;
            appEl.innerHTML = '<div class="flex items-center justify-center h-[70vh] text-neutral-400">Lade…</div>';
            await loadPage();
            renderLibrary();
          }, 300);
        });

        sortEl.onchange = async (e) => {
          L.sort = e.target.value; localStorage.setItem("libSort", L.sort);
          L.page = 1;
          appEl.innerHTML = '<div class="flex items-center justify-center h-[70vh] text-neutral-400">Lade…</div>';
          await loadPage();
          renderLibrary();
        };
        orderEl.onchange = async (e) => {
          L.order = e.target.value; localStorage.setItem("libOrder", L.order);
          L.page = 1;
          appEl.innerHTML = '<div class="flex items-center justify-center h-[70vh] text-neutral-400">Lade…</div>';
          await loadPage();
          renderLibrary();
        };
        viewBtn.onclick = () => {
          L.view = L.view === "grid" ? "list" : "grid";
          localStorage.setItem("libView", L.view);
          renderLibrary();
        };

        document.querySelector('#filterFav').onclick = async () => {
          L.onlyFavorites = !L.onlyFavorites;
          localStorage.setItem("onlyFav", String(L.onlyFavorites));
          L.page = 1;
          appEl.innerHTML = '<div class="flex items-center justify-center h-[70vh] text-neutral-400">Lade…</div>';
          await loadPage();
          renderLibrary();
        };
        document.querySelector('#prevPage').onclick = async () => {
          if (L.page > 1) {
            L.page--;
            appEl.innerHTML = '<div class="flex items-center justify-center h-[70vh] text-neutral-400">Lade…</div>';
            await loadPage();
            renderLibrary();
          }
        };
        document.querySelector('#nextPage').onclick = async () => {
          const totalPages = Math.max(1, Math.ceil(L.total / L.pageSize));
          if (L.page < totalPages) {
            L.page++;
            appEl.innerHTML = '<div class="flex items-center justify-center h-[70vh] text-neutral-400">Lade…</div>';
            await loadPage();
            renderLibrary();
          }
        };

        // Memory status display
        

        function renderCategoryBar() {
          const host = document.querySelector('#categoryBar');
          if (!host) return;
          const categories = state.categories;
          const activeId = state.library.categoryFilter;

          if (!categories.length) {
            host.innerHTML = `
              <div class="flex flex-wrap items-center gap-3 text-sm text-neutral-400">
                <span>Keine Kategorien angelegt.</span>
                <button id="btnCreateCategoryPrimary" class="px-3 py-1.5 rounded-full bg-neutral-800 hover:bg-neutral-700 border border-neutral-700">Kategorie erstellen</button>
              </div>`;
            const createBtn = document.querySelector('#btnCreateCategoryPrimary');
            if (createBtn) createBtn.addEventListener('click', () => openCategoryManager({ focusMode: 'create' }));
            applyAccentTheme(null);
            return;
          }

          const pills = categories.map((cat) => {
            const isActive = cat.id === activeId;
            const bg = isActive ? `${cat.color}33` : `${cat.color}1a`;
            const border = isActive ? cat.color : `${cat.color}40`;
            const text = isActive ? '#f8fafc' : cat.color;
            const fontWeight = isActive ? 'font-semibold' : 'font-medium';
            return `<button class="category-pill px-3 py-1.5 rounded-full border flex items-center gap-2 text-sm ${fontWeight}" data-cat="${cat.id}" style="background:${bg};border-color:${border};color:${text};">
                <span class="text-base leading-none">${cat.icon || '♪'}</span>
                <span>${cat.name}</span>
              </button>`;
          }).join("");
          // Special pill for uncategorized
          const noneActive = activeId === 'none';
          const noneBtn = `<button class="category-pill px-3 py-1.5 rounded-full border flex items-center gap-2 text-sm ${noneActive ? 'font-semibold' : 'font-medium'}" data-cat="none" style="background:${noneActive ? 'rgba(148,163,184,0.28)' : 'rgba(148,163,184,0.12)'};border-color:${noneActive ? '#94a3b8' : 'rgba(148,163,184,0.35)'};color:${noneActive ? '#e5e7eb' : '#94a3b8'};">
                <span class="text-base leading-none">◌</span>
                <span>Ohne Kategorie</span>
              </button>`;

          const clearBtn = activeId ? `<button id="btnClearCategory" class="px-3 py-1.5 rounded-full border border-neutral-700 text-sm text-neutral-300 hover:bg-neutral-800">Filter zurücksetzen</button>` : '';

          host.innerHTML = `
            <div class="flex flex-wrap items-center gap-2">
              ${pills}
              ${noneBtn}
              ${clearBtn}
              <button id="btnManageCategories" class="ml-auto px-3 py-1.5 rounded-full border border-neutral-700 text-sm text-neutral-200 hover:bg-neutral-800">Kategorien verwalten</button>
            </div>`;

          host.querySelectorAll('[data-cat]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const id = btn.getAttribute('data-cat');
              const target = id === state.library.categoryFilter ? null : id;
              await applyCategoryFilter(target);
            });
          });

          const clear = document.querySelector('#btnClearCategory');
          if (clear) clear.addEventListener('click', async () => await applyCategoryFilter(null));

      async function fetchPlaylist() {
        try {
          const res = await fetch('/api/playlist', { cache: 'no-store' });

          applyPlaylistSnapshot(data);
        } catch {}

      function connectPlaylistEvents() {
        try { playlist.es?.close?.(); } catch {}
        const es = new EventSource('/api/playlist/events');
        es.onmessage = (ev) => {
          try { const data = JSON.parse(ev.data); applyPlaylistSnapshot(data); } catch {}
        };
        es.onerror = () => { try { es.close(); } catch {}; setTimeout(connectPlaylistEvents, 2000); };
        playlist.es = es;
      }
      function applyPlaylistSnapshot(data) {
        if (!data || typeof data !== 'object') return;

        playlist.currentIndex = Number.isInteger(data.currentIndex) ? data.currentIndex : -1;
        playlist.name = data.name || null;
        playlist.updatedAt = Number(data.updatedAt) || Date.now();
        // Update any open panels or controls
        updatePlaylistPanel();
        updateViewerPlaylistControls();
        updateLibraryPlaylistButtons();
        if (!document.body.classList.contains('in-viewer') && playlist.mode) {
          // If we're in library and playlist is visible, refresh the grid
          renderPlaylistLibrary();

            if (!Number.isFinite(idx)) return;
            const rel = playlist.items[idx];
            if (!rel) return;
            if (act === 'remove') {
              await removeFromPlaylist(rel);

              await setPlaylistCurrentIndex(idx);
              // open viewer with this file
              history.replaceState(null, '', '/');

            } else if (act === 'up' || act === 'down') {
              const order = [...playlist.items];
              const to = act === 'up' ? Math.max(0, idx - 1) : Math.min(order.length - 1, idx + 1);
              if (to !== idx) {

                order.splice(to, 0, m);

              }
            }

        });

      // ===== Virtualized Grid/List (simplified without canvas thumbnails) =====
      function mountVirtualizer(resetScroll = false) {
        const wrap = document.querySelector('#virtualWrap');
        wrap.innerHTML = "";

        const L = state.library;
        let items = L.items;

        const fuse = window.Fuse && L.q
          ? new Fuse(items, { keys: ["name"], threshold: 0.3 })
          : null;
        if (fuse) items = fuse.search(L.q).map(r => r.item);

        const isGrid = L.view === "grid";
  const cardW = isGrid ? 220 : wrap.clientWidth;
  const cardH = isGrid ? 360 : 72;
        const gap = isGrid ? 12 : 0;
        let cols = isGrid ? Math.max(1, Math.floor((wrap.clientWidth - 16) / (cardW + gap))) : 1;

        const total = items.length;
        const rows = Math.ceil(total / cols);
        const totalHeight = rows * (cardH + (isGrid ? gap : 0));

        const scroller = document.createElement("div");
        scroller.className = "relative w-full h-full overflow-auto no-scrollbar";
        const spacer = document.createElement("div");
        spacer.style.height = `${totalHeight}px`;
        spacer.style.position = "relative";
        scroller.appendChild(spacer);
        wrap.appendChild(scroller);

        const pool = new Map();

        function renderViewport() {
          const scrollTop = scroller.scrollTop;
          const viewH = scroller.clientHeight;
          const bufferRows = 3;

          const firstRow = Math.max(0, Math.floor(scrollTop / (cardH + (isGrid ? gap : 0))) - bufferRows);
          const lastRow  = Math.min(rows - 1, Math.floor((scrollTop + viewH) / (cardH + (isGrid ? gap : 0))) + bufferRows);

          const firstIndex = firstRow * cols;
          const lastIndex  = Math.min(total - 1, (lastRow + 1) * cols - 1);

          // Simple cleanup - remove out-of-view elements
          for (const [key, el] of pool) {
            const idx = Number(key);
            if (idx < firstIndex || idx > lastIndex) {
              el.remove();
              pool.delete(key);
            }
          }

          for (let i = firstIndex; i <= lastIndex; i++) {
            if (i < 0 || i >= total) continue;
            const key = String(i);
            if (pool.has(key)) continue;

            const item = items[i];
            const col = i % cols;
            const row = Math.floor(i / cols);
            const x = isGrid ? col * (cardW + gap) : 0;
            const y = row * (cardH + (isGrid ? gap : 0));

            const el = isGrid ? renderCard(item) : renderRow(item);
            el.style.position = "absolute";
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.width = `${isGrid ? cardW : wrap.clientWidth}px`;
            el.style.height = `${cardH}px`;

            spacer.appendChild(el);
            pool.set(key, el);
            // Keep playlist add-buttons in sync for newly mounted nodes
            updateLibraryPlaylistButtons();
          }
        }

        // Throttle renderViewport using requestAnimationFrame
        let renderTimer = null;
        function scheduleRenderViewport() {
          if (renderTimer) return;
          renderTimer = requestAnimationFrame(() => {
            renderViewport();
            renderTimer = null;
          });
        }
        scroller.addEventListener("scroll", scheduleRenderViewport, { passive: true });
        window.addEventListener("resize", () => mountVirtualizer(false), { once: true });

        renderViewport();
        if (resetScroll) scroller.scrollTop = 0;
      }

      function formatSize(bytes) {

      // ===== Thumbnails (lazy + concurrency limit + memory management) =====
      function cleanupThumbnailCache() {
        const now = Date.now();
        if (now - state.thumbs.lastCleanup < 30000) return; // Clean every 30s max
        state.thumbs.lastCleanup = now;
        
        if (state.thumbs.cache.size <= state.thumbs.maxCacheSize) return;
        
        // Remove oldest entries (LRU-style cleanup)
        const entries = Array.from(state.thumbs.cache.entries());
        const excess = entries.length - state.thumbs.maxCacheSize;
        const toDelete = entries.slice(0, excess);
        
        toDelete.forEach(([key, canvas]) => {
          if (canvas) {
            const ctx = canvas.getContext('2d');
            if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = canvas.height = 0;
          }
          state.thumbs.cache.delete(key);
        });
        
        console.log(`Cleaned ${excess} thumbnails from cache`);
      }

            if (!container.isConnected) return;

            state.viewer.autoScroll.lastTs = performance.now();

          });
          ro.observe(container);

          // Fallback: recompute on window resize when ResizeObserver is unavailable
          if (!state.viewer.layoutObserver) {

              if (!state.viewer.autoScroll.running) {
